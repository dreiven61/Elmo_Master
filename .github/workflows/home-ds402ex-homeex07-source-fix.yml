name: HomeDS402Ex HOMEEX-07 source correction

on:
  push:
    branches:
      - codex/home-ds402ex-homeex07-ownership
    paths:
      - '.github/workflows/home-ds402ex-homeex07-source-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correct-source:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout qualification branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/home-ds402ex-homeex07-ownership

      - name: Remove duplicated Encoder command case
        shell: pwsh
        run: |
          $path = 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCControlCommandService/LMCControlCommandService.st'
          $text = [System.IO.File]::ReadAllText($path).Replace("`r`n", "`n").Replace("`r", "`n")
          $wrong = @'
          0x7E53:
            identityExpectedSize := 116;
            identityMetadataValid :=
              (oldOwnerKind = LMC_OWNER_KIND_ENCODER) &
              (oldResourceKind =
               LMC_OWNER_RESOURCE_DIAGNOSTICS_SDO_ENGINE) &
              (oldAdmissionMode = LMC_OWNER_ADMISSION_LIFECYCLE) &
              (referenceAxisMask <> 0) &
              (referenceAxisMask <= 0x00000008) &
              (oldAxisMask = referenceAxisMask);
          '@
          $wrong = $wrong.Replace('          ', "`t`t").Replace('            ', "`t`t`t").Replace('              ', "`t`t`t`t").Replace('               ', "`t`t`t`t ")
          # The whitespace reconstruction above is intentionally not trusted as
          # the mutation anchor. Scope the correction to the exact function and
          # remove only a 0x7E53 branch whose identity size is 116.
          $functionRegex = [regex]::new('FUNCTION GLOBAL LMCControlCommandService::CopyAxisOwnershipPreemption(?s).*?END_FUNCTION')
          $functionMatches = $functionRegex.Matches($text)
          if ($functionMatches.Count -ne 1) { throw "Expected one CopyAxisOwnershipPreemption function, found $($functionMatches.Count)" }
          $original = $functionMatches[0].Value
          $badCaseRegex = [regex]::new('(?ms)^\s*0x7E53:\s*\n\s*identityExpectedSize\s*:=\s*116;\s*\n\s*identityMetadataValid\s*:=\s*\n\s*\(oldOwnerKind\s*=\s*LMC_OWNER_KIND_ENCODER\).*?^\s*\(oldAxisMask\s*=\s*referenceAxisMask\);\s*\n')
          $badMatches = $badCaseRegex.Matches($original)
          if ($badMatches.Count -ne 1) { throw "Expected exactly one duplicated 0x7E53/116 case, found $($badMatches.Count)" }
          $corrected = $badCaseRegex.Replace($original, '', 1)
          $encoder72 = [regex]::Matches($corrected, '(?ms)^\s*0x7E53:\s*\n\s*identityExpectedSize\s*:=\s*72;').Count
          $homeEx116 = [regex]::Matches($corrected, '(?ms)^\s*0x7D1B:\s*\n\s*identityExpectedSize\s*:=\s*116;').Count
          if ($encoder72 -ne 1) { throw "Expected one canonical 0x7E53/72 case after correction, found $encoder72" }
          if ($homeEx116 -ne 1) { throw "Expected one canonical 0x7D1B/116 case after correction, found $homeEx116" }
          $text = $text.Replace($original, $corrected)
          foreach ($ch in $text.ToCharArray()) {
            if ([int]$ch -gt 0x7F) { throw 'Corrected LASAL source is not 7-bit ASCII' }
          }
          [System.IO.File]::WriteAllText($path, $text, [System.Text.Encoding]::ASCII)
          git diff --check -- $path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify HOMEEX-07 ownership contract
        shell: pwsh
        run: |
          & .\tools\Verify-HomeDs402ExHomeex07Ownership.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $path = 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCControlCommandService/LMCControlCommandService.st'
          $text = Get-Content -LiteralPath $path -Raw
          $m = [regex]::Matches($text, 'FUNCTION GLOBAL LMCControlCommandService::CopyAxisOwnershipPreemption(?s).*?END_FUNCTION')
          if ($m.Count -ne 1) { throw 'CopyAxisOwnershipPreemption scope not unique' }
          $body = $m[0].Value
          if ([regex]::Matches($body, '(?ms)^\s*0x7E53:\s*\n\s*identityExpectedSize\s*:=\s*72;').Count -ne 1) { throw 'Encoder ownership identity size regression' }
          if ([regex]::Matches($body, '(?ms)^\s*0x7E53:\s*\n\s*identityExpectedSize\s*:=\s*116;').Count -ne 0) { throw 'Duplicated Encoder 116-byte case remains' }

      - name: Verify SetOperationMode define order
        shell: powershell
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\tools\Verify-SetOperationModeDefineOrder.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit corrected control source
        shell: pwsh
        run: |
          $path = 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCControlCommandService/LMCControlCommandService.st'
          git add -- $path
          $staged = @(git diff --cached --name-only)
          if ($staged.Count -ne 1 -or $staged[0] -ne $path) { throw "Unexpected staged files: $($staged -join ', ')" }
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(homeex): preserve encoder preemption identity case'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:codex/home-ds402ex-homeex07-ownership
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
