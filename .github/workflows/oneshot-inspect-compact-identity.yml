name: One-shot inspect compact identity verifier

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/oneshot-inspect-compact-identity.yml'

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Print next verifier failure context
        shell: pwsh
        run: |
          $path = 'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalContract.ps1'
          $lines = Get-Content -LiteralPath $path
          $patterns = @(
            'repeat proof or mutation-free output publication drifted',
            'mutation-free output publication',
            'repeat proof'
          )
          foreach ($pattern in $patterns) {
            Write-Host "===== $pattern ====="
            $matches = Select-String -LiteralPath $path -SimpleMatch $pattern
            foreach ($m in $matches) {
              $start=[Math]::Max(1,$m.LineNumber-130)
              $end=[Math]::Min($lines.Count,$m.LineNumber+130)
              Write-Host "LINES $start..$end (match $($m.LineNumber))"
              for($n=$start;$n -le $end;$n++){
                Write-Host (("{0,6}: {1}" -f $n,$lines[$n-1]))
              }
            }
          }

      - name: Print exact Reserve repeat and fresh publication blocks
        shell: pwsh
        run: |
          $path = 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCControlCommandService/LMCControlCommandService.st'
          $text = Get-Content -Raw -LiteralPath $path
          $m = [regex]::Match($text,'(?is)FUNCTION\s+GLOBAL\s+LMCControlCommandService::ReserveAxisOwnership\b.*?END_FUNCTION')
          if (-not $m.Success) { throw 'ReserveAxisOwnership not found.' }
          $arr = $m.Value -split "`r?`n"
          foreach ($needle in @('if repeatMode > 0 then','pEffectiveAxisMask^ := effectiveAxisMask;')) {
            Write-Host "===== $needle ====="
            $hits = $arr | Select-String -SimpleMatch $needle
            foreach($hit in $hits){
              $start=[Math]::Max(1,$hit.LineNumber-45)
              $end=[Math]::Min($arr.Count,$hit.LineNumber+90)
              for($n=$start;$n -le $end;$n++){
                Write-Host (("{0,6}: {1}" -f $n,$arr[$n-1]))
              }
            }
          }
