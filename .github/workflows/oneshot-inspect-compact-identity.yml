name: One-shot inspect compact identity verifier

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/oneshot-inspect-compact-identity.yml'

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Compute Reserve lexical fingerprint
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $path='Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCControlCommandService/LMCControlCommandService.st'
          $text=Get-Content -Raw -LiteralPath $path
          $m=[regex]::Match($text,'(?is)FUNCTION\s+GLOBAL\s+LMCControlCommandService::ReserveAxisOwnership\b.*?END_FUNCTION')
          if(-not $m.Success){throw 'ReserveAxisOwnership not found'}
          $scan=$m.Value
          $lexicalTokens=@([regex]::Matches($scan,'(?i)0x[0-9a-f]+|[A-Za-z_][A-Za-z0-9_]*|\d+|:=|<>|<=|>=|\+=|-=|\*=|/=|[^\s]')|ForEach-Object{$_.Value.ToLowerInvariant()})
          $inventory=[string]::Join('|',$lexicalTokens)
          $sha=[Security.Cryptography.SHA256]::Create()
          try{$hash=([BitConverter]::ToString($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($inventory)))).Replace('-','')}finally{$sha.Dispose()}
          Write-Host "LEX_COUNT=$($lexicalTokens.Count)"
          Write-Host "LEX_LENGTH=$($inventory.Length)"
          Write-Host "LEX_SHA256=$hash"
