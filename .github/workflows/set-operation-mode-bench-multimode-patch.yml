name: SetOperationMode bench multimode patch

on:
  push:
    branches:
      - codex/setopmode-mode11-bench-activation
    paths:
      - '.github/workflows/set-operation-mode-bench-multimode-patch.yml'

permissions:
  contents: write

jobs:
  patch-once:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact qualification branch
        uses: actions/checkout@v4
        with:
          ref: codex/setopmode-mode11-bench-activation
          fetch-depth: 0

      - name: Apply deterministic bench-only multimode patch
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          function Replace-Normalized {
            param(
              [Parameter(Mandatory=$true)][string]$Path,
              [Parameter(Mandatory=$true)][string]$Old,
              [Parameter(Mandatory=$true)][string]$New,
              [int]$ExpectedCount = 1
            )
            $text = [IO.File]::ReadAllText($Path)
            $newline = if ($text.Contains("`r`n")) { "`r`n" } else { "`n" }
            $normalized = $text.Replace("`r`n", "`n").Replace("`r", "`n")
            $oldNormalized = $Old.Replace("`r`n", "`n").Replace("`r", "`n")
            $newNormalized = $New.Replace("`r`n", "`n").Replace("`r", "`n")
            $count = 0
            $offset = 0
            while ($true) {
              $index = $normalized.IndexOf($oldNormalized, $offset, [StringComparison]::Ordinal)
              if ($index -lt 0) { break }
              $count++
              $offset = $index + $oldNormalized.Length
            }
            if ($count -ne $ExpectedCount) {
              throw "Replacement count mismatch for $Path: expected=$ExpectedCount actual=$count old=[$Old]"
            }
            $normalized = $normalized.Replace($oldNormalized, $newNormalized)
            $result = if ($newline -eq "`r`n") { $normalized.Replace("`n", "`r`n") } else { $normalized }
            [IO.File]::WriteAllText($Path, $result, (New-Object Text.UTF8Encoding($false)))
          }

          $diag = 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCDiagnosticsService/LMCDiagnosticsService.st'
          $sdk = 'LMC_Library/LMC_API_Delivery/src/LmcAdminSetOperationModeProtocol.cs'
          $wpf = 'LMC_Library/LasalApiWpfTestApp/LasalApiWpfTestApp/MainWindow.AxisSetOperationModeRecovery.cs'
          $readOnly = 'LMC_Library/LasalApiWpfTestApp/LasalApiWpfTestApp/MainWindow.ReadOnlyApi.cs'
          $sdkTests = 'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/AdminSetOperationModeContractTests.cs'
          $wpfTests = 'LMC_Library/LasalApiWpfTestApp/LasalApiWpfTestApp.SmokeTests/WpfAxisSetOperationModeRecoveryIntegrationTests.cs'
          $prepare = 'tools/Prepare-SetOperationModeMode11Bench.ps1'
          $candidate = 'tools/Verify-SetOperationModeMode11Candidate.ps1'

          # PLC: qualification-only allow-list. Production dev does not receive this define.
          Replace-Normalized $diag `
            '#define LMC_DIAG_SET_OPERATION_MODE_ENABLED TRUE' `
            "#define LMC_DIAG_SET_OPERATION_MODE_ENABLED TRUE`n#define LMC_DIAG_SET_OPERATION_MODE_BENCH_PRECONDITION_MODES TRUE"

          $oldGuard = 'elsif requestedMode <> 8 then'
          $newGuard = @'
elsif (requestedMode <> 8) &
	((LMC_DIAG_SET_OPERATION_MODE_BENCH_PRECONDITION_MODES = FALSE) |
	 ((requestedMode <> 1) & (requestedMode <> 3) & (requestedMode <> 7))) then
'@
          Replace-Normalized $diag $oldGuard $newGuard 2

          # The retained requested mode, not literal CSP=8, is the write/verify truth.
          $oldStartWrite = @'
	AxisOperationModeState[LMC_DIAG_MODE_RUNTIME_TIMEOUT_MS]$UDINT :=
		timeoutMilliseconds;
	AxisOperationModeState[LMC_DIAG_MODE_RUNTIME_WRITE_DATA] := 8;
'@
          $newStartWrite = @'
	AxisOperationModeState[LMC_DIAG_MODE_RUNTIME_TIMEOUT_MS]$UDINT :=
		timeoutMilliseconds;
	AxisOperationModeState[LMC_DIAG_MODE_RUNTIME_WRITE_DATA] := TO_DINT(requestedMode);
'@
          Replace-Normalized $diag $oldStartWrite $newStartWrite

          $oldRecoveryWrite = @'
				AxisOperationModeState[LMC_DIAG_MODE_RUNTIME_TIMEOUT_MS]$UDINT :=
					LMC_DIAG_MODE_RECOVERY_READ_TIMEOUT_MS;
				AxisOperationModeState[LMC_DIAG_MODE_RUNTIME_WRITE_DATA] := 8;
'@
          $newRecoveryWrite = @'
				AxisOperationModeState[LMC_DIAG_MODE_RUNTIME_TIMEOUT_MS]$UDINT :=
					LMC_DIAG_MODE_RECOVERY_READ_TIMEOUT_MS;
				AxisOperationModeState[LMC_DIAG_MODE_RUNTIME_WRITE_DATA] :=
					AxisOperationModeState[recoveryScanBase + 10];
'@
          Replace-Normalized $diag $oldRecoveryWrite $newRecoveryWrite
          Replace-Normalized $diag 'if observedMode = 8 then' 'if observedMode = AxisOperationModeState[recordBase + 10]$SINT then' 2

          # SDK: branch-only request/recovery allow-list. Homing and every other mode stay rejected.
          $oldSdkValidation = @'
            if (requestedMode
                != LMCDriveOperationMode.CyclicSynchronousPosition)
            {
                throw new NotSupportedException(
                    "SetOperationMode schema version 1 supports CSP mode 8 recovery only.");
            }
'@
          $newSdkValidation = @'
            var qualificationModeAllowed = requestedMode
                    == LMCDriveOperationMode.CyclicSynchronousPosition
                || requestedMode == LMCDriveOperationMode.ProfilePosition
                || requestedMode == LMCDriveOperationMode.ProfileVelocity
                || requestedMode == LMCDriveOperationMode.InterpolatedPosition;
            if (!qualificationModeAllowed)
            {
                throw new NotSupportedException(
                    "This MODE-11 qualification branch supports only PP(1), PV(3), IP(7), and CSP(8). Homing(6) remains owned by HomeDS402/HomeDS402Ex.");
            }
'@
          Replace-Normalized $sdk $oldSdkValidation $newSdkValidation

          # WPF: replace the fixed CSP label with a selectable explicit allow-list.
          Replace-Normalized $wpf `
            '        private ComboBox comboAxisSetOperationModeReference;' `
            "        private ComboBox comboAxisSetOperationModeReference;`n        private ComboBox comboAxisSetOperationModeRequestedMode;"

          $oldTestProperty = @'
        internal CheckBox AxisSetOperationModeConfirmationForTests
        {
            get { return checkAxisSetOperationModeOneShotConfirmed; }
        }
'@
          $newTestProperty = @'
        internal CheckBox AxisSetOperationModeConfirmationForTests
        {
            get { return checkAxisSetOperationModeOneShotConfirmed; }
        }

        internal ComboBox AxisSetOperationModeRequestedModeForTests
        {
            get { return comboAxisSetOperationModeRequestedMode; }
        }
'@
          Replace-Normalized $wpf $oldTestProperty $newTestProperty

          $oldRestore = @'
                    comboAxisSetOperationModeReference.SelectedItem =
                        record.AxisReference;
                    textAxisSetOperationModeTimeout.Text =
'@
          $newRestore = @'
                    comboAxisSetOperationModeReference.SelectedItem =
                        record.AxisReference;
                    comboAxisSetOperationModeRequestedMode.SelectedItem =
                        (LMCDriveOperationMode)record.RequestedModeRaw;
                    textAxisSetOperationModeTimeout.Text =
'@
          Replace-Normalized $wpf $oldRestore $newRestore

          Replace-Normalized $wpf `
            '                Header = "Set Operation Mode - CSP=8 / durable no-replay recovery"' `
            '                Header = "Set Operation Mode - bench target / durable no-replay recovery"'
          Replace-Normalized $wpf `
            '                Text = "CyclicSynchronousPosition (8)"' `
            '                Text = "Select qualification target below"'

          $oldModeAdd = '            inputs.Children.Add(modePanel);'
          $newModeAdd = @'
            inputs.Children.Add(modePanel);
            comboAxisSetOperationModeRequestedMode = new ComboBox
            {
                Width = 210,
                ItemsSource = new[]
                {
                    LMCDriveOperationMode.ProfilePosition,
                    LMCDriveOperationMode.ProfileVelocity,
                    LMCDriveOperationMode.InterpolatedPosition,
                    LMCDriveOperationMode.CyclicSynchronousPosition
                },
                SelectedItem = LMCDriveOperationMode.CyclicSynchronousPosition
            };
            comboAxisSetOperationModeRequestedMode.SelectionChanged +=
                AxisSetOperationModeInputChanged;
            modePanel.Children.Add(comboAxisSetOperationModeRequestedMode);
            modePanel.Children.Add(new TextBlock
            {
                Margin = new Thickness(0, 3, 12, 4),
                Foreground = Brushes.DarkOrange,
                TextWrapping = TextWrapping.Wrap,
                Text = "PP(1)/PV(3)/IP(7) are BENCH PRECONDITION ONLY. Ordinary motion remains prohibited until the axis is returned to CSP(8). Homing(6) is not available here."
            });
'@
          Replace-Normalized $wpf $oldModeAdd $newModeAdd

          Replace-Normalized $wpf `
            '                    Text = "I verified the exact powered drive/axis and understand that this writes DS402 0x6060:0 to CSP=8 once only. "' `
            '                    Text = "I verified the exact drive/axis and understand that this may write DS402 0x6060:0 to the selected qualification mode once only. PP/PV/IP are bench-precondition states only; I will not run ordinary motion until CSP=8 is restored. "'
          Replace-Normalized $wpf `
            '                Content = "Start CSP Once (0x7D23)",' `
            '                Content = "Start Selected Mode Once (0x7D23)",'

          $oldAxisSelected = @'
            var axisSelected = comboAxisSetOperationModeReference != null
                && comboAxisSetOperationModeReference.SelectedItem is ushort;
'@
          $newAxisSelected = @'
            var axisSelected = comboAxisSetOperationModeReference != null
                && comboAxisSetOperationModeReference.SelectedItem is ushort;
            var modeSelected = comboAxisSetOperationModeRequestedMode != null
                && comboAxisSetOperationModeRequestedMode.SelectedItem
                    is LMCDriveOperationMode;
'@
          Replace-Normalized $wpf $oldAxisSelected $newAxisSelected
          Replace-Normalized $wpf `
            '                && timeoutValid
                && axisSelected;' `
            '                && timeoutValid
                && axisSelected
                && modeSelected;'
          Replace-Normalized $wpf `
            '            comboAxisSetOperationModeReference.IsEnabled = idle && !active;' `
            "            comboAxisSetOperationModeReference.IsEnabled = idle && !active;`n            comboAxisSetOperationModeRequestedMode.IsEnabled = idle && !active;"
          Replace-Normalized $wpf `
            '                "Set Operation Mode CSP Once",' `
            '                "Set Operation Mode Selected Mode Once",'

          $oldStartInputs = @'
            var timeoutMilliseconds = RequireAxisSetOperationModeTimeout();
            var axisReference = RequireAxisSetOperationModeAxisReference();
            var currentConnection = RequireConnection();
'@
          $newStartInputs = @'
            var timeoutMilliseconds = RequireAxisSetOperationModeTimeout();
            var axisReference = RequireAxisSetOperationModeAxisReference();
            if (comboAxisSetOperationModeRequestedMode == null
                || !(comboAxisSetOperationModeRequestedMode.SelectedItem
                    is LMCDriveOperationMode))
            {
                throw new InvalidOperationException(
                    "A supported SetOperationMode qualification target is required.");
            }
            var requestedMode = (LMCDriveOperationMode)
                comboAxisSetOperationModeRequestedMode.SelectedItem;
            var currentConnection = RequireConnection();
'@
          Replace-Normalized $wpf $oldStartInputs $newStartInputs
          Replace-Normalized $wpf `
            '                LMCDriveOperationMode.CyclicSynchronousPosition,
                timeoutMilliseconds,' `
            '                requestedMode,
                timeoutMilliseconds,'

          Replace-Normalized $readOnly `
            '                "Set Operation Mode CSP Once",' `
            '                "Set Operation Mode Selected Mode Once",'

          # SDK contract: exact branch allow-list, with Homing and non-approved modes rejected.
          Replace-Normalized $sdkTests `
            '                "Contract.Admin.SetOperationMode.CspOnlyImmediate",
                CspOnlyImmediate);' `
            '                "Contract.Admin.SetOperationMode.BenchAllowListImmediate",
                BenchAllowListImmediate);'

          $oldCspTest = @'
        private static void CspOnlyImmediate()
        {
            AssertEx.Throws<NotSupportedException>(
                () => new LMCAxisSetOperationModeRecoveryKey(
                    1,
                    OriginalRequestId,
                    DiagnosticsBuild,
                    DiagnosticsBootId,
                    MapRevision,
                    Intent0,
                    Intent1,
                    Intent2,
                    Intent3,
                    2,
                    LMCDriveOperationMode.Homing,
                    TimeoutMilliseconds));
            AssertEx.Throws<ArgumentOutOfRangeException>(
                () => new LMCAxisSetOperationModeRecoveryKey(
                    1,
                    OriginalRequestId,
                    DiagnosticsBuild,
                    DiagnosticsBootId,
                    MapRevision,
                    Intent0,
                    Intent1,
                    Intent2,
                    Intent3,
                    2,
                    LMCDriveOperationMode.CyclicSynchronousPosition,
                    0));
            AssertEx.Throws<ArgumentException>(
                () => new LMCAxisSetOperationModeClientIntentId(
                    0,
                    0,
                    0,
                    0));
        }
'@
          $newCspTest = @'
        private static void BenchAllowListImmediate()
        {
            foreach (var allowed in new[]
            {
                LMCDriveOperationMode.ProfilePosition,
                LMCDriveOperationMode.ProfileVelocity,
                LMCDriveOperationMode.InterpolatedPosition,
                LMCDriveOperationMode.CyclicSynchronousPosition
            })
            {
                var key = new LMCAxisSetOperationModeRecoveryKey(
                    1,
                    OriginalRequestId,
                    DiagnosticsBuild,
                    DiagnosticsBootId,
                    MapRevision,
                    Intent0,
                    Intent1,
                    Intent2,
                    Intent3,
                    2,
                    allowed,
                    TimeoutMilliseconds);
                AssertEx.Equal(allowed, key.RequestedMode);
            }

            foreach (var blocked in new[]
            {
                LMCDriveOperationMode.NoModeAssigned,
                LMCDriveOperationMode.Velocity,
                LMCDriveOperationMode.ProfileTorque,
                LMCDriveOperationMode.Homing,
                LMCDriveOperationMode.CyclicSynchronousVelocity,
                LMCDriveOperationMode.CyclicSynchronousTorque
            })
            {
                AssertEx.Throws<NotSupportedException>(
                    () => new LMCAxisSetOperationModeRecoveryKey(
                        1,
                        OriginalRequestId,
                        DiagnosticsBuild,
                        DiagnosticsBootId,
                        MapRevision,
                        Intent0,
                        Intent1,
                        Intent2,
                        Intent3,
                        2,
                        blocked,
                        TimeoutMilliseconds));
            }

            AssertEx.Throws<ArgumentOutOfRangeException>(
                () => new LMCAxisSetOperationModeRecoveryKey(
                    1,
                    OriginalRequestId,
                    DiagnosticsBuild,
                    DiagnosticsBootId,
                    MapRevision,
                    Intent0,
                    Intent1,
                    Intent2,
                    Intent3,
                    2,
                    LMCDriveOperationMode.CyclicSynchronousPosition,
                    0));
            AssertEx.Throws<ArgumentException>(
                () => new LMCAxisSetOperationModeClientIntentId(
                    0,
                    0,
                    0,
                    0));
        }
'@
          Replace-Normalized $sdkTests $oldCspTest $newCspTest

          # WPF smoke coverage for the explicit mode selector.
          Replace-Normalized $wpfTests `
            '            tests.Add(
                "Wpf.SetOperationModeRecovery.DefinitiveRejectArchivesAndClearsInterlock",' `
            '            tests.Add(
                "Wpf.SetOperationModeRecovery.BenchModeSelectorIsExplicitAllowList",
                SetOperationModeBenchModeSelectorIsExplicitAllowList);
            tests.Add(
                "Wpf.SetOperationModeRecovery.DefinitiveRejectArchivesAndClearsInterlock",'

          $insertBeforeReject = @'
        private static void
            SetOperationModeDefinitiveRejectArchivesAndClearsInterlock()
'@
          $selectorTest = @'
        private static void SetOperationModeBenchModeSelectorIsExplicitAllowList()
        {
            var root = CreateSetOperationModeTemporaryDirectory();
            MainWindow window = null;
            try
            {
                window = new MainWindow(root);
                var selector = window.AxisSetOperationModeRequestedModeForTests;
                AssertEx.NotNull(selector);
                AssertEx.Equal(4, selector.Items.Count);
                AssertEx.True(selector.Items.Contains(
                    LMCDriveOperationMode.ProfilePosition));
                AssertEx.True(selector.Items.Contains(
                    LMCDriveOperationMode.ProfileVelocity));
                AssertEx.True(selector.Items.Contains(
                    LMCDriveOperationMode.InterpolatedPosition));
                AssertEx.True(selector.Items.Contains(
                    LMCDriveOperationMode.CyclicSynchronousPosition));
                AssertEx.False(selector.Items.Contains(
                    LMCDriveOperationMode.Homing));
                AssertEx.Equal(
                    LMCDriveOperationMode.CyclicSynchronousPosition,
                    (LMCDriveOperationMode)selector.SelectedItem);

                selector.SelectedItem = LMCDriveOperationMode.ProfilePosition;
                AssertEx.Equal(
                    LMCDriveOperationMode.ProfilePosition,
                    (LMCDriveOperationMode)selector.SelectedItem);
                AssertEx.False(
                    window.AxisSetOperationModeStartButtonForTests.IsEnabled);
            }
            finally
            {
                if (window != null)
                {
                    window.Close();
                }
                DeleteSetOperationModeTemporaryDirectory(root);
            }
        }

        private static void
            SetOperationModeDefinitiveRejectArchivesAndClearsInterlock()
'@
          Replace-Normalized $wpfTests $insertBeforeReject $selectorTest

          # Prepare verifier now recognizes the bench allow-list guards instead of literal CSP-only guards.
          Replace-Normalized $prepare `
            "    Assert-ExactCount `$Diagnostics 'elsif requestedMode <> 8 then' 2 'CSP=8-only request guards'" `
            "    Assert-MinimumCount `$Diagnostics 'LMC_DIAG_SET_OPERATION_MODE_BENCH_PRECONDITION_MODES = FALSE' 2 'bench precondition allow-list guards'"
          $oldSelfDiag = '    $diag = "prefix`r`n$DiagnosticsOff`r`nelsif requestedMode <> 8 then`r`nelsif requestedMode <> 8 then`r`nLMC_DIAG_MODE_EVIDENCE_WRITE_DISPATCHED`r`n"'
          $newSelfDiag = '    $diag = "prefix`r`n$DiagnosticsOff`r`nelsif (requestedMode <> 8) & (LMC_DIAG_SET_OPERATION_MODE_BENCH_PRECONDITION_MODES = FALSE) then`r`nelsif (requestedMode <> 8) & (LMC_DIAG_SET_OPERATION_MODE_BENCH_PRECONDITION_MODES = FALSE) then`r`nLMC_DIAG_MODE_EVIDENCE_WRITE_DISPATCHED`r`n"'
          Replace-Normalized $prepare $oldSelfDiag $newSelfDiag
          Replace-Normalized $prepare `
            "    Write-Host 'PASS MODE-11 source state: BENCH_ACTIVE (Diagnostics TRUE, Admin mask 0x00000717).'" `
            "    Write-Host 'PASS MODE-11 source state: BENCH_ACTIVE (Diagnostics TRUE, Admin mask 0x00000717, bench targets PP/PV/IP/CSP).'"

          # Candidate verifier: enforce exact qualification allow-list and requested-mode-driven runtime semantics.
          Replace-Normalized $candidate `
            "`$tcpPath = Join-Path `$repoRoot 'Lasal_PRG\\Elmo_EtherCAT_Test_4Axis\\Class\\TCPMotionInterface\\TCPMotionInterface.st'" `
            "`$tcpPath = Join-Path `$repoRoot 'Lasal_PRG\\Elmo_EtherCAT_Test_4Axis\\Class\\TCPMotionInterface\\TCPMotionInterface.st'`n`$sdkPath = Join-Path `$repoRoot 'LMC_Library\\LMC_API_Delivery\\src\\LmcAdminSetOperationModeProtocol.cs'"
          Replace-Normalized $candidate `
            'foreach ($path in @($diagnosticsPath, $controlPath, $tcpPath)) {' `
            'foreach ($path in @($diagnosticsPath, $controlPath, $tcpPath, $sdkPath)) {'
          Replace-Normalized $candidate `
            '$tcp = To-Lf ([IO.File]::ReadAllText($tcpPath))' `
            '$tcp = To-Lf ([IO.File]::ReadAllText($tcpPath))
$sdk = To-Lf ([IO.File]::ReadAllText($sdkPath))'
          Replace-Normalized $candidate `
            "Assert-Regex `$diagnostics 'elsif[\\t ]+requestedMode[\\t ]*<>[\\t ]*8[\\t ]+then' 'CSP=8-only validation exists at both Start and recovery-key boundaries' -ExpectedCount 2" `
            "Assert-Regex `$diagnostics '(?m)^#define[\\t ]+LMC_DIAG_SET_OPERATION_MODE_BENCH_PRECONDITION_MODES[\\t ]+TRUE[\\t ]*`$' 'qualification branch bench-precondition mode gate is TRUE' -ExpectedCount 1`nAssert-Regex `$diagnostics 'requestedMode[\\t ]*<>[\\t ]*1[\\s\\S]{0,120}requestedMode[\\t ]*<>[\\t ]*3[\\s\\S]{0,120}requestedMode[\\t ]*<>[\\t ]*7' 'PLC allow-list is exactly PP/PV/IP in addition to CSP' -ExpectedCount 2`nAssert-Regex `$sdk 'ProfilePosition[\\s\\S]{0,300}ProfileVelocity[\\s\\S]{0,300}InterpolatedPosition' 'SDK qualification allow-list contains PP/PV/IP/CSP' -MinimumCount 1`nAssert-Regex `$sdk 'Homing\\(6\\) remains owned by HomeDS402/HomeDS402Ex' 'SDK explicitly keeps Homing out of public SetOperationMode qualification path' -ExpectedCount 1"
          Replace-Normalized $candidate `
            'observedMode[\t ]*=[\t ]*8' `
            'observedMode[\t ]*=[\t ]*AxisOperationModeState\[recordBase \+ 10\]\$SINT' 2
          Replace-Normalized $candidate `
            "'same-mode CSP=8 path terminates before write-safety branch'" `
            "'same-requested-mode path terminates before write-safety branch'"
          Replace-Normalized $candidate `
            "Fail \"exact same-mode CSP=8 branch (count=`$(`$sameModeMatches.Count), expected=1)\"" `
            "Fail \"exact same-requested-mode branch (count=`$(`$sameModeMatches.Count), expected=1)\""
          Replace-Normalized $candidate `
            "Pass 'exact same-mode CSP=8 branch'" `
            "Pass 'exact same-requested-mode branch'"
          Replace-Normalized $candidate `
            "    Assert-Regex `$mutation 'LMC_DIAG_MODE_EVIDENCE_WRITE_DISPATCHED' 'mutation helper persists write-dispatch evidence' -MinimumCount 1" `
            "    Assert-Regex `$mutation 'LMC_DIAG_MODE_EVIDENCE_WRITE_DISPATCHED' 'mutation helper persists write-dispatch evidence' -MinimumCount 1`n    Assert-Regex `$diagnostics 'LMC_DIAG_MODE_RUNTIME_WRITE_DATA\\][\\t ]*:=[\\t ]*8;' 'runtime write data is never hard-coded to CSP=8' -ExpectedCount 0`n    Assert-Regex `$diagnostics 'LMC_DIAG_MODE_RUNTIME_WRITE_DATA\\][\\t ]*:=[\\t ]*TO_DINT\\(requestedMode\\)' 'new Start binds write data to requested mode' -ExpectedCount 1`n    Assert-Regex `$diagnostics 'LMC_DIAG_MODE_RUNTIME_WRITE_DATA\\][\\t ]*:=[\\t ]*[\\r\\n\\t ]*AxisOperationModeState\\[recoveryScanBase \\+ 10\\]' 'warm recovery restores retained requested mode as write-data identity' -ExpectedCount 1"

          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & '.\tools\Prepare-SetOperationModeMode11Bench.ps1' -Verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & '.\tools\Verify-SetOperationModeMode11Candidate.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit qualification-only multimode support
        shell: powershell
        run: |
          $expected = @(
            'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCDiagnosticsService/LMCDiagnosticsService.st',
            'LMC_Library/LMC_API_Delivery/src/LmcAdminSetOperationModeProtocol.cs',
            'LMC_Library/LasalApiWpfTestApp/LasalApiWpfTestApp/MainWindow.AxisSetOperationModeRecovery.cs',
            'LMC_Library/LasalApiWpfTestApp/LasalApiWpfTestApp/MainWindow.ReadOnlyApi.cs',
            'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/AdminSetOperationModeContractTests.cs',
            'LMC_Library/LasalApiWpfTestApp/LasalApiWpfTestApp.SmokeTests/WpfAxisSetOperationModeRecoveryIntegrationTests.cs',
            'tools/Prepare-SetOperationModeMode11Bench.ps1',
            'tools/Verify-SetOperationModeMode11Candidate.ps1'
          )
          $changed = @(git diff --name-only)
          foreach ($path in $changed) {
            if ($expected -notcontains $path) {
              Write-Error "Unexpected changed path: $path"
              exit 1
            }
          }
          foreach ($path in $expected) {
            if ($changed -notcontains $path) {
              Write-Error "Expected changed path missing: $path"
              exit 1
            }
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $expected
          git commit -m 'test(mode): add bench precondition mode selector'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:codex/setopmode-mode11-bench-activation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
