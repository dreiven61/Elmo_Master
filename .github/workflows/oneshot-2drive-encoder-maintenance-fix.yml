name: One-shot 2-drive encoder maintenance fix

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/oneshot-2drive-encoder-maintenance-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: windows-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply source patch
        shell: pwsh
        run: |
          $path = '.github/scripts/patch-2drive-encoder-maintenance.py'
          $text = Get-Content -Raw $path
          $old = @'
              if text.find(start_marker, start + len(start_marker)) >= 0:
                  raise RuntimeError(f"{path}: start marker is not unique")
          '@
          if (-not $text.Contains($old)) {
              throw 'Temporary patch helper guard was not found.'
          }
          $text = $text.Replace($old, '')
          [System.IO.File]::WriteAllText(
              $path,
              $text,
              [System.Text.UTF8Encoding]::new($false))
          python $path

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build API Debug
        run: msbuild LMC_Library\LMC_API_Delivery\src\LasalMotionControlLib.csproj /t:Rebuild /p:Configuration=Debug /nologo

      - name: Build WPF solution Debug
        run: msbuild LMC_Library\LasalApiWpfTestApp\LasalApiWpfTestApp.sln /t:Rebuild /p:Configuration=Debug /nologo

      - name: Commit patch and remove temporary files
        shell: bash
        run: |
          rm -f .github/workflows/oneshot-2drive-encoder-maintenance-fix.yml
          rm -f .github/scripts/patch-2drive-encoder-maintenance.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m "fix: support encoder maintenance with two physical drives"
          git push origin HEAD:dev
