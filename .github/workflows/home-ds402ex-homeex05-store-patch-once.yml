name: HomeDS402Ex HOMEEX-05 retained store patch once

on:
  push:
    branches:
      - codex/home-ds402ex-homeex05-retained-store
    paths:
      - '.github/workflows/home-ds402ex-homeex05-store-patch-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch retained HomeDS402Ex store
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCDiagnosticsService/LMCDiagnosticsService.st')
          text = path.read_text(encoding='utf-8').replace('\r\n', '\n')

          macro_anchor = '#define LMC_DIAG_HOMEEX_RECORD_STRIDE 40\n'
          macro_insert = '''#define LMC_DIAG_HOMEEX_RECORD_STRIDE 40
          #define LMC_DIAG_HOMEEX_RETIRED_BASE 160
          #define LMC_DIAG_HOMEEX_RETIRED_STRIDE 24
          #define LMC_DIAG_HOMEEX_RETIRED_MAGIC 0x48585254
          #define LMC_DIAG_HOMEEX_CLEANUP_PROOF_REQUIRED 0x0000003F
          '''
          macro_insert = '\n'.join(line.strip() for line in macro_insert.splitlines() if line.strip()) + '\n'
          if text.count(macro_anchor) != 1:
              raise SystemExit('Expected one HOMEEX record-stride macro anchor.')
          text = text.replace(macro_anchor, macro_insert, 1)

          def replace_function(name, replacement):
              global text
              pattern = re.compile(r'(?ms)^FUNCTION LMCDiagnosticsService::' + re.escape(name) + r'\b.*?^END_FUNCTION\s*$')
              matches = list(pattern.finditer(text))
              if len(matches) != 1:
                  raise SystemExit(f'Expected one {name} implementation, found {len(matches)}.')
              text = text[:matches[0].start()] + replacement.strip() + '\n' + text[matches[0].end():]

          start = r'''
          FUNCTION LMCDiagnosticsService::HandleAxisDs402HomeExStart
          	VAR_INPUT
          		Reference 	: UINT;
          		pRequest 	: ^USINT;
          		pResponse 	: ^USINT;
          		ResponseCapacity 	: UDINT;
          		CallerSessionEpoch 	: UDINT;
          		RequestSequence 	: UDINT;
          		AdmissionToken 	: UDINT;
          		OwnerGeneration 	: UDINT;
          		RequestSize 	: UDINT;
          	END_VAR
          	VAR_OUTPUT
          		ResponseSize 	: DINT;
          	END_VAR
          	VAR
          		schemaVersion, requestFlags, bufferMode, reservedValue : UINT;
          		requestId, diagnosticsBuild, bootId, mapRevision : UDINT;
          		intent0, intent1, intent2, intent3 : UDINT;
          		overallTimeout, detectionTimeout, currentBootId : UDINT;
          		detailCode : UDINT;
          		homingMethod : DINT;
          		positionRaw : UDINT;
          		axisMask : UDINT;
          		spareIndex, recordIndex, recordBase, tombstoneBase : DINT;
          		recordState : DINT;
          		ownerResult : DINT;
          		spareZero, methodCandidate, recordDirty, recordValid : BOOL;
          		retiredDuplicate, tombstoneValid : BOOL;
          	END_VAR

          	ResponseSize := -1;
          	if (pResponse = NIL) | (ResponseCapacity < 16) then
          		RETURN;
          	end_if;
          	_memset(dest:=pResponse, usByte:=0, cntr:=ResponseCapacity);
          	pResponse^$UINT := LMC_DIAG_SCHEMA_VERSION;
          	(pResponse + 4)^$UINT := 1;
          	(pResponse + 6)^$INT := LMC_DIAG_ADMIN_ERROR_ID;
          	requestId := 0;
          	homingMethod := 0;
          	if (pRequest <> NIL) & (RequestSize >= 8) then
          		requestId := (pRequest + 4)^$UDINT;
          	end_if;
          	if (pRequest <> NIL) & (RequestSize >= 40) then
          		homingMethod := (pRequest + 36)^$DINT;
          	end_if;
          	(pResponse + 8)^$UDINT := requestId;
          	ResponseSize := 16;

          	if pRequest = NIL then
          		detailCode := 5;
          	elsif (Reference < 1) | (Reference > 4) then
          		detailCode := 4;
          	elsif RequestSize <> 116 then
          		detailCode := 5;
          	else
          		schemaVersion := pRequest^$UINT;
          		requestFlags := (pRequest + 2)^$UINT;
          		diagnosticsBuild := (pRequest + 8)^$UDINT;
          		bootId := (pRequest + 12)^$UDINT;
          		mapRevision := (pRequest + 16)^$UDINT;
          		intent0 := (pRequest + 20)^$UDINT;
          		intent1 := (pRequest + 24)^$UDINT;
          		intent2 := (pRequest + 28)^$UDINT;
          		intent3 := (pRequest + 32)^$UDINT;
          		homingMethod := (pRequest + 36)^$DINT;
          		positionRaw := (pRequest + 40)^$UDINT;
          		bufferMode := (pRequest + 68)^$UINT;
          		reservedValue := (pRequest + 70)^$UINT;
          		overallTimeout := (pRequest + 72)^$UDINT;
          		detectionTimeout := (pRequest + 76)^$UDINT;
          		spareZero := TRUE;
          		spareIndex := 80;
          		while spareIndex <= 111 do
          			if (pRequest + TO_UDINT(spareIndex))^$USINT <> 0 then
          				spareZero := FALSE;
          			end_if;
          			spareIndex += 1;
          		end_while;
          		methodCandidate :=
          			((homingMethod >= 1) & (homingMethod <= 14)) |
          			((homingMethod >= 17) & (homingMethod <= 30)) |
          			((homingMethod >= 33) & (homingMethod <= 34));
          		currentBootId := GetDiagnosticsBootId();

          		if schemaVersion <> LMC_DIAG_SCHEMA_VERSION then
          			detailCode := 1;
          		elsif requestFlags <> 0 then
          			detailCode := 2;
          		elsif requestId = 0 then
          			detailCode := 3;
          		elsif diagnosticsBuild <> 1 then
          			detailCode := 16;
          		elsif (currentBootId = 0) | (bootId <> currentBootId) then
          			detailCode := 17;
          		elsif mapRevision <> LMC_DIAG_MAP_REVISION then
          			detailCode := 18;
          		elsif (CallerSessionEpoch = 0) | (RequestSequence = 0) then
          			detailCode := 5;
          		elsif ((intent0 = 0) & (intent1 = 0) &
          		       (intent2 = 0) & (intent3 = 0)) |
          		      (bufferMode <> 1) | (reservedValue <> 0) |
          		      (overallTimeout = 0) | (detectionTimeout = 0) |
          		      (spareZero = FALSE) |
          		      ((pRequest + 112)^$UDINT <> LMC_DIAG_HOMEEX_EXECUTE_TOKEN) then
          			detailCode := 5;
          		elsif (methodCandidate = FALSE) | (positionRaw = 0x80000000) then
          			detailCode := LMC_DIAG_HOMEEX_DETAIL_INVALID_PROFILE;
          		elsif (AdmissionToken = 0) | (OwnerGeneration = 0) |
          		      (IsClientConnected(#AxisOwnership) = FALSE) then
          			detailCode := 42;
          		else
          			axisMask := TO_UDINT(1) shl TO_UDINT(Reference - 1);
          			ownerResult := AxisOwnership.ValidateAxisOwnershipIdentity(
          				CommandId:=0x7D1B,
          				Reference:=Reference,
          				ExpectedAxisMask:=axisMask,
          				OwnerKind:=LMC_DIAG_OWNER_KIND_DS402_HOME_EX,
          				ResourceKind:=LMC_DIAG_RESOURCE_DS402_HOME,
          				AdmissionMode:=LMC_DIAG_ADMISSION_LIFECYCLE,
          				CallerSessionEpoch:=CallerSessionEpoch,
          				RequestSequence:=RequestSequence,
          				AdmissionToken:=AdmissionToken,
          				OwnerGeneration:=OwnerGeneration,
          				RequiredPhase:=LMC_DIAG_OWNER_PHASE_RESERVED,
          				pIdentity:=pRequest$^void,
          				IdentitySize:=RequestSize);
          			if ownerResult <> 0 then
          				detailCode := 42;
          			else
          				recordBase := TO_DINT(Reference - 1) * LMC_DIAG_HOMEEX_RECORD_STRIDE;
          				tombstoneBase := LMC_DIAG_HOMEEX_RETIRED_BASE +
          					TO_DINT(Reference - 1) * LMC_DIAG_HOMEEX_RETIRED_STRIDE;
          				recordDirty := FALSE;
          				recordIndex := 0;
          				while recordIndex < LMC_DIAG_HOMEEX_RECORD_STRIDE do
          					if Ds402HomeExState[recordBase + recordIndex] <> 0 then
          						recordDirty := TRUE;
          					end_if;
          					recordIndex += 1;
          				end_while;
          				recordState := Ds402HomeExState[recordBase];
          				recordValid :=
          					recordDirty & (recordState >= 1) & (recordState <= 4) &
          					(Ds402HomeExState[recordBase + 1]$UDINT <> 0) &
          					(Ds402HomeExState[recordBase + 2]$UDINT <> 0) &
          					(Ds402HomeExState[recordBase + 3]$UDINT <> 0) &
          					(Ds402HomeExState[recordBase + 4]$UDINT <> 0) &
          					((Ds402HomeExState[recordBase + 5] <> 0) |
          					 (Ds402HomeExState[recordBase + 6] <> 0) |
          					 (Ds402HomeExState[recordBase + 7] <> 0) |
          					 (Ds402HomeExState[recordBase + 8] <> 0)) &
          					(Ds402HomeExState[recordBase + 9] = TO_DINT(Reference)) &
          					(Ds402HomeExState[recordBase + 11]$UDINT <> 0x80000000) &
          					(Ds402HomeExState[recordBase + 18] = 1) &
          					(Ds402HomeExState[recordBase + 19]$UDINT <> 0) &
          					(Ds402HomeExState[recordBase + 20]$UDINT <> 0) &
          					(Ds402HomeExState[recordBase + 21] = 0) &
          					(Ds402HomeExState[recordBase + 22] = 0) &
          					(Ds402HomeExState[recordBase + 23] = 0) &
          					(Ds402HomeExState[recordBase + 24] = 0) &
          					(Ds402HomeExState[recordBase + 25] = 0) &
          					(Ds402HomeExState[recordBase + 26] = 0) &
          					(Ds402HomeExState[recordBase + 27] = 0) &
          					(Ds402HomeExState[recordBase + 28] = 0) &
          					(Ds402HomeExState[recordBase + 34]$UDINT <> 0) &
          					(Ds402HomeExState[recordBase + 37]$UDINT <> 0);
          				if recordDirty then
          					if recordValid = FALSE then
          						detailCode := LMC_DIAG_HOMEEX_DETAIL_STORE_CORRUPT;
          					elsif (recordState <> 1) &
          						((Ds402HomeExState[recordBase + 38]$UDINT and
          						  LMC_DIAG_HOMEEX_CLEANUP_PROOF_REQUIRED) <>
          						 LMC_DIAG_HOMEEX_CLEANUP_PROOF_REQUIRED) then
          						detailCode := LMC_DIAG_HOMEEX_DETAIL_CLEANUP_INCOMPLETE;
          					else
          						detailCode := LMC_DIAG_HOMEEX_DETAIL_SLOT_OCCUPIED;
          					end_if;
          				else
          					tombstoneValid :=
          						(Ds402HomeExState[tombstoneBase] = 0) |
          						((Ds402HomeExState[tombstoneBase]$UDINT = LMC_DIAG_HOMEEX_RETIRED_MAGIC) &
          						 (Ds402HomeExState[tombstoneBase + 1]$UDINT <> 0) &
          						 (Ds402HomeExState[tombstoneBase + 2]$UDINT <> 0) &
          						 (Ds402HomeExState[tombstoneBase + 3]$UDINT <> 0) &
          						 (Ds402HomeExState[tombstoneBase + 4]$UDINT <> 0) &
          						 ((Ds402HomeExState[tombstoneBase + 5] <> 0) |
          						  (Ds402HomeExState[tombstoneBase + 6] <> 0) |
          						  (Ds402HomeExState[tombstoneBase + 7] <> 0) |
          						  (Ds402HomeExState[tombstoneBase + 8] <> 0)) &
          						 (Ds402HomeExState[tombstoneBase + 9] = TO_DINT(Reference)) &
          						 (Ds402HomeExState[tombstoneBase + 18] = 1) &
          						 (Ds402HomeExState[tombstoneBase + 19]$UDINT <> 0) &
          						 (Ds402HomeExState[tombstoneBase + 20]$UDINT <> 0) &
          						 (Ds402HomeExState[tombstoneBase + 21]$UDINT <> 0) &
          						 (Ds402HomeExState[tombstoneBase + 22] >= 2) &
          						 (Ds402HomeExState[tombstoneBase + 22] <= 4) &
          						 (Ds402HomeExState[tombstoneBase + 23] = 0));
          					if tombstoneValid = FALSE then
          						detailCode := LMC_DIAG_HOMEEX_DETAIL_STORE_CORRUPT;
          					else
          						retiredDuplicate :=
          							(Ds402HomeExState[tombstoneBase]$UDINT = LMC_DIAG_HOMEEX_RETIRED_MAGIC) &
          							(Ds402HomeExState[tombstoneBase + 1]$UDINT = diagnosticsBuild) &
          							(Ds402HomeExState[tombstoneBase + 2]$UDINT = bootId) &
          							(Ds402HomeExState[tombstoneBase + 3]$UDINT = mapRevision) &
          							(Ds402HomeExState[tombstoneBase + 4]$UDINT = requestId) &
          							(Ds402HomeExState[tombstoneBase + 5]$UDINT = intent0) &
          							(Ds402HomeExState[tombstoneBase + 6]$UDINT = intent1) &
          							(Ds402HomeExState[tombstoneBase + 7]$UDINT = intent2) &
          							(Ds402HomeExState[tombstoneBase + 8]$UDINT = intent3) &
          							(Ds402HomeExState[tombstoneBase + 9] = TO_DINT(Reference)) &
          							(Ds402HomeExState[tombstoneBase + 10] = homingMethod) &
          							(Ds402HomeExState[tombstoneBase + 11] = (pRequest + 40)^$DINT) &
          							(Ds402HomeExState[tombstoneBase + 12] = (pRequest + 44)^$DINT) &
          							(Ds402HomeExState[tombstoneBase + 13] = (pRequest + 48)^$DINT) &
          							(Ds402HomeExState[tombstoneBase + 14] = (pRequest + 52)^$DINT) &
          							(Ds402HomeExState[tombstoneBase + 15] = (pRequest + 56)^$DINT) &
          							(Ds402HomeExState[tombstoneBase + 16] = (pRequest + 60)^$DINT) &
          							(Ds402HomeExState[tombstoneBase + 17] = (pRequest + 64)^$DINT) &
          							(Ds402HomeExState[tombstoneBase + 18] = TO_DINT(bufferMode)) &
          							(Ds402HomeExState[tombstoneBase + 19]$UDINT = overallTimeout) &
          							(Ds402HomeExState[tombstoneBase + 20]$UDINT = detectionTimeout);
          						if retiredDuplicate then
          							detailCode := LMC_DIAG_HOMEEX_DETAIL_SLOT_OCCUPIED;
          						elsif LMC_DIAG_DS402_HOME_EX_ENABLED = FALSE then
          							detailCode := LMC_DIAG_HOMEEX_DETAIL_INVALID_PROFILE;
          						else
          							// HOMEEX-05 retained-store behavior is ready. HOMEEX-08
          							// still owns parameter SDO and physical homing execution.
          							detailCode := LMC_DIAG_HOMEEX_DETAIL_STORAGE;
          						end_if;
          					end_if;
          				end_if;
          			end_if;
          		end_if;
          	end_if;

          	(pResponse + 12)^$UDINT := detailCode;
          	if detailCode >= 16 then
          		if ResponseCapacity < 24 then
          			ResponseSize := -1;
          			RETURN;
          		end_if;
          		(pResponse + 16)^$DINT := homingMethod;
          		(pResponse + 20)^$UDINT := 0;
          		ResponseSize := 24;
          	end_if;

          END_FUNCTION
          '''

          outcome = r'''
          FUNCTION LMCDiagnosticsService::HandleAxisDs402HomeExOutcome
          	VAR_INPUT
          		Reference 	: UINT;
          		pRequest 	: ^USINT;
          		pResponse 	: ^USINT;
          		ResponseCapacity 	: UDINT;
          		CallerSessionEpoch 	: UDINT;
          		RequestSize 	: UDINT;
          	END_VAR
          	VAR_OUTPUT
          		ResponseSize 	: DINT;
          	END_VAR
          	VAR
          		schemaVersion, requestFlags, bufferMode, reservedValue : UINT;
          		requestId, diagnosticsBuild, bootId, mapRevision : UDINT;
          		originalRequestId, intent0, intent1, intent2, intent3 : UDINT;
          		overallTimeout, detectionTimeout, currentBootId : UDINT;
          		detailCode : UDINT;
          		homingMethod : DINT;
          		positionRaw : UDINT;
          		spareIndex, recordBase : DINT;
          		recordState : DINT;
          		spareZero, methodCandidate, recordValid, keyMatches : BOOL;
          	END_VAR

          	ResponseSize := -1;
          	if (pResponse = NIL) | (ResponseCapacity < 16) then
          		RETURN;
          	end_if;
          	_memset(dest:=pResponse, usByte:=0, cntr:=ResponseCapacity);
          	pResponse^$UINT := LMC_DIAG_SCHEMA_VERSION;
          	(pResponse + 4)^$UINT := 1;
          	(pResponse + 6)^$INT := LMC_DIAG_ADMIN_ERROR_ID;
          	requestId := 0;
          	if (pRequest <> NIL) & (RequestSize >= 8) then
          		requestId := (pRequest + 4)^$UDINT;
          	end_if;
          	(pResponse + 8)^$UDINT := requestId;
          	ResponseSize := 16;

          	if pRequest = NIL then
          		detailCode := 5;
          	elsif (Reference < 1) | (Reference > 4) then
          		detailCode := 4;
          	elsif RequestSize <> 116 then
          		detailCode := 5;
          	else
          		schemaVersion := pRequest^$UINT;
          		requestFlags := (pRequest + 2)^$UINT;
          		diagnosticsBuild := (pRequest + 8)^$UDINT;
          		bootId := (pRequest + 12)^$UDINT;
          		mapRevision := (pRequest + 16)^$UDINT;
          		originalRequestId := (pRequest + 20)^$UDINT;
          		intent0 := (pRequest + 24)^$UDINT;
          		intent1 := (pRequest + 28)^$UDINT;
          		intent2 := (pRequest + 32)^$UDINT;
          		intent3 := (pRequest + 36)^$UDINT;
          		homingMethod := (pRequest + 40)^$DINT;
          		positionRaw := (pRequest + 44)^$UDINT;
          		bufferMode := (pRequest + 72)^$UINT;
          		reservedValue := (pRequest + 74)^$UINT;
          		overallTimeout := (pRequest + 76)^$UDINT;
          		detectionTimeout := (pRequest + 80)^$UDINT;
          		spareZero := TRUE;
          		spareIndex := 84;
          		while spareIndex <= 115 do
          			if (pRequest + TO_UDINT(spareIndex))^$USINT <> 0 then
          				spareZero := FALSE;
          			end_if;
          			spareIndex += 1;
          		end_while;
          		methodCandidate :=
          			((homingMethod >= 1) & (homingMethod <= 14)) |
          			((homingMethod >= 17) & (homingMethod <= 30)) |
          			((homingMethod >= 33) & (homingMethod <= 34));
          		currentBootId := GetDiagnosticsBootId();

          		if schemaVersion <> LMC_DIAG_SCHEMA_VERSION then
          			detailCode := 1;
          		elsif requestFlags <> 0 then
          			detailCode := 2;
          		elsif requestId = 0 then
          			detailCode := 3;
          		elsif diagnosticsBuild <> 1 then
          			detailCode := 16;
          		elsif (currentBootId = 0) | (bootId <> currentBootId) then
          			detailCode := 17;
          		elsif mapRevision <> LMC_DIAG_MAP_REVISION then
          			detailCode := 18;
          		elsif (CallerSessionEpoch = 0) | (originalRequestId = 0) |
          		      ((intent0 = 0) & (intent1 = 0) &
          		       (intent2 = 0) & (intent3 = 0)) |
          		      (bufferMode <> 1) | (reservedValue <> 0) |
          		      (overallTimeout = 0) | (detectionTimeout = 0) |
          		      (spareZero = FALSE) | (methodCandidate = FALSE) |
          		      (positionRaw = 0x80000000) then
          			detailCode := 5;
          		else
          			recordBase := TO_DINT(Reference - 1) * LMC_DIAG_HOMEEX_RECORD_STRIDE;
          			recordState := Ds402HomeExState[recordBase];
          			if recordState = 0 then
          				detailCode := LMC_DIAG_HOMEEX_DETAIL_NOT_FOUND;
          			else
          				recordValid :=
          					(recordState >= 1) & (recordState <= 4) &
          					(Ds402HomeExState[recordBase + 1]$UDINT <> 0) &
          					(Ds402HomeExState[recordBase + 2]$UDINT <> 0) &
          					(Ds402HomeExState[recordBase + 3]$UDINT <> 0) &
          					(Ds402HomeExState[recordBase + 4]$UDINT <> 0) &
          					((Ds402HomeExState[recordBase + 5] <> 0) |
          					 (Ds402HomeExState[recordBase + 6] <> 0) |
          					 (Ds402HomeExState[recordBase + 7] <> 0) |
          					 (Ds402HomeExState[recordBase + 8] <> 0)) &
          					(Ds402HomeExState[recordBase + 9] = TO_DINT(Reference)) &
          					(Ds402HomeExState[recordBase + 18] = 1) &
          					(Ds402HomeExState[recordBase + 19]$UDINT <> 0) &
          					(Ds402HomeExState[recordBase + 20]$UDINT <> 0) &
          					(Ds402HomeExState[recordBase + 21] = 0) &
          					(Ds402HomeExState[recordBase + 22] = 0) &
          					(Ds402HomeExState[recordBase + 23] = 0) &
          					(Ds402HomeExState[recordBase + 24] = 0) &
          					(Ds402HomeExState[recordBase + 25] = 0) &
          					(Ds402HomeExState[recordBase + 26] = 0) &
          					(Ds402HomeExState[recordBase + 27] = 0) &
          					(Ds402HomeExState[recordBase + 28] = 0) &
          					(Ds402HomeExState[recordBase + 34]$UDINT <> 0) &
          					(Ds402HomeExState[recordBase + 37]$UDINT <> 0);
          				if recordState = 1 then
          					recordValid := recordValid &
          						(Ds402HomeExState[recordBase + 35] = 0);
          				else
          					recordValid := recordValid &
          						(Ds402HomeExState[recordBase + 35]$UDINT >=
          						 Ds402HomeExState[recordBase + 34]$UDINT);
          				end_if;
          				if recordValid = FALSE then
          					detailCode := LMC_DIAG_HOMEEX_DETAIL_STORE_CORRUPT;
          				else
          					keyMatches :=
          						(Ds402HomeExState[recordBase + 1]$UDINT = diagnosticsBuild) &
          						(Ds402HomeExState[recordBase + 2]$UDINT = bootId) &
          						(Ds402HomeExState[recordBase + 3]$UDINT = mapRevision) &
          						(Ds402HomeExState[recordBase + 4]$UDINT = originalRequestId) &
          						(Ds402HomeExState[recordBase + 5]$UDINT = intent0) &
          						(Ds402HomeExState[recordBase + 6]$UDINT = intent1) &
          						(Ds402HomeExState[recordBase + 7]$UDINT = intent2) &
          						(Ds402HomeExState[recordBase + 8]$UDINT = intent3) &
          						(Ds402HomeExState[recordBase + 9] = TO_DINT(Reference)) &
          						(Ds402HomeExState[recordBase + 10] = homingMethod) &
          						(Ds402HomeExState[recordBase + 11] = (pRequest + 44)^$DINT) &
          						(Ds402HomeExState[recordBase + 12] = (pRequest + 48)^$DINT) &
          						(Ds402HomeExState[recordBase + 13] = (pRequest + 52)^$DINT) &
          						(Ds402HomeExState[recordBase + 14] = (pRequest + 56)^$DINT) &
          						(Ds402HomeExState[recordBase + 15] = (pRequest + 60)^$DINT) &
          						(Ds402HomeExState[recordBase + 16] = (pRequest + 64)^$DINT) &
          						(Ds402HomeExState[recordBase + 17] = (pRequest + 68)^$DINT) &
          						(Ds402HomeExState[recordBase + 18] = TO_DINT(bufferMode)) &
          						(Ds402HomeExState[recordBase + 19]$UDINT = overallTimeout) &
          						(Ds402HomeExState[recordBase + 20]$UDINT = detectionTimeout);
          					if keyMatches = FALSE then
          						detailCode := LMC_DIAG_HOMEEX_DETAIL_KEY_MISMATCH;
          					elsif (recordState <> 1) &
          						((Ds402HomeExState[recordBase + 38]$UDINT and
          						  LMC_DIAG_HOMEEX_CLEANUP_PROOF_REQUIRED) <>
          						 LMC_DIAG_HOMEEX_CLEANUP_PROOF_REQUIRED) then
          						detailCode := LMC_DIAG_HOMEEX_DETAIL_CLEANUP_INCOMPLETE;
          					elsif ResponseCapacity < 176 then
          						ResponseSize := -1;
          						RETURN;
          					else
          						(pResponse + 4)^$UINT := 0;
          						(pResponse + 6)^$INT := 0;
          						(pResponse + 12)^$UDINT := 0;
          						(pResponse + 16)^$UINT := TO_UINT(recordState);
          						(pResponse + 18)^$UINT := 0;
          						(pResponse + 20)^$UDINT := Ds402HomeExState[recordBase + 1]$UDINT;
          						(pResponse + 24)^$UDINT := Ds402HomeExState[recordBase + 2]$UDINT;
          						(pResponse + 28)^$UDINT := Ds402HomeExState[recordBase + 3]$UDINT;
          						(pResponse + 32)^$UDINT := Ds402HomeExState[recordBase + 4]$UDINT;
          						(pResponse + 36)^$UDINT := Ds402HomeExState[recordBase + 5]$UDINT;
          						(pResponse + 40)^$UDINT := Ds402HomeExState[recordBase + 6]$UDINT;
          						(pResponse + 44)^$UDINT := Ds402HomeExState[recordBase + 7]$UDINT;
          						(pResponse + 48)^$UDINT := Ds402HomeExState[recordBase + 8]$UDINT;
          						(pResponse + 52)^$UINT := TO_UINT(Ds402HomeExState[recordBase + 9]);
          						(pResponse + 54)^$UINT := 0;
          						(pResponse + 56)^$DINT := Ds402HomeExState[recordBase + 10];
          						(pResponse + 60)^$DINT := Ds402HomeExState[recordBase + 11];
          						(pResponse + 64)^$DINT := Ds402HomeExState[recordBase + 12];
          						(pResponse + 68)^$DINT := Ds402HomeExState[recordBase + 13];
          						(pResponse + 72)^$DINT := Ds402HomeExState[recordBase + 14];
          						(pResponse + 76)^$DINT := Ds402HomeExState[recordBase + 15];
          						(pResponse + 80)^$DINT := Ds402HomeExState[recordBase + 16];
          						(pResponse + 84)^$DINT := Ds402HomeExState[recordBase + 17];
          						(pResponse + 88)^$UINT := TO_UINT(Ds402HomeExState[recordBase + 18]);
          						(pResponse + 90)^$UINT := 0;
          						(pResponse + 92)^$UDINT := Ds402HomeExState[recordBase + 19]$UDINT;
          						(pResponse + 96)^$UDINT := Ds402HomeExState[recordBase + 20]$UDINT;
          						(pResponse + 132)^$UDINT := Ds402HomeExState[recordBase + 29]$UDINT;
          						(pResponse + 136)^$UDINT := Ds402HomeExState[recordBase + 30]$UDINT;
          						(pResponse + 140)^$UDINT := Ds402HomeExState[recordBase + 31]$UDINT;
          						(pResponse + 144)^$DINT := Ds402HomeExState[recordBase + 32];
          						(pResponse + 148)^$DINT := Ds402HomeExState[recordBase + 33];
          						(pResponse + 152)^$UDINT := Ds402HomeExState[recordBase + 34]$UDINT;
          						(pResponse + 156)^$UDINT := Ds402HomeExState[recordBase + 35]$UDINT;
          						(pResponse + 160)^$UDINT := Ds402HomeExState[recordBase + 36]$UDINT;
          						(pResponse + 164)^$UDINT := Ds402HomeExState[recordBase + 37]$UDINT;
          						(pResponse + 168)^$UDINT := Ds402HomeExState[recordBase + 38]$UDINT;
          						(pResponse + 172)^$UDINT := Ds402HomeExState[recordBase + 39]$UDINT;
          						ResponseSize := 176;
          					end_if;
          				end_if;
          			end_if;
          		end_if;
          	end_if;
          	if ResponseSize = 16 then
          		(pResponse + 12)^$UDINT := detailCode;
          	end_if;

          END_FUNCTION
          '''

          retire = r'''
          FUNCTION LMCDiagnosticsService::HandleAxisDs402HomeExRetire
          	VAR_INPUT
          		Reference 	: UINT;
          		pRequest 	: ^USINT;
          		pResponse 	: ^USINT;
          		ResponseCapacity 	: UDINT;
          		CallerSessionEpoch 	: UDINT;
          		RequestSize 	: UDINT;
          	END_VAR
          	VAR_OUTPUT
          		ResponseSize 	: DINT;
          	END_VAR
          	VAR
          		schemaVersion, requestFlags, bufferMode, reservedValue : UINT;
          		requestId, diagnosticsBuild, bootId, mapRevision : UDINT;
          		originalRequestId, intent0, intent1, intent2, intent3 : UDINT;
          		overallTimeout, detectionTimeout, expectedGeneration, currentBootId : UDINT;
          		detailCode : UDINT;
          		homingMethod : DINT;
          		positionRaw : UDINT;
          		spareIndex, recordIndex, recordBase, tombstoneBase : DINT;
          		recordState : DINT;
          		spareZero, methodCandidate, recordValid, keyMatches : BOOL;
          		tombstoneValid, tombstoneMatches : BOOL;
          	END_VAR

          	ResponseSize := -1;
          	if (pResponse = NIL) | (ResponseCapacity < 16) then
          		RETURN;
          	end_if;
          	_memset(dest:=pResponse, usByte:=0, cntr:=ResponseCapacity);
          	pResponse^$UINT := LMC_DIAG_SCHEMA_VERSION;
          	(pResponse + 4)^$UINT := 1;
          	(pResponse + 6)^$INT := LMC_DIAG_ADMIN_ERROR_ID;
          	requestId := 0;
          	if (pRequest <> NIL) & (RequestSize >= 8) then
          		requestId := (pRequest + 4)^$UDINT;
          	end_if;
          	(pResponse + 8)^$UDINT := requestId;
          	ResponseSize := 16;

          	if pRequest = NIL then
          		detailCode := 5;
          	elsif (Reference < 1) | (Reference > 4) then
          		detailCode := 4;
          	elsif RequestSize <> 120 then
          		detailCode := 5;
          	else
          		schemaVersion := pRequest^$UINT;
          		requestFlags := (pRequest + 2)^$UINT;
          		diagnosticsBuild := (pRequest + 8)^$UDINT;
          		bootId := (pRequest + 12)^$UDINT;
          		mapRevision := (pRequest + 16)^$UDINT;
          		originalRequestId := (pRequest + 20)^$UDINT;
          		intent0 := (pRequest + 24)^$UDINT;
          		intent1 := (pRequest + 28)^$UDINT;
          		intent2 := (pRequest + 32)^$UDINT;
          		intent3 := (pRequest + 36)^$UDINT;
          		homingMethod := (pRequest + 40)^$DINT;
          		positionRaw := (pRequest + 44)^$UDINT;
          		bufferMode := (pRequest + 72)^$UINT;
          		reservedValue := (pRequest + 74)^$UINT;
          		overallTimeout := (pRequest + 76)^$UDINT;
          		detectionTimeout := (pRequest + 80)^$UDINT;
          		expectedGeneration := (pRequest + 116)^$UDINT;
          		spareZero := TRUE;
          		spareIndex := 84;
          		while spareIndex <= 115 do
          			if (pRequest + TO_UDINT(spareIndex))^$USINT <> 0 then
          				spareZero := FALSE;
          			end_if;
          			spareIndex += 1;
          		end_while;
          		methodCandidate :=
          			((homingMethod >= 1) & (homingMethod <= 14)) |
          			((homingMethod >= 17) & (homingMethod <= 30)) |
          			((homingMethod >= 33) & (homingMethod <= 34));
          		currentBootId := GetDiagnosticsBootId();

          		if schemaVersion <> LMC_DIAG_SCHEMA_VERSION then
          			detailCode := 1;
          		elsif requestFlags <> 0 then
          			detailCode := 2;
          		elsif requestId = 0 then
          			detailCode := 3;
          		elsif diagnosticsBuild <> 1 then
          			detailCode := 16;
          		elsif (currentBootId = 0) | (bootId <> currentBootId) then
          			detailCode := 17;
          		elsif mapRevision <> LMC_DIAG_MAP_REVISION then
          			detailCode := 18;
          		elsif (CallerSessionEpoch = 0) | (originalRequestId = 0) |
          		      ((intent0 = 0) & (intent1 = 0) &
          		       (intent2 = 0) & (intent3 = 0)) |
          		      (bufferMode <> 1) | (reservedValue <> 0) |
          		      (overallTimeout = 0) | (detectionTimeout = 0) |
          		      (spareZero = FALSE) | (methodCandidate = FALSE) |
          		      (positionRaw = 0x80000000) | (expectedGeneration = 0) then
          			detailCode := 5;
          		else
          			recordBase := TO_DINT(Reference - 1) * LMC_DIAG_HOMEEX_RECORD_STRIDE;
          			tombstoneBase := LMC_DIAG_HOMEEX_RETIRED_BASE +
          				TO_DINT(Reference - 1) * LMC_DIAG_HOMEEX_RETIRED_STRIDE;
          			recordState := Ds402HomeExState[recordBase];
          			tombstoneValid :=
          				(Ds402HomeExState[tombstoneBase] = 0) |
          				((Ds402HomeExState[tombstoneBase]$UDINT = LMC_DIAG_HOMEEX_RETIRED_MAGIC) &
          				 (Ds402HomeExState[tombstoneBase + 9] = TO_DINT(Reference)) &
          				 (Ds402HomeExState[tombstoneBase + 21]$UDINT <> 0) &
          				 (Ds402HomeExState[tombstoneBase + 22] >= 2) &
          				 (Ds402HomeExState[tombstoneBase + 22] <= 4) &
          				 (Ds402HomeExState[tombstoneBase + 23] = 0));
          			if tombstoneValid = FALSE then
          				detailCode := LMC_DIAG_HOMEEX_DETAIL_STORE_CORRUPT;
          			elsif recordState = 0 then
          				tombstoneMatches :=
          					(Ds402HomeExState[tombstoneBase]$UDINT = LMC_DIAG_HOMEEX_RETIRED_MAGIC) &
          					(Ds402HomeExState[tombstoneBase + 1]$UDINT = diagnosticsBuild) &
          					(Ds402HomeExState[tombstoneBase + 2]$UDINT = bootId) &
          					(Ds402HomeExState[tombstoneBase + 3]$UDINT = mapRevision) &
          					(Ds402HomeExState[tombstoneBase + 4]$UDINT = originalRequestId) &
          					(Ds402HomeExState[tombstoneBase + 5]$UDINT = intent0) &
          					(Ds402HomeExState[tombstoneBase + 6]$UDINT = intent1) &
          					(Ds402HomeExState[tombstoneBase + 7]$UDINT = intent2) &
          					(Ds402HomeExState[tombstoneBase + 8]$UDINT = intent3) &
          					(Ds402HomeExState[tombstoneBase + 9] = TO_DINT(Reference)) &
          					(Ds402HomeExState[tombstoneBase + 10] = homingMethod) &
          					(Ds402HomeExState[tombstoneBase + 11] = (pRequest + 44)^$DINT) &
          					(Ds402HomeExState[tombstoneBase + 12] = (pRequest + 48)^$DINT) &
          					(Ds402HomeExState[tombstoneBase + 13] = (pRequest + 52)^$DINT) &
          					(Ds402HomeExState[tombstoneBase + 14] = (pRequest + 56)^$DINT) &
          					(Ds402HomeExState[tombstoneBase + 15] = (pRequest + 60)^$DINT) &
          					(Ds402HomeExState[tombstoneBase + 16] = (pRequest + 64)^$DINT) &
          					(Ds402HomeExState[tombstoneBase + 17] = (pRequest + 68)^$DINT) &
          					(Ds402HomeExState[tombstoneBase + 18] = TO_DINT(bufferMode)) &
          					(Ds402HomeExState[tombstoneBase + 19]$UDINT = overallTimeout) &
          					(Ds402HomeExState[tombstoneBase + 20]$UDINT = detectionTimeout) &
          					(Ds402HomeExState[tombstoneBase + 21]$UDINT = expectedGeneration);
          				if tombstoneMatches then
          					(pResponse + 4)^$UINT := 0;
          					(pResponse + 6)^$INT := 0;
          					(pResponse + 12)^$UDINT := 0;
          				else
          					if Ds402HomeExState[tombstoneBase] = 0 then
          						detailCode := LMC_DIAG_HOMEEX_DETAIL_NOT_FOUND;
          					else
          						detailCode := LMC_DIAG_HOMEEX_DETAIL_KEY_MISMATCH;
          					end_if;
          				end_if;
          			else
          				recordValid :=
          					(recordState >= 1) & (recordState <= 4) &
          					(Ds402HomeExState[recordBase + 1]$UDINT <> 0) &
          					(Ds402HomeExState[recordBase + 2]$UDINT <> 0) &
          					(Ds402HomeExState[recordBase + 3]$UDINT <> 0) &
          					(Ds402HomeExState[recordBase + 4]$UDINT <> 0) &
          					((Ds402HomeExState[recordBase + 5] <> 0) |
          					 (Ds402HomeExState[recordBase + 6] <> 0) |
          					 (Ds402HomeExState[recordBase + 7] <> 0) |
          					 (Ds402HomeExState[recordBase + 8] <> 0)) &
          					(Ds402HomeExState[recordBase + 9] = TO_DINT(Reference)) &
          					(Ds402HomeExState[recordBase + 18] = 1) &
          					(Ds402HomeExState[recordBase + 19]$UDINT <> 0) &
          					(Ds402HomeExState[recordBase + 20]$UDINT <> 0) &
          					(Ds402HomeExState[recordBase + 34]$UDINT <> 0) &
          					(Ds402HomeExState[recordBase + 37]$UDINT <> 0);
          				if recordValid = FALSE then
          					detailCode := LMC_DIAG_HOMEEX_DETAIL_STORE_CORRUPT;
          				else
          					keyMatches :=
          						(Ds402HomeExState[recordBase + 1]$UDINT = diagnosticsBuild) &
          						(Ds402HomeExState[recordBase + 2]$UDINT = bootId) &
          						(Ds402HomeExState[recordBase + 3]$UDINT = mapRevision) &
          						(Ds402HomeExState[recordBase + 4]$UDINT = originalRequestId) &
          						(Ds402HomeExState[recordBase + 5]$UDINT = intent0) &
          						(Ds402HomeExState[recordBase + 6]$UDINT = intent1) &
          						(Ds402HomeExState[recordBase + 7]$UDINT = intent2) &
          						(Ds402HomeExState[recordBase + 8]$UDINT = intent3) &
          						(Ds402HomeExState[recordBase + 9] = TO_DINT(Reference)) &
          						(Ds402HomeExState[recordBase + 10] = homingMethod) &
          						(Ds402HomeExState[recordBase + 11] = (pRequest + 44)^$DINT) &
          						(Ds402HomeExState[recordBase + 12] = (pRequest + 48)^$DINT) &
          						(Ds402HomeExState[recordBase + 13] = (pRequest + 52)^$DINT) &
          						(Ds402HomeExState[recordBase + 14] = (pRequest + 56)^$DINT) &
          						(Ds402HomeExState[recordBase + 15] = (pRequest + 60)^$DINT) &
          						(Ds402HomeExState[recordBase + 16] = (pRequest + 64)^$DINT) &
          						(Ds402HomeExState[recordBase + 17] = (pRequest + 68)^$DINT) &
          						(Ds402HomeExState[recordBase + 18] = TO_DINT(bufferMode)) &
          						(Ds402HomeExState[recordBase + 19]$UDINT = overallTimeout) &
          						(Ds402HomeExState[recordBase + 20]$UDINT = detectionTimeout);
          					if keyMatches = FALSE then
          						detailCode := LMC_DIAG_HOMEEX_DETAIL_KEY_MISMATCH;
          					elsif recordState = 1 then
          						detailCode := LMC_DIAG_HOMEEX_DETAIL_INDETERMINATE;
          					elsif ((Ds402HomeExState[recordBase + 38]$UDINT and
          						LMC_DIAG_HOMEEX_CLEANUP_PROOF_REQUIRED) <>
          						LMC_DIAG_HOMEEX_CLEANUP_PROOF_REQUIRED) then
          						detailCode := LMC_DIAG_HOMEEX_DETAIL_CLEANUP_INCOMPLETE;
          					elsif expectedGeneration <>
          						Ds402HomeExState[recordBase + 37]$UDINT then
          						detailCode := LMC_DIAG_HOMEEX_DETAIL_KEY_MISMATCH;
          					else
          						// Publish the exact retired key/generation before clearing the
          						// active record. This keeps exact retire retry idempotent while
          						// preventing replay of the retired original Start identity.
          						Ds402HomeExState[tombstoneBase] :=
          							TO_DINT(LMC_DIAG_HOMEEX_RETIRED_MAGIC);
          						recordIndex := 1;
          						while recordIndex <= 20 do
          							Ds402HomeExState[tombstoneBase + recordIndex] :=
          								Ds402HomeExState[recordBase + recordIndex];
          							recordIndex += 1;
          						end_while;
          						Ds402HomeExState[tombstoneBase + 21] :=
          							Ds402HomeExState[recordBase + 37];
          						Ds402HomeExState[tombstoneBase + 22] := recordState;
          						Ds402HomeExState[tombstoneBase + 23] := 0;
          						recordIndex := 0;
          						while recordIndex < LMC_DIAG_HOMEEX_RECORD_STRIDE do
          							Ds402HomeExState[recordBase + recordIndex] := 0;
          							recordIndex += 1;
          						end_while;
          						(pResponse + 4)^$UINT := 0;
          						(pResponse + 6)^$INT := 0;
          						(pResponse + 12)^$UDINT := 0;
          					end_if;
          				end_if;
          			end_if;
          		end_if;
          	end_if;
          	if ((pResponse + 4)^$UINT <> 0) then
          		(pResponse + 12)^$UDINT := detailCode;
          	end_if;

          END_FUNCTION
          '''

          # Strip workflow indentation while preserving tabs in the ST body.
          def clean(block):
              lines = block.strip('\n').splitlines()
              return '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)

          replace_function('HandleAxisDs402HomeExStart', clean(start))
          replace_function('HandleAxisDs402HomeExOutcome', clean(outcome))
          replace_function('HandleAxisDs402HomeExRetire', clean(retire))

          if '#define LMC_DIAG_DS402_HOME_EX_ENABLED FALSE' not in text:
              raise SystemExit('HOMEEX runtime gate changed unexpectedly.')
          process = re.search(r'(?ms)^FUNCTION LMCDiagnosticsService::ProcessAxisDs402HomeEx\b.*?^END_FUNCTION\s*$', text)
          if not process or re.search(r'6060|6061|6098|607C|6099|609A', process.group(0)):
              raise SystemExit('Physical HOMEEX runtime boundary changed unexpectedly.')
          path.write_text(text, encoding='utf-8', newline='\n')

      - name: Verify retained store contract
        shell: pwsh
        run: |
          .\tools\Verify-HomeDs402ExRetainedStore.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify method lexical budgets
        shell: pwsh
        run: |
          $text = [IO.File]::ReadAllText('Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCDiagnosticsService/LMCDiagnosticsService.st')
          foreach ($name in @('HandleAxisDs402HomeExStart','HandleAxisDs402HomeExOutcome','HandleAxisDs402HomeExRetire')) {
            $m = [regex]::Match($text, '(?ms)^FUNCTION\s+LMCDiagnosticsService::' + $name + '\b.*?^END_FUNCTION\s*$')
            if (-not $m.Success) { throw "Missing $name" }
            $bytes = [Text.Encoding]::UTF8.GetByteCount($m.Value)
            Write-Host "$name bytes=$bytes"
            if ($bytes -ge 32768) { throw "$name exceeds conservative 32KiB source budget: $bytes" }
          }

      - name: Diff hygiene
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff -- Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCDiagnosticsService/LMCDiagnosticsService.st

      - name: Remove one-shot workflow and commit source
        shell: pwsh
        run: |
          Remove-Item -LiteralPath '.github/workflows/home-ds402ex-homeex05-store-patch-once.yml' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCDiagnosticsService/LMCDiagnosticsService.st .github/workflows/home-ds402ex-homeex05-store-patch-once.yml
          if (git diff --cached --quiet) { throw 'Expected retained-store source diff is empty.' }
          git commit -m 'feat(homeex): add retained outcome store semantics'
          git push origin HEAD:codex/home-ds402ex-homeex05-retained-store
