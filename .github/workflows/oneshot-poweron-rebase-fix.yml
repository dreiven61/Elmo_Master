name: One-shot PowerOn rebase fix

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/oneshot-poweron-rebase-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply product and contract fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # The helper contains one obsolete fixture-string patch. The product
          # edits themselves are exact-count guarded and have already been
          # exercised in the previous validation runs.
          $helper = 'tools/Apply-PowerOnRebaseDiagnosticFix.ps1'
          $helperLines = Get-Content -LiteralPath $helper
          $helperLines = @($helperLines | Where-Object {
            ($_ -notmatch '^\$old=') -and
            ($_ -notmatch '^\$new=') -and
            ($_ -notmatch '^ReplaceOne \$fixture \$old \$new ')
          })
          Set-Content -LiteralPath $helper -Value $helperLines -Encoding utf8
          ./tools/Apply-PowerOnRebaseDiagnosticFix.ps1 -RepositoryRoot $PWD

          # Keep the dedicated negative fixture aligned with the symbolic
          # retained-rebase result. Mutate only the ReserveConflictDrift line.
          $fixture = 'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalAxisRebaseBarrier.Fixture.ps1'
          $f = [Collections.Generic.List[string]](Get-Content -LiteralPath $fixture)
          $fixtureHits = @()
          for ($i = 0; $i -lt $f.Count; $i++) {
            if (($f[$i] -match 'rebaseAdmissionAllowed') -and
                ($f[$i] -match '\)-2''\)')) { $fixtureHits += $i }
          }
          if ($fixtureHits.Count -ne 1) {
            throw "Expected one ReserveConflictDrift line, found $($fixtureHits.Count)."
          }
          $fi = $fixtureHits[0]
          $f[$fi] = $f[$fi].Replace(")-2')", ")LMC_OWNER_REBASE_REQUIRED')")
          Set-Content -LiteralPath $fixture -Value $f -Encoding utf8

          # Update only the three rebase-specific contracts frozen in the
          # primary verifier. Do not touch ordinary safety-repeat semantics.
          $verifier = 'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalContract.ps1'
          $v = [Collections.Generic.List[string]](Get-Content -LiteralPath $verifier)
          $replacements = @(
            @(
              "        'Result\\s*:=\\s*-2\\s*;\\s*RETURN\\s*;\\s*end_if\\s*;\\s*end_if\\s*;') (",
              "        'Result\\s*:=\\s*LMC_OWNER_REBASE_REQUIRED\\s*;\\s*RETURN\\s*;\\s*end_if\\s*;\\s*end_if\\s*;') ("
            ),
            @(
              "                '(\\)\\s+then\\s*Result\\s*:=\\s*-2)')",
              "                '(\\)\\s+then\\s*Result\\s*:=\\s*LMC_OWNER_REBASE_REQUIRED)')"
            ),
            @(
              "        'Result\\s*:=\\s*-2\\s*;\\s*RETURN\\s*;') (",
              "        'Result\\s*:=\\s*LMC_OWNER_REBASE_REQUIRED\\s*;\\s*RETURN\\s*;') ("
            )
          )
          foreach ($pair in $replacements) {
            $hits = @()
            for ($i = 0; $i -lt $v.Count; $i++) {
              if ($v[$i] -ceq $pair[0]) { $hits += $i }
            }
            if ($hits.Count -ne 1) {
              throw "Verifier exact rebase contract expected once, found $($hits.Count): $($pair[0])"
            }
            $v[$hits[0]] = $pair[1]
          }
          Set-Content -LiteralPath $verifier -Value $v -Encoding utf8

          # Current dev links RecoveryRecordRetirementLedger into the API test
          # project but omitted the source that defines MaintenanceActionRecoveryState.
          $testProject = 'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/LasalMotionControlLib.Tests.csproj'
          $p = [Collections.Generic.List[string]](Get-Content -LiteralPath $testProject)
          if (-not (($p -join "`n") -match 'MaintenanceActionRecoveryJournal\.cs')) {
            $anchor = -1
            for ($i = 0; $i -lt $p.Count; $i++) {
              if ($p[$i] -match 'RecoveryRecordRetirementLedger\.cs') {
                $anchor = $i
                break
              }
            }
            if ($anchor -lt 0) {
              throw 'RecoveryRecordRetirementLedger compile anchor not found.'
            }
            $p.Insert($anchor, '    <Compile Include="..\..\..\LasalApiWpfTestApp\LasalApiWpfTestApp\MaintenanceActionRecoveryJournal.cs">')
            $p.Insert($anchor + 1, '      <Link>MaintenanceActionRecoveryJournal.cs</Link>')
            $p.Insert($anchor + 2, '    </Compile>')
            Set-Content -LiteralPath $testProject -Value $p -Encoding utf8
          }

      - name: Verify targeted source invariants
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $control = Get-Content -Raw 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCControlCommandService/LMCControlCommandService.st'
          $tcp = Get-Content -Raw 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/TCPMotionInterface/TCPMotionInterface.st'
          $catalog = Get-Content -Raw 'LMC_Library/LMC_API_Delivery/src/LmcErrorCatalog.cs'
          $models = Get-Content -Raw 'LMC_Library/LMC_API_Delivery/src/LmcAdminModels.cs'
          $project = Get-Content -Raw 'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/LasalMotionControlLib.Tests.csproj'
          $verifier = Get-Content -Raw 'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalContract.ps1'
          if ($control -notmatch '#define\s+LMC_OWNER_REBASE_REQUIRED\s+-15') { throw 'Missing control -15 define.' }
          if ($control -notmatch 'Result\s*:=\s*LMC_OWNER_REBASE_REQUIRED') { throw 'Dedicated rebase admission result missing.' }
          if ($tcp -notmatch 'LMC_OWNER_ADAPTER_ERROR_REBASE_REQUIRED\s+-15') { throw 'Missing TCP -15 define.' }
          if ($tcp -notmatch 'Sendbuf\[14\]\$INT\s*:=\s*LMC_OWNER_ADAPTER_ERROR_REBASE_REQUIRED') { throw 'Axis ACK -15 propagation missing.' }
          if ($tcp -notmatch 'Sendbuf\[20\]\$UDINT\s*:=\s*65') { throw 'Admin rebase detail 65 missing.' }
          if ($catalog -notmatch 'AxisRebaseRequired') { throw 'C# error catalog -15 entry missing.' }
          if ($models -notmatch 'AxisRebaseRequired\s*=\s*65') { throw 'Admin detail enum 65 missing.' }
          if ($project -notmatch 'MaintenanceActionRecoveryJournal\.cs') { throw 'API test compile closure missing.' }
          if (($verifier | Select-String -Pattern 'Result\\s\*:=\\s\*LMC_OWNER_REBASE_REQUIRED' -AllMatches).Matches.Count -lt 2) { throw 'Primary verifier symbolic rebase expectations missing.' }

      - name: Axis rebase verifier self-test
        shell: pwsh
        run: |
          & 'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalAxisRebaseBarrier.Fixture.ps1' -RunSelfTest -RepositoryRoot $PWD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: API Release tests
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $msbuild = @(& $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe') | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($msbuild)) { throw 'MSBuild.exe not found.' }
          & $msbuild 'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/LasalMotionControlLib.Tests.csproj' /t:RunTests /p:Configuration=Release /nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: WPF Debug build
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $msbuild = @(& $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe') | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($msbuild)) { throw 'MSBuild.exe not found.' }
          & $msbuild 'LMC_Library/LasalApiWpfTestApp/LasalApiWpfTestApp.sln' /t:Build /p:Configuration=Debug /nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Diff check
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit validated product fix
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f '.github/workflows/oneshot-poweron-rebase-fix.yml' 'tools/Apply-PowerOnRebaseDiagnosticFix.ps1'
          git add -A
          git commit -m 'fix: expose retained rebase barrier on PowerOn'
          git push origin HEAD:dev
