name: One-shot PowerOn rebase inspect

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/oneshot-poweron-rebase-fix.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply current product patch in working tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $helper = 'tools/Apply-PowerOnRebaseDiagnosticFix.ps1'
          $helperLines = Get-Content -LiteralPath $helper
          $helperLines = @($helperLines | Where-Object {
            ($_ -notmatch '^\$old=') -and
            ($_ -notmatch '^\$new=') -and
            ($_ -notmatch '^ReplaceOne \$fixture \$old \$new ')
          })
          Set-Content -LiteralPath $helper -Value $helperLines -Encoding utf8
          ./tools/Apply-PowerOnRebaseDiagnosticFix.ps1 -RepositoryRoot $PWD

          $fixture = 'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalAxisRebaseBarrier.Fixture.ps1'
          $f = [Collections.Generic.List[string]](Get-Content -LiteralPath $fixture)
          for ($i = 0; $i -lt $f.Count; $i++) {
            if (($f[$i] -match 'rebaseAdmissionAllowed') -and ($f[$i] -match '\)-2''\)')) {
              $f[$i] = $f[$i].Replace(")-2')", ")LMC_OWNER_REBASE_REQUIRED')")
            }
          }
          Set-Content -LiteralPath $fixture -Value $f -Encoding utf8

          $verifier = 'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalContract.ps1'
          $v = [Collections.Generic.List[string]](Get-Content -LiteralPath $verifier)
          $oldNew = @(
            @("        'Result\s*:=\s*-2\s*;\s*RETURN\s*;\s*end_if\s*;\s*end_if\s*;') (", "        'Result\s*:=\s*LMC_OWNER_REBASE_REQUIRED\s*;\s*RETURN\s*;\s*end_if\s*;\s*end_if\s*;') ("),
            @("                '(\)\s+then\s*Result\s*:=\s*-2)')", "                '(\)\s+then\s*Result\s*:=\s*LMC_OWNER_REBASE_REQUIRED)')"),
            @("        'Result\s*:=\s*-2\s*;\s*RETURN\s*;') (", "        'Result\s*:=\s*LMC_OWNER_REBASE_REQUIRED\s*;\s*RETURN\s*;') (")
          )
          foreach ($pair in $oldNew) {
            for ($i = 0; $i -lt $v.Count; $i++) {
              if ($v[$i] -ceq $pair[0]) { $v[$i] = $pair[1] }
            }
          }
          Set-Content -LiteralPath $verifier -Value $v -Encoding utf8

      - name: Print ordinary safety repeat verifier function
        shell: pwsh
        run: |
          $path = 'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalContract.ps1'
          $lines = Get-Content -LiteralPath $path
          $m = Select-String -LiteralPath $path -SimpleMatch 'function Assert-LasalOrdinarySafetyRepeatContract' | Select-Object -First 1
          if ($null -eq $m) { throw 'Verifier function not found.' }
          $start = $m.LineNumber
          $next = Select-String -LiteralPath $path -Pattern '^function\s+' | Where-Object { $_.LineNumber -gt $start } | Select-Object -First 1
          $end = if ($null -eq $next) { [Math]::Min($lines.Count, $start + 900) } else { $next.LineNumber - 1 }
          Write-Host "FUNCTION LINES $start..$end"
          for ($n = $start; $n -le $end; $n++) {
            Write-Host (("{0,6}: {1}" -f $n, $lines[$n-1]))
          }
