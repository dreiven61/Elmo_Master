name: One-shot PowerOn rebase inspect

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/oneshot-poweron-rebase-fix.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply current product patch in working tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $helper = 'tools/Apply-PowerOnRebaseDiagnosticFix.ps1'
          $helperLines = Get-Content -LiteralPath $helper
          $helperLines = @($helperLines | Where-Object {
            ($_ -notmatch '^\$old=') -and
            ($_ -notmatch '^\$new=') -and
            ($_ -notmatch '^ReplaceOne \$fixture \$old \$new ')
          })
          Set-Content -LiteralPath $helper -Value $helperLines -Encoding utf8
          ./tools/Apply-PowerOnRebaseDiagnosticFix.ps1 -RepositoryRoot $PWD

      - name: Print patched Reserve repeat-return and rebase blocks
        shell: pwsh
        run: |
          $path = 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCControlCommandService/LMCControlCommandService.st'
          $lines = Get-Content -LiteralPath $path
          $patterns = @('if repeatMode > 0 then', 'rebaseAdmissionAllowed', 'LMC_OWNER_REBASE_REQUIRED')
          foreach ($pattern in $patterns) {
            Write-Host "===== $pattern ====="
            $matches = Select-String -LiteralPath $path -SimpleMatch $pattern
            foreach ($m in $matches) {
              $start = [Math]::Max(1, $m.LineNumber - 55)
              $end = [Math]::Min($lines.Count, $m.LineNumber + 85)
              Write-Host "LINES $start..$end (match $($m.LineNumber))"
              for ($n = $start; $n -le $end; $n++) {
                Write-Host (("{0,6}: {1}" -f $n, $lines[$n-1]))
              }
              Write-Host '-----'
            }
          }
