name: One-shot PowerOn rebase fix

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/oneshot-poweron-rebase-fix.yml'

permissions:
  contents: write

jobs:
  inspect-verifier:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Inspect current verifier contexts
        shell: pwsh
        run: |
          $verifier = 'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalContract.ps1'
          Write-Host '=== rebaseAdmissionAllowed contexts ==='
          Select-String -LiteralPath $verifier -Pattern 'rebaseAdmissionAllowed' -Context 10,10 | ForEach-Object {
            Write-Host ("LINE {0}" -f $_.LineNumber)
            Write-Host ($_.Context.PreContext -join "`n")
            Write-Host $_.Line
            Write-Host ($_.Context.PostContext -join "`n")
            Write-Host '---'
          }
          Write-Host '=== ordinary safety repeat contexts ==='
          Select-String -LiteralPath $verifier -Pattern 'ordinary safety repeat','immutable retained tuple immediately','Reserve positive result' -Context 12,12 | ForEach-Object {
            Write-Host ("LINE {0}" -f $_.LineNumber)
            Write-Host ($_.Context.PreContext -join "`n")
            Write-Host $_.Line
            Write-Host ($_.Context.PostContext -join "`n")
            Write-Host '---'
          }
