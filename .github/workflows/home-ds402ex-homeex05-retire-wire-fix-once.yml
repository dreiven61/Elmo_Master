          \t\t\t\t\t\t\t (Ds402HomeExState[tombstoneBase + 8] <> 0)) &
          \t\t\t\t\t\t\t(Ds402HomeExState[tombstoneBase + 9] = TO_DINT(Reference)) &
          \t\t\t\t\t\t\t(Ds402HomeExState[tombstoneBase + 11]$UDINT <> 0x80000000) &
          \t\t\t\t\t\t\t(Ds402HomeExState[tombstoneBase + 18] = 1) &
          \t\t\t\t\t\t\t(Ds402HomeExState[tombstoneBase + 19]$UDINT <> 0) &
          \t\t\t\t\t\t\t(Ds402HomeExState[tombstoneBase + 20]$UDINT <> 0) &
          \t\t\t\t\t\t\t(Ds402HomeExState[tombstoneBase + 21] = 0) &
          \t\t\t\t\t\t\t(Ds402HomeExState[tombstoneBase + 22] = 0) &
          \t\t\t\t\t\t\t(Ds402HomeExState[tombstoneBase + 23] = 0) &
          \t\t\t\t\t\t\t(Ds402HomeExState[tombstoneBase + 24] = 0) &
          \t\t\t\t\t\t\t(Ds402HomeExState[tombstoneBase + 25] = 0) &
          \t\t\t\t\t\t\t(Ds402HomeExState[tombstoneBase + 26] = 0) &
          \t\t\t\t\t\t\t(Ds402HomeExState[tombstoneBase + 27] = 0) &
          \t\t\t\t\t\t\t(Ds402HomeExState[tombstoneBase + 28] = 0) &
          \t\t\t\t\t\t\t(Ds402HomeExState[tombstoneBase + 34]$UDINT <> 0) &
