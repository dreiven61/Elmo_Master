          \t\t\t\t\t\t\tend_if;
          \t\t\t\t\t\tend_if;
          \t\t\t\t\telse
          \t\t\t\t\t\tif LMC_DIAG_DS402_HOME_EX_ENABLED = FALSE then
          \t\t\t\t\t\t\tdetailCode := LMC_DIAG_HOMEEX_DETAIL_INVALID_PROFILE;
          \t\t\t\t\t\telse
          \t\t\t\t\t\t\tdetailCode := LMC_DIAG_HOMEEX_DETAIL_STORAGE;
          \t\t\t\t\t\tend_if;
