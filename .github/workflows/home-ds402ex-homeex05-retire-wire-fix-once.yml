name: HomeDS402Ex HOMEEX-05 retire wire fix once

on:
  push:
    branches:
      - codex/home-ds402ex-homeex05-retained-store
    paths:
      - '.github/workflows/home-ds402ex-homeex05-retire-wire-fix-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch full retained outcome and retire success wire contract
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCDiagnosticsService/LMCDiagnosticsService.st')
          text = path.read_text(encoding='utf-8').replace('\r\n', '\n')

          replacements = {
              'Ds402HomeExState : ARRAY [0..255] OF DINT;': 'Ds402HomeExState : ARRAY [0..319] OF DINT;',
              '#define LMC_DIAG_HOMEEX_RETIRED_STRIDE 24': '#define LMC_DIAG_HOMEEX_RETIRED_STRIDE 40',
              '#define LMC_DIAG_HOMEEX_RETIRED_MAGIC 0x48585254': '#define LMC_DIAG_HOMEEX_RETIRED_STATE_MASK 0x00008000',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one source anchor: {old!r}; found {text.count(old)}')
              text = text.replace(old, new, 1)

          def replace_function(name, replacement):
              global text
              pattern = re.compile(r'(?ms)^FUNCTION LMCDiagnosticsService::' + re.escape(name) + r'\b.*?^END_FUNCTION\s*$')
              matches = list(pattern.finditer(text))
              if len(matches) != 1:
                  raise SystemExit(f'Expected one {name} implementation, found {len(matches)}')
              text = text[:matches[0].start()] + replacement.strip() + '\n' + text[matches[0].end():]

          start = '''
          FUNCTION LMCDiagnosticsService::HandleAxisDs402HomeExStart
          \tVAR_INPUT
          \t\tReference \t: UINT;
          \t\tpRequest \t: ^USINT;
          \t\tpResponse \t: ^USINT;
          \t\tResponseCapacity \t: UDINT;
          \t\tCallerSessionEpoch \t: UDINT;
          \t\tRequestSequence \t: UDINT;
          \t\tAdmissionToken \t: UDINT;
          \t\tOwnerGeneration \t: UDINT;
          \t\tRequestSize \t: UDINT;
          \tEND_VAR
          \tVAR_OUTPUT
          \t\tResponseSize \t: DINT;
          \tEND_VAR
          \tVAR
          \t\tschemaVersion, requestFlags, bufferMode, reservedValue : UINT;
          \t\trequestId, diagnosticsBuild, bootId, mapRevision : UDINT;
          \t\tintent0, intent1, intent2, intent3 : UDINT;
          \t\toverallTimeout, detectionTimeout, currentBootId : UDINT;
          \t\trawRetiredState : UDINT;
          \t\tdetailCode : UDINT;
          \t\thomingMethod : DINT;
          \t\tpositionRaw : UDINT;
          \t\taxisMask : UDINT;
          \t\tspareIndex, recordIndex, recordBase, tombstoneBase : DINT;
          \t\trecordState, retiredState : DINT;
          \t\townerResult : DINT;
          \t\tspareZero, methodCandidate, recordDirty, recordValid : BOOL;
          \t\tretiredDuplicate, tombstoneDirty, tombstoneValid : BOOL;
          \tEND_VAR

          \tResponseSize := -1;
          \tif (pResponse = NIL) | (ResponseCapacity < 16) then
          \t\tRETURN;
          \tend_if;
          \t_memset(dest:=pResponse, usByte:=0, cntr:=ResponseCapacity);
          \tpResponse^$UINT := LMC_DIAG_SCHEMA_VERSION;
          \t(pResponse + 4)^$UINT := 1;
          \t(pResponse + 6)^$INT := LMC_DIAG_ADMIN_ERROR_ID;
          \trequestId := 0;
          \thomingMethod := 0;
          \tif (pRequest <> NIL) & (RequestSize >= 8) then
          \t\trequestId := (pRequest + 4)^$UDINT;
          \tend_if;
          \tif (pRequest <> NIL) & (RequestSize >= 40) then
          \t\thomingMethod := (pRequest + 36)^$DINT;
          \tend_if;
          \t(pResponse + 8)^$UDINT := requestId;
          \tResponseSize := 16;

          \tif pRequest = NIL then
          \t\tdetailCode := 5;
          \telsif (Reference < 1) | (Reference > 4) then
          \t\tdetailCode := 4;
          \telsif RequestSize <> 116 then
          \t\tdetailCode := 5;
          \telse
          \t\tschemaVersion := pRequest^$UINT;
          \t\trequestFlags := (pRequest + 2)^$UINT;
          \t\tdiagnosticsBuild := (pRequest + 8)^$UDINT;
          \t\tbootId := (pRequest + 12)^$UDINT;
          \t\tmapRevision := (pRequest + 16)^$UDINT;
          \t\tintent0 := (pRequest + 20)^$UDINT;
          \t\tintent1 := (pRequest + 24)^$UDINT;
          \t\tintent2 := (pRequest + 28)^$UDINT;
          \t\tintent3 := (pRequest + 32)^$UDINT;
          \t\thomingMethod := (pRequest + 36)^$DINT;
          \t\tpositionRaw := (pRequest + 40)^$UDINT;
          \t\tbufferMode := (pRequest + 68)^$UINT;
          \t\treservedValue := (pRequest + 70)^$UINT;
          \t\toverallTimeout := (pRequest + 72)^$UDINT;
          \t\tdetectionTimeout := (pRequest + 76)^$UDINT;
          \t\tspareZero := TRUE;
          \t\tspareIndex := 80;
          \t\twhile spareIndex <= 111 do
          \t\t\tif (pRequest + TO_UDINT(spareIndex))^$USINT <> 0 then
          \t\t\t\tspareZero := FALSE;
          \t\t\tend_if;
          \t\t\tspareIndex += 1;
          \t\tend_while;
          \t\tmethodCandidate :=
          \t\t\t((homingMethod >= 1) & (homingMethod <= 14)) |
          \t\t\t((homingMethod >= 17) & (homingMethod <= 30)) |
          \t\t\t((homingMethod >= 33) & (homingMethod <= 34));
          \t\tcurrentBootId := GetDiagnosticsBootId();

          \t\tif schemaVersion <> LMC_DIAG_SCHEMA_VERSION then
          \t\t\tdetailCode := 1;
          \t\telsif requestFlags <> 0 then
          \t\t\tdetailCode := 2;
          \t\telsif requestId = 0 then
          \t\t\tdetailCode := 3;
          \t\telsif diagnosticsBuild <> 1 then
          \t\t\tdetailCode := 16;
          \t\telsif (currentBootId = 0) | (bootId <> currentBootId) then
          \t\t\tdetailCode := 17;
          \t\telsif mapRevision <> LMC_DIAG_MAP_REVISION then
          \t\t\tdetailCode := 18;
          \t\telsif (CallerSessionEpoch = 0) | (RequestSequence = 0) then
          \t\t\tdetailCode := 5;
          \t\telsif ((intent0 = 0) & (intent1 = 0) &
          \t\t       (intent2 = 0) & (intent3 = 0)) |
          \t\t      (bufferMode <> 1) | (reservedValue <> 0) |
          \t\t      (overallTimeout = 0) | (detectionTimeout = 0) |
          \t\t      (spareZero = FALSE) |
          \t\t      ((pRequest + 112)^$UDINT <> LMC_DIAG_HOMEEX_EXECUTE_TOKEN) then
          \t\t\tdetailCode := 5;
          \t\telsif (methodCandidate = FALSE) | (positionRaw = 0x80000000) then
          \t\t\tdetailCode := LMC_DIAG_HOMEEX_DETAIL_INVALID_PROFILE;
          \t\telsif (AdmissionToken = 0) | (OwnerGeneration = 0) |
          \t\t      (IsClientConnected(#AxisOwnership) = FALSE) then
          \t\t\tdetailCode := 42;
          \t\telse
          \t\t\taxisMask := TO_UDINT(1) shl TO_UDINT(Reference - 1);
          \t\t\townerResult := AxisOwnership.ValidateAxisOwnershipIdentity(
          \t\t\t\tCommandId:=0x7D1B,
          \t\t\t\tReference:=Reference,
          \t\t\t\tExpectedAxisMask:=axisMask,
          \t\t\t\tOwnerKind:=LMC_DIAG_OWNER_KIND_DS402_HOME_EX,
          \t\t\t\tResourceKind:=LMC_DIAG_RESOURCE_DS402_HOME,
          \t\t\t\tAdmissionMode:=LMC_DIAG_ADMISSION_LIFECYCLE,
          \t\t\t\tCallerSessionEpoch:=CallerSessionEpoch,
          \t\t\t\tRequestSequence:=RequestSequence,
          \t\t\t\tAdmissionToken:=AdmissionToken,
          \t\t\t\tOwnerGeneration:=OwnerGeneration,
          \t\t\t\tRequiredPhase:=LMC_DIAG_OWNER_PHASE_RESERVED,
          \t\t\t\tpIdentity:=pRequest$^void,
          \t\t\t\tIdentitySize:=RequestSize);
          \t\t\tif ownerResult <> 0 then
          \t\t\t\tdetailCode := 42;
          \t\t\telse
          \t\t\t\trecordBase := TO_DINT(Reference - 1) * LMC_DIAG_HOMEEX_RECORD_STRIDE;
          \t\t\t\ttombstoneBase := LMC_DIAG_HOMEEX_RETIRED_BASE +
          \t\t\t\t\tTO_DINT(Reference - 1) * LMC_DIAG_HOMEEX_RETIRED_STRIDE;
          \t\t\t\trecordDirty := FALSE;
          \t\t\t\trecordIndex := 0;
          \t\t\t\twhile recordIndex < LMC_DIAG_HOMEEX_RECORD_STRIDE do
          \t\t\t\t\tif Ds402HomeExState[recordBase + recordIndex] <> 0 then
          \t\t\t\t\t\trecordDirty := TRUE;
          \t\t\t\t\tend_if;
          \t\t\t\t\trecordIndex += 1;
          \t\t\t\tend_while;
          \t\t\t\trecordState := Ds402HomeExState[recordBase];
          \t\t\t\trecordValid :=
          \t\t\t\t\trecordDirty & (recordState >= 1) & (recordState <= 4) &
          \t\t\t\t\t(Ds402HomeExState[recordBase + 1]$UDINT <> 0) &
          \t\t\t\t\t(Ds402HomeExState[recordBase + 2]$UDINT <> 0) &
          \t\t\t\t\t(Ds402HomeExState[recordBase + 3]$UDINT <> 0) &
          \t\t\t\t\t(Ds402HomeExState[recordBase + 4]$UDINT <> 0) &
          \t\t\t\t\t((Ds402HomeExState[recordBase + 5] <> 0) |
          \t\t\t\t\t (Ds402HomeExState[recordBase + 6] <> 0) |
          \t\t\t\t\t (Ds402HomeExState[recordBase + 7] <> 0) |
          \t\t\t\t\t (Ds402HomeExState[recordBase + 8] <> 0)) &
          \t\t\t\t\t(Ds402HomeExState[recordBase + 9] = TO_DINT(Reference)) &
          \t\t\t\t\t(Ds402HomeExState[recordBase + 11]$UDINT <> 0x80000000) &
          \t\t\t\t\t(Ds402HomeExState[recordBase + 18] = 1) &
          \t\t\t\t\t(Ds402HomeExState[recordBase + 19]$UDINT <> 0) &
          \t\t\t\t\t(Ds402HomeExState[recordBase + 20]$UDINT <> 0) &
          \t\t\t\t\t(Ds402HomeExState[recordBase + 21] = 0) &
          \t\t\t\t\t(Ds402HomeExState[recordBase + 22] = 0) &
          \t\t\t\t\t(Ds402HomeExState[recordBase + 23] = 0) &
          \t\t\t\t\t(Ds402HomeExState[recordBase + 24] = 0) &
          \t\t\t\t\t(Ds402HomeExState[recordBase + 25] = 0) &
          \t\t\t\t\t(Ds402HomeExState[recordBase + 26] = 0) &
          \t\t\t\t\t(Ds402HomeExState[recordBase + 27] = 0) &
          \t\t\t\t\t(Ds402HomeExState[recordBase + 28] = 0) &
          \t\t\t\t\t(Ds402HomeExState[recordBase + 34]$UDINT <> 0) &
          \t\t\t\t\t(Ds402HomeExState[recordBase + 37]$UDINT <> 0);
          \t\t\t\tif recordValid then
          \t\t\t\t\tif recordState = 1 then
          \t\t\t\t\t\trecordValid := recordValid &
          \t\t\t\t\t\t\t(Ds402HomeExState[recordBase + 35] = 0) &
          \t\t\t\t\t\t\t(Ds402HomeExState[recordBase + 36] = 0) &
          \t\t\t\t\t\t\t(Ds402HomeExState[recordBase + 38] = 0);
          \t\t\t\t\telse
          \t\t\t\t\t\trecordValid := recordValid &
          \t\t\t\t\t\t\t(Ds402HomeExState[recordBase + 35]$UDINT >=
          \t\t\t\t\t\t\t Ds402HomeExState[recordBase + 34]$UDINT) &
          \t\t\t\t\t\t\t(Ds402HomeExState[recordBase + 36] = 0) &
          \t\t\t\t\t\t\t(Ds402HomeExState[recordBase + 39]$UDINT <> 0);
          \t\t\t\t\tend_if;
          \t\t\t\tend_if;
          \t\t\t\tif recordDirty then
          \t\t\t\t\tif recordValid = FALSE then
          \t\t\t\t\t\tdetailCode := LMC_DIAG_HOMEEX_DETAIL_STORE_CORRUPT;
          \t\t\t\t\telsif (recordState <> 1) &
          \t\t\t\t\t\t(Ds402HomeExState[recordBase + 38]$UDINT <>
          \t\t\t\t\t\t LMC_DIAG_HOMEEX_CLEANUP_PROOF_REQUIRED) then
          \t\t\t\t\t\tdetailCode := LMC_DIAG_HOMEEX_DETAIL_CLEANUP_INCOMPLETE;
          \t\t\t\t\telse
          \t\t\t\t\t\tdetailCode := LMC_DIAG_HOMEEX_DETAIL_SLOT_OCCUPIED;
          \t\t\t\t\tend_if;
          \t\t\t\telse
          \t\t\t\t\ttombstoneDirty := FALSE;
          \t\t\t\t\trecordIndex := 0;
          \t\t\t\t\twhile recordIndex < LMC_DIAG_HOMEEX_RETIRED_STRIDE do
          \t\t\t\t\t\tif Ds402HomeExState[tombstoneBase + recordIndex] <> 0 then
          \t\t\t\t\t\t\ttombstoneDirty := TRUE;
          \t\t\t\t\t\tend_if;
          \t\t\t\t\t\trecordIndex += 1;
          \t\t\t\t\tend_while;
          \t\t\t\t\tif tombstoneDirty then
          \t\t\t\t\t\trawRetiredState := Ds402HomeExState[tombstoneBase]$UDINT;
          \t\t\t\t\t\tretiredState := TO_DINT(rawRetiredState and 0x00007FFF);
          \t\t\t\t\t\ttombstoneValid :=
          \t\t\t\t\t\t\t((rawRetiredState = 0x00008002) |
          \t\t\t\t\t\t\t (rawRetiredState = 0x00008003) |
          \t\t\t\t\t\t\t (rawRetiredState = 0x00008004)) &
          \t\t\t\t\t\t\t(Ds402HomeExState[tombstoneBase + 1]$UDINT <> 0) &
          \t\t\t\t\t\t\t(Ds402HomeExState[tombstoneBase + 2]$UDINT <> 0) &
          \t\t\t\t\t\t\t(Ds402HomeExState[tombstoneBase + 3]$UDINT <> 0) &
          \t\t\t\t\t\t\t(Ds402HomeExState[tombstoneBase + 4]$UDINT <> 0) &
          \t\t\t\t\t\t\t((Ds402HomeExState[tombstoneBase + 5] <> 0) |
          \t\t\t\t\t\t\t (Ds402HomeExState[tombstoneBase + 6] <> 0) |
