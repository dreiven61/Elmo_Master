name: HomeDS402Ex HOMEEX-05 retire wire retry once

on:
  push:
    branches:
      - codex/home-ds402ex-homeex05-retained-store
    paths:
      - '.github/workflows/home-ds402ex-homeex05-retire-wire-retry-once.yml'

permissions:
  contents: write

jobs:
  retry:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align HOMEEX-07 retained publication assertion
        shell: python
        run: |
          from pathlib import Path
          path = Path('tools/Verify-HomeDs402ExHomeex07Ownership.ps1')
          text = path.read_text(encoding='utf-8')
          old = "Require-Regex $retireBody 'Ds402HomeExState\\[tombstoneBase\\]\\s*:=\\s*TO_DINT\\(LMC_DIAG_HOMEEX_RETIRED_MAGIC\\)' 'Retire publishes the retired tombstone identity before clearing the active record'"
          new = "Require-Regex $retireBody 'Ds402HomeExState\\[tombstoneBase\\]\\s*:=\\s*TO_DINT\\(TO_UDINT\\(recordState\\)\\s+or\\s+LMC_DIAG_HOMEEX_RETIRED_STATE_MASK\\)[\\s\\S]{0,500}?Ds402HomeExState\\[recordBase\\s*\\+\\s*recordIndex\\]\\s*:=\\s*0' 'Retire publishes the full retired terminal marker before clearing the active record'"
          if text.count(old) != 1:
              raise SystemExit(f'Expected one stale HOMEEX-07 retained publication assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

      - name: Reuse staged source patch
        shell: python
        run: |
          from pathlib import Path
          workflow = Path('.github/workflows/home-ds402ex-homeex05-retire-wire-fix-once.yml').read_text(encoding='utf-8').splitlines()
          marker = '      - name: Patch full retained outcome and retire success wire contract'
          end_marker = '      - name: Verify HOMEEX-05 retained store and retire wire contract'
          start = workflow.index(marker)
          end = workflow.index(end_marker)
          run_index = next(i for i in range(start, end) if workflow[i].strip() == 'run: |')
          code_lines = workflow[run_index + 1:end]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in code_lines)
          exec(compile(code, '<reused-homeex05-source-patch>', 'exec'), {'__name__': '__main__'})

      - name: Verify HOMEEX-05 retained store and retire wire contract
        shell: powershell
        run: |
          & '.\tools\Verify-HomeDs402ExRetainedStore.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify HOMEEX-07 ownership boundary
        shell: powershell
        run: |
          & '.\tools\Verify-HomeDs402ExHomeex07Ownership.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify HOMEEX-09 source boundary
        shell: powershell
        run: |
          & '.\tools\Verify-HomeDs402ExHomeEx09Static.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify method source budgets
        shell: powershell
        run: |
          $text = [IO.File]::ReadAllText('Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCDiagnosticsService/LMCDiagnosticsService.st')
          foreach ($name in @('HandleAxisDs402HomeExStart','HandleAxisDs402HomeExOutcome','HandleAxisDs402HomeExRetire')) {
            $m = [regex]::Match($text, '(?ms)^FUNCTION\s+LMCDiagnosticsService::' + $name + '\b.*?^END_FUNCTION\s*$')
            if (-not $m.Success) { throw "Missing $name" }
            $bytes = [Text.Encoding]::UTF8.GetByteCount($m.Value)
            Write-Host "$name bytes=$bytes"
            if ($bytes -ge 32768) { throw "$name exceeds conservative 32KiB source budget: $bytes" }
          }

      - name: Diff hygiene
        shell: powershell
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Remove temporary workflows and commit repair
        shell: powershell
        run: |
          Remove-Item -LiteralPath '.github/workflows/home-ds402ex-homeex05-retire-wire-fix-once.yml'
          Remove-Item -LiteralPath '.github/workflows/home-ds402ex-homeex05-retire-wire-retry-once.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCDiagnosticsService/LMCDiagnosticsService.st' 'tools/Verify-HomeDs402ExHomeex07Ownership.ps1' '.github/workflows/home-ds402ex-homeex05-retire-wire-fix-once.yml' '.github/workflows/home-ds402ex-homeex05-retire-wire-retry-once.yml'
          git commit -m 'fix(homeex): return full retained outcome on retire'
          git push origin HEAD:codex/home-ds402ex-homeex05-retained-store
