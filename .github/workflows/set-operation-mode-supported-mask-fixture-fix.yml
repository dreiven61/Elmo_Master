name: SetOperationMode supported-mask fixture fix

on:
  push:
    branches:
      - codex/setopmode-supported-mode-mask-current-dev
    paths:
      - 'tools/Fix-SetOperationModeSupportedMaskFixture.py'
      - '.github/workflows/set-operation-mode-supported-mask-fixture-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/setopmode-supported-mode-mask-current-dev
          fetch-depth: 0
      - name: Apply fixture fix
        run: |
          python3 tools/Fix-SetOperationModeSupportedMaskFixture.py
          git diff --check
      - name: Commit and remove temporary tooling
        run: |
          git rm -- tools/Fix-SetOperationModeSupportedMaskFixture.py \
            .github/workflows/set-operation-mode-supported-mask-fixture-fix.yml
          git add -- LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/AdminSetOperationModeContractTests.cs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(mode): bind full triad fixture to supported-mode mask'
          git push origin HEAD:codex/setopmode-supported-mode-mask-current-dev
