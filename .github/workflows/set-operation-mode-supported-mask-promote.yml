name: SetOperationMode supported-mode mask promotion

on:
  push:
    branches:
      - codex/setopmode-supported-mode-mask-current-dev
    paths:
      - 'tools/Apply-SetOperationModeSupportedModeMask.py'
      - '.github/workflows/set-operation-mode-supported-mask-promote.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/setopmode-supported-mode-mask-current-dev
          fetch-depth: 0

      - name: Apply exact source promotion
        run: |
          python3 tools/Apply-SetOperationModeSupportedModeMask.py
          git diff --check

      - name: Verify production activation remains off
        shell: bash
        run: |
          grep -F '#define LMC_DIAG_SET_OPERATION_MODE_ENABLED FALSE' \
            Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCDiagnosticsService/LMCDiagnosticsService.st
          grep -F '(pResponseFrame + 24)^$UDINT := 0x00000017;' \
            Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCControlCommandService/LMCControlCommandService.st

      - name: Commit promoted sources and remove temporary tooling
        shell: bash
        run: |
          git rm -- tools/Apply-SetOperationModeSupportedModeMask.py \
            .github/workflows/set-operation-mode-supported-mask-promote.yml
          git add -- \
            LMC_Library/LMC_API_Delivery/src/LmcAdminModels.cs \
            LMC_Library/LMC_API_Delivery/src/LmcAdminProtocol.cs \
            LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/AdminSetOperationModeContractTests.cs \
            Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCControlCommandService/LMCControlCommandService.st \
            Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCDiagnosticsService/LMCDiagnosticsService.st
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(mode): advertise supported operation-mode mask fail-closed'
          git push origin HEAD:codex/setopmode-supported-mode-mask-current-dev
