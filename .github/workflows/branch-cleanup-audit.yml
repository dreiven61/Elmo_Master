name: Branch cleanup delete

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/branch-cleanup-audit.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete merged codex branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          mapfile -t refs < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin/codex/ | sort)
          echo "codex branches found: ${#refs[@]}"
          for ref in "${refs[@]}"; do
            name=${ref#origin/}
            sha=$(git rev-parse "$ref")
            if ! git merge-base --is-ancestor "$sha" origin/dev; then
              echo "REFUSING DELETE: $name is not merged into dev"
              exit 1
            fi
          done
          for ref in "${refs[@]}"; do
            name=${ref#origin/}
            echo "DELETE $name"
            git push origin --delete "$name"
          done
          git fetch --prune origin
          echo '=== REMAINING REMOTE BRANCHES ==='
          git for-each-ref --format='%(refname:short)' refs/remotes/origin/ | sort
