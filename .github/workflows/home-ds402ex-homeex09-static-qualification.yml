name: HomeDS402Ex HOMEEX-09 static qualification

on:
  push:
    branches:
      - dev
      - codex/home-ds402ex-homeex09-static-qualification
    paths:
      - 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCControlCommandService/LMCControlCommandService.st'
      - 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCDiagnosticsService/LMCDiagnosticsService.st'
      - 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/TCPMotionInterface/TCPMotionInterface.st'
      - 'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalContract.ps1'
      - 'tools/Verify-HomeDs402ExHomeex09Static.ps1'
      - 'docs/api/design/evidence/HOME_DS402_EX_HOMEEX09_STATIC_20260825.md'
      - '.github/workflows/home-ds402ex-homeex09-static-qualification.yml'
  pull_request:
    branches:
      - dev
    paths:
      - 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCControlCommandService/LMCControlCommandService.st'
      - 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCDiagnosticsService/LMCDiagnosticsService.st'
      - 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/TCPMotionInterface/TCPMotionInterface.st'
      - 'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalContract.ps1'
      - 'tools/Verify-HomeDs402ExHomeex09Static.ps1'
      - 'docs/api/design/evidence/HOME_DS402_EX_HOMEEX09_STATIC_20260825.md'
      - '.github/workflows/home-ds402ex-homeex09-static-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  homeex09-static:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify HOMEEX-09 static invariants
        shell: powershell
        run: |
          & '.\tools\Verify-HomeDs402ExHomeex09Static.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify legacy SourceOnly source gate to known artifact boundary
        shell: powershell
        run: |
          $knownArtifactBoundary = 'LASAL.UdpCallbackContract blocker: SetPosition-augmented Classes.lcb physical identity drifted.'
          $output = @(& '.\LMC_Library\LMC_API_Delivery\tests\LasalMotionControlLib.Tests\Verify-LasalContract.ps1' -RepositoryRoot $env:GITHUB_WORKSPACE 2>&1)
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($code -eq 0) {
            Write-Host 'PASS legacy SourceOnly contract completed fully.'
            exit 0
          }
          $joined = ($output | Out-String)
          if ($joined.Contains($knownArtifactBoundary)) {
            Write-Host 'PASS HOMEEX-09 source/static ratchets reached the exact known generated-artifact boundary.'
            Write-Host 'NOTE generated Classes.lcb/C78 artifact qualification remains open and is not claimed complete.'
            exit 0
          }
          exit $code

      - name: Diff hygiene
        shell: powershell
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            git diff --check "origin/$env:GITHUB_BASE_REF...HEAD"
          }
          elseif ($env:GITHUB_EVENT_NAME -eq 'push') {
            git diff --check HEAD^ HEAD
          }
          else {
            git diff --check
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
