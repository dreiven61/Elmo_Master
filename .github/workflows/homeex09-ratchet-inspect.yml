name: HOMEEX-09 ratchet inspect

on:
  pull_request:
    branches:
      - codex/home-ds402ex-homeex01-02-profile-gate
    paths:
      - '.github/workflows/homeex09-ratchet-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/home-ds402ex-homeex09-static-qualification

      - name: Print exact legacy identity fixture lines
        shell: powershell
        run: |
          @'
          from pathlib import Path

          p = Path(r'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalContract.ps1')
          lines = p.read_bytes().decode('utf-8', errors='replace').splitlines()
          needles = (
              'per-axis 8-byte tail packing drifted',
              'identityTailOffset',
              'identityTailSize',
              'LMC_OWNER_IDENTITY_STATE_BYTES',
              'LMC_OWNER_IDENTITY_AXIS_TAIL_BYTES',
              'baseline compact ownership identity/preemption',
          )
          hits = []
          for i, line in enumerate(lines, 1):
              if any(n.lower() in line.lower() for n in needles):
                  hits.append(i)
          if not hits:
              raise SystemExit('legacy identity fixture lines not found')
          wanted = set()
          for i in hits:
              for j in range(max(1, i - 3), min(len(lines), i + 3) + 1):
                  wanted.add(j)
          previous = None
          for i in sorted(wanted):
              if previous is not None and i != previous + 1:
                  print('-----')
              print(f'{i:05d}: {lines[i-1]}')
              previous = i
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
