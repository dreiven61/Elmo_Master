name: HOMEEX-09 ratchet inspect

on:
  pull_request:
    branches:
      - codex/home-ds402ex-homeex01-02-profile-gate
    paths:
      - '.github/workflows/homeex09-ratchet-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/home-ds402ex-homeex09-static-qualification

      - name: Print identity tail source contract
        shell: powershell
        run: |
          @'
          from pathlib import Path

          p = Path(r'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCControlCommandService/LMCControlCommandService.st')
          text = p.read_bytes().decode('utf-8', errors='replace')
          needles = [
              'LMC_OWNER_IDENTITY_AXIS_TAIL_BYTES',
              'identityTailOffset :=',
              'identityTailSize >',
              'replacementTailOffset :=',
          ]
          found = False
          for needle in needles:
              start = 0
              while True:
                  pos = text.lower().find(needle.lower(), start)
                  if pos < 0:
                      break
                  start = pos + len(needle)
                  found = True
                  print(f'===== needle={needle!r} pos={pos} =====')
                  print(text[max(0, pos - 900):min(len(text), pos + 1200)])
          if not found:
              raise SystemExit('identity tail source contract context not found')
          '@ | python -

      - name: Print legacy identity tail assertions
        shell: powershell
        run: |
          @'
          from pathlib import Path

          p = Path(r'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalContract.ps1')
          text = p.read_bytes().decode('utf-8', errors='replace')
          needles = [
              'per-axis 8-byte tail packing drifted',
              'ValidateAxisOwnershipPreemptionReplacement',
              'replacementTailOffset',
              'replacementTailSize',
              'oldIdentityTailOffset',
              'oldIdentityTailSize',
          ]
          found = False
          seen = set()
          for needle in needles:
              start = 0
              while True:
                  pos = text.lower().find(needle.lower(), start)
                  if pos < 0:
                      break
                  start = pos + len(needle)
                  key = (max(0, pos - 1500), min(len(text), pos + 2200))
                  if key in seen:
                      continue
                  seen.add(key)
                  found = True
                  print(f'===== legacy needle={needle!r} pos={pos} =====')
                  print(text[key[0]:key[1]])
          if not found:
              raise SystemExit('legacy identity tail assertion context not found')
          '@ | python -
