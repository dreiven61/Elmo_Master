name: HOMEEX-09 ratchet inspect

on:
  pull_request:
    branches:
      - codex/home-ds402ex-homeex01-02-profile-gate
    paths:
      - '.github/workflows/homeex09-ratchet-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/home-ds402ex-homeex09-static-qualification

      - name: Print exact verifier fragment extraction
        shell: powershell
        run: |
          @'
          from pathlib import Path

          p = Path(r'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalContract.ps1')
          text = p.read_bytes().decode('utf-8', errors='replace')
          needle = '$fragmentContracts = @('
          pos = text.find(needle)
          if pos < 0:
              raise SystemExit('fragmentContracts marker not found')
          lo = max(0, pos - 14000)
          hi = min(len(text), pos + 5000)
          print(text[lo:hi])
          '@ | python -
