name: HOMEEX-09 ratchet inspect

on:
  pull_request:
    branches:
      - codex/home-ds402ex-homeex01-02-profile-gate
    paths:
      - '.github/workflows/homeex09-ratchet-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/home-ds402ex-homeex09-static-qualification

      - name: Print disjoint Reserved-state self-test context
        shell: powershell
        run: |
          @'
          from pathlib import Path

          p = Path(r'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalContract.ps1')
          lines = p.read_bytes().decode('utf-8', errors='replace').splitlines()
          needles = (
              'Reserved state must appear exactly once for SetOperationMode',
              'LMC_OWNER_STATE_RESERVED',
              'SetOperationMode',
              'HomeDS402Ex',
          )
          hits = [i for i, line in enumerate(lines, 1) if any(n.lower() in line.lower() for n in needles)]
          focus = set(range(10790, min(len(lines), 10835) + 1))
          for i in hits:
              if 10750 <= i <= 10880 or 'Reserved state must appear exactly once' in lines[i-1]:
                  focus.update(range(max(1, i-4), min(len(lines), i+4)+1))
          for i in sorted(focus):
              print(f'{i:05d}: {lines[i-1]}')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
