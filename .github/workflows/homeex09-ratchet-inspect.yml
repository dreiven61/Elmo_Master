name: HOMEEX-09 ratchet inspect

on:
  pull_request:
    branches:
      - codex/home-ds402ex-homeex01-02-profile-gate
    paths:
      - '.github/workflows/homeex09-ratchet-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/home-ds402ex-homeex09-static-qualification

      - name: Print reserve semantic ratchet context
        shell: powershell
        run: |
          @'
          from pathlib import Path

          p = Path(r'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalContract.ps1')
          text = p.read_bytes().decode('utf-8', errors='replace')
          needle = '61704'
          positions = []
          start = 0
          while True:
              pos = text.find(needle, start)
              if pos < 0:
                  break
              positions.append(pos)
              start = pos + len(needle)
          if not positions:
              raise SystemExit('61704 reserve semantic baseline not found')
          for pos in positions:
              print(f'===== 61704 at {pos} =====')
              print(text[max(0, pos - 3000):min(len(text), pos + 3000)])
          '@ | python -
