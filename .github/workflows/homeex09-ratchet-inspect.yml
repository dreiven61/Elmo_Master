name: HOMEEX-09 ratchet inspect

on:
  pull_request:
    branches:
      - codex/home-ds402ex-homeex01-02-profile-gate
    paths:
      - '.github/workflows/homeex09-ratchet-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/home-ds402ex-homeex09-static-qualification
      - name: Print publish split blocker ratchet context
        shell: powershell
        run: |
          @'
          from pathlib import Path

          p = Path(r'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalContract.ps1')
          text = p.read_bytes().decode('utf-8', errors='replace')
          needles = ['publish split', 'macro closure', '2470', 'referenced macro']
          found = False
          seen = set()
          for needle in needles:
              start = 0
              while True:
                  pos = text.lower().find(needle.lower(), start)
                  if pos < 0:
                      break
                  start = pos + len(needle)
                  key = (max(0, pos - 1800), min(len(text), pos + 1800))
                  if key in seen:
                      continue
                  seen.add(key)
                  found = True
                  print(f'===== needle={needle!r} pos={pos} =====')
                  print(text[key[0]:key[1]])
          if not found:
              raise SystemExit('no ratchet context needles found')
          '@ | python -
