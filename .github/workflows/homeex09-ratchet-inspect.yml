name: HOMEEX-09 ratchet inspect

on:
  pull_request:
    branches:
      - codex/home-ds402ex-homeex01-02-profile-gate
    paths:
      - '.github/workflows/homeex09-ratchet-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/home-ds402ex-homeex09-static-qualification

      - name: Print compact identity packing assertion context
        shell: powershell
        run: |
          @'
          from pathlib import Path

          p = Path(r'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalContract.ps1')
          text = p.read_bytes().decode('utf-8', errors='replace')
          needles = ['64-byte prefix', 'tail packing drifted', 'identity/preemption blocker']
          seen = set()
          found = False
          for needle in needles:
              start = 0
              while True:
                  pos = text.lower().find(needle.lower(), start)
                  if pos < 0:
                      break
                  start = pos + len(needle)
                  lo = max(0, pos - 5500)
                  hi = min(len(text), pos + 3500)
                  key = (lo, hi)
                  if key in seen:
                      continue
                  seen.add(key)
                  found = True
                  print(f'===== needle={needle!r} pos={pos} =====')
                  print(text[lo:hi])
          if not found:
              raise SystemExit('compact identity packing assertion context not found')
          '@ | python -
