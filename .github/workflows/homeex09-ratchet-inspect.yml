name: HOMEEX-09 ratchet inspect

on:
  pull_request:
    branches:
      - codex/home-ds402ex-homeex01-02-profile-gate
    paths:
      - '.github/workflows/homeex09-ratchet-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/home-ds402ex-homeex09-static-qualification

      - name: Print reserve semantic ratchet context
        shell: powershell
        run: |
          @'
          from pathlib import Path

          p = Path(r'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalContract.ps1')
          text = p.read_bytes().decode('utf-8', errors='replace')
          needle = 'normalized semantic token inventory drifted'
          pos = text.find(needle)
          if pos < 0:
              raise SystemExit('reserve semantic ratchet marker not found')
          print(text[max(0, pos - 5000):min(len(text), pos + 2500)])
          '@ | python -
