name: MODE-10 C78 final qualification

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/mode10-c78-artifact-qualification.yml'

permissions:
  contents: read

jobs:
  physical-approval-source:
    runs-on: windows-latest
    steps:
      - name: Checkout finalize branch
        uses: actions/checkout@v4
        with:
          ref: codex/mode-10-c78-finalize
          fetch-depth: 0

      - name: Print physical approval and layout aggregate source
        shell: python
        run: |
          from pathlib import Path
          p = Path('LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalUdpCallbackContract.ps1')
          text = p.read_text(encoding='utf-8')
          for needle, before, after in (
              ('TerminalWakeBrokerExactPhysicalSnapshotApproved', 1800, 2600),
              ('function Assert-TerminalWakeLayoutContract', 200, 9000),
          ):
              print(f'===== {needle} =====')
              start = 0
              matches = 0
              while True:
                  idx = text.find(needle, start)
                  if idx < 0:
                      break
                  matches += 1
                  print(text[max(0, idx-before):min(len(text), idx+after)])
                  start = idx + len(needle)
              print('MATCH_COUNT=', matches)
