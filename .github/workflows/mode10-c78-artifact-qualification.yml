name: MODE-10 C78 final qualification

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/mode10-c78-artifact-qualification.yml'

permissions:
  contents: read

jobs:
  aggregate-diagnostic:
    runs-on: windows-latest
    steps:
      - name: Checkout finalize branch
        uses: actions/checkout@v4
        with:
          ref: codex/mode-10-c78-finalize
          fetch-depth: 0

      - name: Inspect TerminalWakeBrokerCandidate aggregate contract
        shell: powershell
        run: |
          $path = '.\LMC_Library\LMC_API_Delivery\tests\LasalMotionControlLib.Tests\Verify-LasalUdpCallbackContract.ps1'
          Select-String -Path $path -Pattern 'TerminalWakeBrokerCandidate' -Context 8,24
          Select-String -Path $path -Pattern 'canonical Network aggregate drifted' -Context 30,30
          Select-String -Path $path -Pattern 'CanonicalNetwork' -Context 8,16
          Select-String -Path $path -Pattern 'Network aggregate' -Context 12,20

      - name: Confirm branch and dev relationship
        shell: powershell
        run: |
          git rev-parse HEAD
          git rev-parse origin/dev
          git diff --name-status origin/dev...HEAD
