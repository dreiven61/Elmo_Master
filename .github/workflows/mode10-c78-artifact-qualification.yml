name: MODE-10 C78 final qualification

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/mode10-c78-artifact-qualification.yml'

permissions:
  contents: read

jobs:
  synthetic-selection-source:
    runs-on: windows-latest
    steps:
      - name: Checkout finalize branch
        uses: actions/checkout@v4
        with:
          ref: codex/mode-10-c78-finalize
          fetch-depth: 0

      - name: Print exact synthetic aggregate selection block
        shell: python
        run: |
          from pathlib import Path
          p = Path('LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalUdpCallbackContract.ps1')
          text = p.read_text(encoding='utf-8')
          needles = (
              '$networkAggregateExact =',
              '$expectedFullNetworkCount =',
              "$state -ceq 'TerminalWakeBrokerCandidate'",
          )
          printed = set()
          for needle in needles:
              start = 0
              while True:
                  idx = text.find(needle, start)
                  if idx < 0:
                      break
                  lo = max(0, idx - 2600)
                  hi = min(len(text), idx + 3800)
                  key = (lo, hi)
                  if key not in printed:
                      print(f'===== {needle} @ {idx} =====')
                      print(text[lo:hi])
                      printed.add(key)
                  start = idx + len(needle)
