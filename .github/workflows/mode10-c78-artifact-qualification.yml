name: MODE-10 C78 final qualification

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/mode10-c78-artifact-qualification.yml'

permissions:
  contents: read

jobs:
  gate-d-file-identity-diagnostic:
    runs-on: windows-latest
    steps:
      - name: Checkout finalize branch
        uses: actions/checkout@v4
        with:
          ref: codex/mode-10-c78-finalize
          fetch-depth: 0

      - name: Measure clean Git Gate D file identities
        shell: python
        run: |
          from pathlib import Path
          import hashlib

          files = [
              'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/Classes.lcb',
              'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Network/Comm_Network/Comm_Network.lcn',
              'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Network/Networks.lcb',
          ]
          expected_physical = {
              files[0]: (8610206, '33C1C2A68B97E852AD6646317CAE032A110D1F50C9615FA5B7EEF00410B649A8'),
              files[1]: (17686, '478D53FB082491FC47EF102044FDA2529D4ABA70D6838850DC317EAC7FE1C132'),
              files[2]: (243125, '8A115291E96D25E00D0507B68F9DAD3CFB735CE26646C0155E4533FCC2D6EFA8'),
          }
          for path in files:
              data = Path(path).read_bytes()
              digest = hashlib.sha256(data).hexdigest().upper()
              exp_bytes, exp_sha = expected_physical[path]
              print(f'{path}|ACTUAL={len(data)}/{digest}|PHYSICAL={exp_bytes}/{exp_sha}|MATCH={len(data)==exp_bytes and digest==exp_sha}')

      - name: Show SetPosition current Gate D structure
        shell: python
        run: |
          from pathlib import Path
          text = Path('LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalUdpCallbackContract.ps1').read_text(encoding='utf-8')
          marker = '$SetPositionAugmentedGateD = [ordered]@{'
          idx = text.find(marker)
          print('MARKER_INDEX=', idx)
          if idx >= 0:
              print(text[idx:idx+7000])
