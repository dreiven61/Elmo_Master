name: MODE-10 C78 final qualification

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/mode10-c78-artifact-qualification.yml'

permissions:
  contents: read

jobs:
  network-aggregate-algorithm:
    runs-on: windows-latest
    steps:
      - name: Checkout finalize branch
        uses: actions/checkout@v4
        with:
          ref: codex/mode-10-c78-finalize
          fetch-depth: 0

      - name: Print Network aggregate helper source
        shell: python
        run: |
          from pathlib import Path
          text = Path('LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalUdpCallbackContract.ps1').read_text(encoding='utf-8')
          for needle in ('function Get-NetworkSnapshotEvidence', 'function Get-NetworkAggregate', 'FullNetworkSha256', 'TrackedNetworkSha256'):
              print(f'===== {needle} =====')
              start = 0
              found = 0
              while True:
                  idx = text.find(needle, start)
                  if idx < 0:
                      break
                  found += 1
                  print(text[max(0, idx-1200):min(len(text), idx+5000)])
                  start = idx + len(needle)
                  if found >= 3:
                      break
              print('MATCHES_PRINTED=', found)

      - name: Prove tracked Network tree is unchanged since SetPosition baseline
        shell: powershell
        run: |
          $root = 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Network'
          Write-Host '===== NAME-STATUS e03352b..HEAD ====='
          git diff --name-status e03352b30da9096a3ec2b477dbfbdacc2a7c663b HEAD -- $root
          Write-Host '===== TREE IDS ====='
          git rev-parse 'e03352b30da9096a3ec2b477dbfbdacc2a7c663b:Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Network'
          git rev-parse 'HEAD:Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Network'

      - name: Compare Git attributes and checkout EOL evidence
        shell: powershell
        run: |
          $root = 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Network'
          git config --get core.autocrlf
          git check-attr text eol -- "$root/ConfigObjects.st" "$root/Comm_Network/ONE_Comm_Network_Table.st" "$root/Comm_Network/Comm_Network.lcn"
          foreach ($path in @(
            "$root/ConfigObjects.st",
            "$root/Comm_Network/ONE_Comm_Network_Table.st",
            "$root/Comm_Network/Comm_Network.lcn"
          )) {
            Write-Host "===== $path ====="
            $work = [IO.File]::ReadAllBytes($path)
            $tmp = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetRandomFileName())
            git show "HEAD:$path" | Set-Content -LiteralPath $tmp -Encoding utf8NoBOM
            $gitText = git show "HEAD:$path"
            Write-Host "WORK_BYTES=$($work.Count) WORK_CRLF_PAIRS=$(([regex]::Matches([Text.Encoding]::UTF8.GetString($work), \"`r`n\")).Count))"
            Write-Host "GIT_SHOW_LINES=$($gitText.Count)"
          }
