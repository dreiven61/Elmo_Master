name: MODE-10 C78 final qualification

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/mode10-c78-artifact-qualification.yml'

permissions:
  contents: read

jobs:
  aggregate-diagnostic:
    runs-on: windows-latest
    steps:
      - name: Checkout finalize branch
        uses: actions/checkout@v4
        with:
          ref: codex/mode-10-c78-finalize
          fetch-depth: 0

      - name: Print terminal aggregate definitions
        shell: powershell
        run: |
          $path = '.\LMC_Library\LMC_API_Delivery\tests\LasalMotionControlLib.Tests\Verify-LasalUdpCallbackContract.ps1'
          $lines = Get-Content -LiteralPath $path
          foreach ($needle in @('function Test-TerminalWakeNetworkAggregateIdentity', '$ExpectedTerminalWakeLayout =', '$ExpectedTerminalWakeLayout', '$ExpectedDerivedCandidateFullNetworkSha256')) {
            $matches = @(Select-String -LiteralPath $path -SimpleMatch $needle)
            foreach ($match in $matches) {
              $start = [Math]::Max(1, $match.LineNumber - 30)
              $end = [Math]::Min($lines.Count, $match.LineNumber + 80)
              Write-Host "===== $needle @ $($match.LineNumber) : $start..$end ====="
              for ($i = $start; $i -le $end; $i++) {
                Write-Host ('{0:D6}: {1}' -f $i, $lines[$i - 1])
              }
            }
          }

      - name: Confirm branch and dev relationship
        shell: powershell
        run: |
          git rev-parse HEAD
          git rev-parse origin/dev
          git diff --name-status origin/dev...HEAD
