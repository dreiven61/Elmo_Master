name: MODE-10 C78 artifact qualification

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/mode10-c78-artifact-qualification.yml'

permissions:
  contents: read

jobs:
  config-provenance:
    runs-on: windows-latest
    steps:
      - name: Checkout qualification branch
        uses: actions/checkout@v4
        with:
          ref: codex/mode-10-c78-artifact-qualification
          fetch-depth: 0

      - name: Trace ConfigObjects current identity and Git provenance
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import re
          import subprocess

          verifier_path = Path('LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalUdpCallbackContract.ps1')
          config_path = Path('Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Network/ConfigObjects.st')
          verifier = verifier_path.read_text(encoding='utf-8')
          rel = config_path.as_posix()

          def sha(data):
              return hashlib.sha256(data).hexdigest().upper()

          def canonical(data):
              text = data.decode('latin-1')
              text = text.replace('\r\n', '\n').replace('\r', '\n')
              return text.encode('utf-8')

          def balanced_block(text, marker):
              start = text.index(marker)
              brace = text.index('{', start)
              depth = 0
              quote = None
              i = brace
              while i < len(text):
                  c = text[i]
                  if quote:
                      if c == quote:
                          if i + 1 < len(text) and text[i + 1] == quote:
                              i += 2
                              continue
                          quote = None
                      i += 1
                      continue
                  if c in "'\"":
                      quote = c
                  elif c == '{':
                      depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          return text[start:i + 1]
                  i += 1
              raise RuntimeError(f'unterminated block: {marker}')

          def int_field(block, name):
              m = re.search(rf'(?m)^\s*{re.escape(name)}\s*=\s*(\d+)\s*$', block)
              if not m:
                  raise RuntimeError(f'{name} missing')
              return int(m.group(1))

          def sha_field(block, name):
              m = re.search(rf"(?ms)^\s*{re.escape(name)}\s*=\s*\r?\n\s*'([0-9A-Fa-f]+)'", block)
              if not m:
                  m = re.search(rf"(?m)^\s*{re.escape(name)}\s*=\s*'([0-9A-Fa-f]+)'\s*$", block)
              if not m:
                  raise RuntimeError(f'{name} missing')
              return m.group(1).upper()

          current_gate = balanced_block(verifier, '$SetPositionAugmentedGateD = [ordered]@{')
          expected = balanced_block(current_gate, 'ConfigObjects = [ordered]@{')
          expected_raw_bytes = int_field(expected, 'RawBytes')
          expected_raw_sha = sha_field(expected, 'RawSha256')
          expected_canon_bytes = int_field(expected, 'CanonicalLfBytes')
          expected_canon_sha = sha_field(expected, 'CanonicalLfSha256')

          actual = config_path.read_bytes()
          actual_canon = canonical(actual)
          print(f'EXPECTED_CONFIG_RAW_BYTES={expected_raw_bytes}')
          print(f'EXPECTED_CONFIG_RAW_SHA256={expected_raw_sha}')
          print(f'EXPECTED_CONFIG_CANON_BYTES={expected_canon_bytes}')
          print(f'EXPECTED_CONFIG_CANON_SHA256={expected_canon_sha}')
          print(f'ACTUAL_CONFIG_RAW_BYTES={len(actual)}')
          print(f'ACTUAL_CONFIG_RAW_SHA256={sha(actual)}')
          print(f'ACTUAL_CONFIG_CANON_BYTES={len(actual_canon)}')
          print(f'ACTUAL_CONFIG_CANON_SHA256={sha(actual_canon)}')
          print('ACTUAL_GIT_BLOB=' + subprocess.check_output(['git','rev-parse',f'HEAD:{rel}'], text=True).strip())

          commits = subprocess.check_output(['git','rev-list','--all','--',rel], text=True).splitlines()
          seen = set()
          expected_matches = []
          actual_matches = []
          print('CONFIG_HISTORY_BEGIN')
          for commit in commits:
              try:
                  raw = subprocess.check_output(['git','show',f'{commit}:{rel}'])
              except subprocess.CalledProcessError:
                  continue
              raw_sha = sha(raw)
              key = (len(raw), raw_sha)
              subject = subprocess.check_output(['git','show','-s','--format=%cs|%s',commit], text=True).strip()
              if raw_sha == expected_raw_sha and len(raw) == expected_raw_bytes:
                  expected_matches.append((commit, subject))
              if raw_sha == sha(actual) and len(raw) == len(actual):
                  actual_matches.append((commit, subject))
              if key not in seen and len(seen) < 20:
                  seen.add(key)
                  can = canonical(raw)
                  print(f'{commit}|{subject}|RAW={len(raw)}/{raw_sha}|CANON={len(can)}/{sha(can)}')
          print('CONFIG_HISTORY_END')
          for commit, subject in expected_matches[:10]:
              print(f'EXPECTED_IDENTITY_MATCH={commit}|{subject}')
          for commit, subject in actual_matches[:10]:
              print(f'ACTUAL_IDENTITY_MATCH={commit}|{subject}')

      - name: Confirm fresh rebuild commit still contains only generated binaries
        shell: powershell
        run: |
          $files = @(git diff --name-only ca86903da82e815c1f6afa46bd7a66241ef0fed2..95f18563640504eee56bc726df4275c20f708310)
          $expected = @(
            'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/Classes.lcb',
            'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Elmo_EtherCAT_Test_4Axis.lcb'
          )
          if (($files.Count -ne $expected.Count) -or (@(Compare-Object $files $expected).Count -ne 0)) {
            throw "Unexpected rebuild commit file set: $($files -join ', ')"
          }
          Write-Host 'Fresh rebuild commit file set is binary-only and exact.'
