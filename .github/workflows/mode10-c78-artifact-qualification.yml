name: MODE-10 C78 final qualification

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/mode10-c78-artifact-qualification.yml'

permissions:
  contents: read

jobs:
  assertion-source-diagnostic:
    runs-on: windows-latest
    steps:
      - name: Checkout finalize branch
        uses: actions/checkout@v4
        with:
          ref: codex/mode-10-c78-finalize
          fetch-depth: 0

      - name: Print exact aggregate assertion source
        shell: python
        run: |
          from pathlib import Path
          path = Path('LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalUdpCallbackContract.ps1')
          text = path.read_text(encoding='utf-8')
          needle = 'canonical Network aggregate drifted.'
          positions = []
          start = 0
          while True:
              idx = text.find(needle, start)
              if idx < 0:
                  break
              positions.append(idx)
              start = idx + 1
          print('MATCH_COUNT=', len(positions))
          for n, idx in enumerate(positions):
              lo = max(0, idx - 600)
              hi = min(len(text), idx + 600)
              print(f'===== MATCH {n} INDEX {idx} =====')
              print(repr(text[lo:hi]))

      - name: Print exact terminal layout helper source
        shell: python
        run: |
          from pathlib import Path
          text = Path('LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalUdpCallbackContract.ps1').read_text(encoding='utf-8')
          for needle in ('function Test-TerminalWakeNetworkAggregateIdentity', '$ExpectedTerminalWakeLayout ='):
              idx = text.find(needle)
              print(f'===== {needle} INDEX {idx} =====')
              if idx >= 0:
                  print(repr(text[max(0, idx-200):min(len(text), idx+3000)]))
