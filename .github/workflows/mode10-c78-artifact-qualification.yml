name: MODE-10 C78 final qualification

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/mode10-c78-artifact-qualification.yml'

permissions:
  contents: read

jobs:
  terminal-wake-provenance:
    runs-on: windows-latest
    steps:
      - name: Checkout finalize branch
        uses: actions/checkout@v4
        with:
          ref: codex/mode-10-c78-finalize
          fetch-depth: 0

      - name: Print expected aggregate selection logic
        shell: python
        run: |
          from pathlib import Path
          text = Path('LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalUdpCallbackContract.ps1').read_text(encoding='utf-8')
          needle = 'if (-not $networkAggregateExact)'
          positions = []
          start = 0
          while True:
              idx = text.find(needle, start)
              if idx < 0: break
              positions.append(idx); start = idx + 1
          print('NETWORK_AGGREGATE_ASSERT_COUNT=', len(positions))
          for idx in positions:
              window = text[max(0, idx-5000):min(len(text), idx+1200)]
              if 'TerminalWakeBrokerCandidate' in window:
                  print('===== TERMINAL WAKE AGGREGATE SELECTION =====')
                  print(window)

      - name: Trace expected and actual aggregate hashes through Git history
        shell: powershell
        run: |
          $verifier = 'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalUdpCallbackContract.ps1'
          foreach ($token in @(
            '50F26CC4B5E4210985FB3474934F13B393979A564548F82589370EE8F0D3C0B9',
            'BA304BFC820CDEB4B0027AAA506DE8D9E68498B6F522529BDBEF20FEB6070EC3',
            'C8953FC1F486F320A6EBC673E09A430BF82D442715C3B8CFCD50A17F0BEBF0BB',
            '1F82198AA56B2D25D353AB88BC3A3DA3DF494EA065B9C572528E0DF6C7A956FD',
            'ExpectedTerminalWakeLayout'
          )) {
            Write-Host "===== git log -S $token ====="
            git log --all --date=short --format='%H|%ad|%s' -S $token -- $verifier
          }

      - name: Inspect SetPosition verifier delta around terminal/network constants
        shell: powershell
        run: |
          $verifier = 'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalUdpCallbackContract.ps1'
          git diff --unified=8 dde24aadf3fe53d173abb330cfadc991400de459 e03352b30da9096a3ec2b477dbfbdacc2a7c663b -- $verifier | `
            Select-String -Pattern 'TerminalWake|FullNetwork|TrackedNetwork|ConfigObjects|SetPosition' -Context 8,12

      - name: Compare tracked Network inventory around SetPosition
        shell: powershell
        run: |
          $root = 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Network'
          foreach ($rev in @('dde24aadf3fe53d173abb330cfadc991400de459','e03352b30da9096a3ec2b477dbfbdacc2a7c663b','HEAD')) {
            Write-Host "===== $rev TRACKED NETWORK ====="
            $files = @(git ls-tree -r --name-only $rev -- $root)
            Write-Host "COUNT=$($files.Count)"
            $files
          }
