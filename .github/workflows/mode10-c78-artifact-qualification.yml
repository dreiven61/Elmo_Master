name: MODE-10 C78 artifact qualification

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/mode10-c78-artifact-qualification.yml'

permissions:
  contents: read

jobs:
  identity:
    runs-on: windows-latest
    steps:
      - name: Checkout qualification branch
        uses: actions/checkout@v4
        with:
          ref: codex/mode-10-c78-artifact-qualification
          fetch-depth: 0

      - name: Print fresh C78 artifact identities
        shell: powershell
        run: |
          $classes = '.\Lasal_PRG\Elmo_EtherCAT_Test_4Axis\Class\Classes.lcb'
          $project = '.\Lasal_PRG\Elmo_EtherCAT_Test_4Axis\Elmo_EtherCAT_Test_4Axis.lcb'
          $classesItem = Get-Item -LiteralPath $classes
          $projectItem = Get-Item -LiteralPath $project
          $classesHash = (Get-FileHash -LiteralPath $classes -Algorithm SHA256).Hash
          $projectHash = (Get-FileHash -LiteralPath $project -Algorithm SHA256).Hash
          Write-Host "CLASSES_BYTES=$($classesItem.Length)"
          Write-Host "CLASSES_SHA256=$classesHash"
          Write-Host "PROJECT_BYTES=$($projectItem.Length)"
          Write-Host "PROJECT_SHA256=$projectHash"

      - name: Derive current Gate D binary delta contracts
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import re
          import subprocess

          verifier = Path('LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalUdpCallbackContract.ps1').read_text(encoding='utf-8')

          def balanced_block(text, marker):
              start = text.index(marker)
              brace = text.index('{', start)
              depth = 0
              quote = None
              i = brace
              while i < len(text):
                  c = text[i]
                  if quote:
                      if c == quote:
                          if i + 1 < len(text) and text[i + 1] == quote:
                              i += 2
                              continue
                          quote = None
                      i += 1
                      continue
                  if c in "'\"":
                      quote = c
                  elif c == '{':
                      depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          return text[start:i + 1]
                  i += 1
              raise RuntimeError(f'unterminated block: {marker}')

          def field(block, name, kind='int'):
              if kind == 'int':
                  m = re.search(rf'(?m)^\s*{re.escape(name)}\s*=\s*(\d+)\s*$', block)
                  return int(m.group(1)) if m else None
              m = re.search(rf"(?ms)^\s*{re.escape(name)}\s*=\s*\r?\n\s*'([0-9A-Fa-f]+)'", block)
              if not m:
                  m = re.search(rf"(?m)^\s*{re.escape(name)}\s*=\s*'([0-9A-Fa-f]+)'\s*$", block)
              return m.group(1).upper() if m else None

          pre = balanced_block(verifier, '$PreSetPositionGateD = [ordered]@{')
          cur = balanced_block(verifier, '$SetPositionAugmentedGateD = [ordered]@{')
          pre_classes = balanced_block(pre, 'Classes = [ordered]@{')
          pre_project = balanced_block(pre, 'Project = [ordered]@{')
          cur_classes = balanced_block(cur, 'Classes = [ordered]@{')
          cur_project = balanced_block(cur, 'Project = [ordered]@{')

          def object_id(block):
              m = re.search(r"(?m)^\s*ObjectId\s*=\s*'([0-9a-fA-F]{40,64})'\s*$", block)
              if not m:
                  raise RuntimeError('ObjectId missing')
              return m.group(1)

          def blob(oid):
              return subprocess.check_output(['git', 'cat-file', 'blob', oid])

          def sha(data):
              return hashlib.sha256(data).hexdigest().upper()

          def delta(label, historical, current):
              prefix = 0
              lim = min(len(historical), len(current))
              while prefix < lim and historical[prefix] == current[prefix]:
                  prefix += 1
              suffix = 0
              while suffix < (lim - prefix) and historical[-1 - suffix] == current[-1 - suffix]:
                  suffix += 1
              hist_window = historical[prefix:len(historical)-suffix if suffix else len(historical)]
              cur_window = current[prefix:len(current)-suffix if suffix else len(current)]
              print(f'{label}_PREFIX_BYTES={prefix}')
              print(f'{label}_HIST_CHANGED_BYTES={len(hist_window)}')
              print(f'{label}_HIST_CHANGED_SHA256={sha(hist_window)}')
              print(f'{label}_CURRENT_CHANGED_BYTES={len(cur_window)}')
              print(f'{label}_CURRENT_CHANGED_SHA256={sha(cur_window)}')
              print(f'{label}_SUFFIX_BYTES={suffix}')

          historical_classes = blob(object_id(pre_classes))
          historical_project = blob(object_id(pre_project))
          current_classes = Path('Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/Classes.lcb').read_bytes()
          current_project = Path('Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Elmo_EtherCAT_Test_4Axis.lcb').read_bytes()

          for label, block in [('OLD_CURRENT_CLASSES', cur_classes), ('OLD_CURRENT_PROJECT', cur_project)]:
              print(f'{label}_BYTES={field(block, "Bytes")}')
              print(f'{label}_SHA256={field(block, "Sha256", "sha")}')

          expected_pre_classes_bytes = field(pre_classes, 'Bytes')
          expected_pre_classes_sha = field(pre_classes, 'Sha256', 'sha')
          expected_pre_project_bytes = field(pre_project, 'Bytes')
          expected_pre_project_sha = field(pre_project, 'Sha256', 'sha')
          if len(historical_classes) != expected_pre_classes_bytes or sha(historical_classes) != expected_pre_classes_sha:
              raise SystemExit('historical Classes Gate D identity mismatch')
          if len(historical_project) != expected_pre_project_bytes or sha(historical_project) != expected_pre_project_sha:
              raise SystemExit('historical project Gate D identity mismatch')

          delta('CLASSES', historical_classes, current_classes)
          delta('PROJECT', historical_project, current_project)

      - name: Confirm rebuild commit contains generated binaries only
        shell: powershell
        run: |
          $files = @(git diff --name-only ca86903da82e815c1f6afa46bd7a66241ef0fed2..95f18563640504eee56bc726df4275c20f708310)
          $expected = @(
            'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/Classes.lcb',
            'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Elmo_EtherCAT_Test_4Axis.lcb'
          )
          if (($files.Count -ne $expected.Count) -or (@(Compare-Object $files $expected).Count -ne 0)) {
            throw "Unexpected rebuild commit file set: $($files -join ', ')"
          }
          Write-Host 'Fresh rebuild commit file set is binary-only and exact.'
