name: MODE-10 C78 final qualification

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/mode10-c78-artifact-qualification.yml'

permissions:
  contents: read

jobs:
  terminal-wake-diagnostic:
    runs-on: windows-latest
    steps:
      - name: Checkout finalize branch
        uses: actions/checkout@v4
        with:
          ref: codex/mode-10-c78-finalize
          fetch-depth: 0

      - name: Patch known current Gate D identities in working tree
        shell: python
        run: |
          from pathlib import Path

          path = Path('LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalUdpCallbackContract.ps1')
          text = path.read_text(encoding='utf-8')
          marker = '$SetPositionAugmentedGateD = [ordered]@{'
          start = text.index(marker)
          brace = text.index('{', start)
          depth = 0
          quote = None
          end = None
          i = brace
          while i < len(text):
              c = text[i]
              if quote:
                  if c == quote:
                      if i + 1 < len(text) and text[i + 1] == quote:
                          i += 2
                          continue
                      quote = None
                  i += 1
                  continue
              if c in "'\"":
                  quote = c
              elif c == '{':
                  depth += 1
              elif c == '}':
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
              i += 1
          if end is None:
              raise SystemExit('SetPositionAugmentedGateD block is unterminated')

          block = text[start:end]
          replacements = [
              ('Bytes = 8610206', 'Bytes = 8635284'),
              ("'33C1C2A68B97E852AD6646317CAE032A110D1F50C9615FA5B7EEF00410B649A8'", "'E5F86F542B0FA45065D2197054EE52493A29D57DB091FB32BF20151937736D2D'"),
              ('CurrentChangedBytes = 8594124', 'CurrentChangedBytes = 8619202'),
              ("'137B073078A13D0F7C7702D957A7AB51BE3D083ED27D83FB1A586F9F9673AAB7'", "'A0FD24EA008742655644A8DB844E0BA899DEEA8F64CC091FF0BD12109410FAB9'"),
              ("'FE640A0683466FC1C68537A1CF5E9B96EEFBBBC5EE4885A78F25AF2557193A0E'", "'9887CD1BE02A4143FF67E8AC0D394123441C99C801F23C1DEDA8D93834732CF6'"),
              ("'611E9988056CD723F516D80FCE7C2FDC914CEC97EB7189FA11C3C61BA93F67F7'", "'4C7122E4BBDEF861E75C9CFB87E5171F28F4C1943A90EEFDD3910FEAD02CB572'"),
              ('RawBytes = 8830', 'RawBytes = 8585'),
              ("'4976C5C46F5647F55BAA54AF99D80A761A5C0648C74484939872AD277C13AC3F'", "'F9DCC4C7A3F174E908539E038AE19BF8A56B94175F99BDB708D653AB442B6163'"),
              ('RawBytes = 25455', 'RawBytes = 24305'),
              ("'D827E526A997A6595BDF2B8CFDF8539DCFBD836CD6802DBC5B2705DA3BBF5FAF'", "'8DB54FBE3B59135960562E80EF59F9C54DE2A9136C5553C117B75AEEAA7A10BD'"),
              ('RawBytes = 21521', 'RawBytes = 20697'),
              ("'F849B0E5F898C4C2D6269E3DF33B8F9EA93107AF0DD24A8933F75F9AB92B067F'", "'A734FEBD1FE60AAB3B530AF56E738F9D77FFC952411B1A6DCAC035D161844B1D'"),
              ('RawBytes = 64423', 'RawBytes = 61906'),
              ("'EDD3F17794126577E17A841AD1D562F1CB6D41D03D7C7A7E3690146918E029AD'", "'4DDCD07636E534D3B1A41B3FCCA55F76CC68EACAA413A24F9BBC14CC76820B24'"),
              ('RawBytes = 12136', 'RawBytes = 11843'),
              ("'E17E1EBF0C3171C8D52B7F70FB124078931FAB8D6089C1DE83257502186E7ECE'", "'BDF3134A791F480915A8864B59193690B2881C1A5D7F5529822088FC60678AA1'"),
          ]
          for old, new in replacements:
              count = block.count(old)
              if count != 1:
                  raise SystemExit(f'Gate D replacement count for {old!r}: {count}')
              block = block.replace(old, new, 1)
          text = text[:start] + block + text[end:]
          path.write_text(text, encoding='utf-8', newline='')

      - name: Inject temporary TerminalWakeBrokerCandidate diagnostic
        shell: python
        run: |
          from pathlib import Path
          path = Path('LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalUdpCallbackContract.ps1')
          text = path.read_text(encoding='utf-8')
          old = '''        Throw-UdpCallbackBlocker (\n            "$($Scenario.Name) canonical Network aggregate drifted.")'''
          new = '''        if ($Scenario.Name -ceq 'TerminalWakeBrokerCandidate') {\n            Write-Host ('TERMINAL_WAKE_ACTUAL_NETWORK=' + ($fixture.Network | ConvertTo-Json -Depth 12 -Compress))\n            Write-Host ('TERMINAL_WAKE_EXPECTED_LAYOUT=' + ($terminalWakeLayout | ConvertTo-Json -Depth 12 -Compress))\n            Write-Host ('TERMINAL_WAKE_ACTUAL_PROJECT_SHA=' + $fixture.ProjectDefinitionSha256)\n        }\n        Throw-UdpCallbackBlocker (\n            "$($Scenario.Name) canonical Network aggregate drifted.")'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'network aggregate throw replacement count={count}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8', newline='')

      - name: Run full SourceOnly to capture exact synthetic aggregate
        shell: powershell
        continue-on-error: true
        run: |
          $repoRoot = (Get-Location).Path
          & '.\LMC_Library\LMC_API_Delivery\tests\LasalMotionControlLib.Tests\Verify-LasalContract.ps1' `
            -RepositoryRoot $repoRoot `
            -SourceOnly `
            -ExpectedSdoWriteAxis 1

      - name: Prove diagnostics were not committed
        shell: powershell
        run: |
          git diff --name-only
          git status --short
