name: Diagnose H37 ownership SourceOnly self-test

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/diagnose-h37-ownership.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect ordinary safety-repeat verifier body
        shell: powershell
        run: |
          function Show-Lines([string]$Path, [int]$Start, [int]$End) {
            $lines = Get-Content -LiteralPath $Path
            Write-Host "===== $Path lines $Start..$End ====="
            for ($i = $Start; $i -le $End -and $i -le $lines.Count; $i++) {
              Write-Host ("{0:D6}: {1}" -f $i, $lines[$i - 1])
            }
          }
          $contract = '.\LMC_Library\LMC_API_Delivery\tests\LasalMotionControlLib.Tests\Verify-LasalContract.ps1'
          $fixture = '.\LMC_Library\LMC_API_Delivery\tests\LasalMotionControlLib.Tests\Verify-LasalAxisOwnershipActivationGuard.Fixture.ps1'
          Show-Lines $contract 14170 14525
          Show-Lines $contract 15535 15630
          Show-Lines $fixture 1380 1490

          Write-Host '===== likely Reserve/result source sites ====='
          Get-ChildItem -Path '.\Lasal_PRG\Elmo_EtherCAT_Test_4Axis\Class' -Recurse -File -Filter '*.st' |
            Select-String -Pattern 'ReserveAxisOwner|OwnerReserve|ReservationResult|Retained|safetyRepeat' -Context 5,12 |
            Select-Object -First 120 |
            ForEach-Object { $_ | Format-List * | Out-String | Write-Host }
