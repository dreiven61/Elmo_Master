name: Diagnose H37 ownership SourceOnly self-test

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/diagnose-h37-ownership.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact Reserve positive repeat return
        shell: powershell
        run: |
          $control = '.\Lasal_PRG\Elmo_EtherCAT_Test_4Axis\Class\LMCControlCommandService\LMCControlCommandService.st'
          $contract = '.\LMC_Library\LMC_API_Delivery\tests\LasalMotionControlLib.Tests\Verify-LasalContract.ps1'
          $fixture = '.\LMC_Library\LMC_API_Delivery\tests\LasalMotionControlLib.Tests\Verify-LasalAxisOwnershipActivationGuard.Fixture.ps1'

          Write-Host '===== ACTUAL Reserve repeatMode > 0 block ====='
          Select-String -Path $control -Pattern 'if repeatMode > 0 then' -SimpleMatch -Context 10,45 |
            ForEach-Object { $_ | Format-List * | Out-String | Write-Host }

          Write-Host '===== ACTUAL nextToken vicinity ====='
          Select-String -Path $control -Pattern 'nextToken :=' -SimpleMatch -Context 30,10 |
            Select-Object -First 4 |
            ForEach-Object { $_ | Format-List * | Out-String | Write-Host }

          Write-Host '===== VERIFIER repeat return assertions ====='
          Select-String -Path $contract -Pattern '$repeatReturn =' -SimpleMatch -Context 0,38 |
            ForEach-Object { $_ | Format-List * | Out-String | Write-Host }

          Write-Host '===== FIXTURE mutations touching repeatMode return ====='
          Select-String -Path $fixture -Pattern 'Result\s*:=\s*repeatMode|PositiveReturn|Immutable|repeatMode' -Context 4,12 |
            Select-Object -Last 100 |
            ForEach-Object { $_ | Format-List * | Out-String | Write-Host }
