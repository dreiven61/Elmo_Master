name: MODE-07 sync runner

on:
  pull_request:
    branches:
      - dev
    types:
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'codex/mode-07-no-replay-recovery'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MODE-07 branch
        uses: actions/checkout@v4
        with:
          ref: codex/mode-07-no-replay-recovery
          fetch-depth: 0

      - name: Apply exact patch
        run: python .github/mode07_patch.py

      - name: Validate and commit source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCDiagnosticsService/LMCDiagnosticsService.st"
          git config user.name "openai-codex[bot]"
          git config user.email "openai-codex[bot]@users.noreply.github.com"
          git add Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCDiagnosticsService/LMCDiagnosticsService.st
          git rm .github/mode07_patch.py .github/mode07-trigger.txt
          git diff --cached --check
          git commit -m "feat(mode): add SetOperationMode no-replay recovery"
          git push origin HEAD:codex/mode-07-no-replay-recovery
