name: One-shot development design sync

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/docs-design-sync-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Synchronize progress and design documents
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def load(path):
              return Path(path).read_text(encoding='utf-8')

          def save(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='\n')

          def rep(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing replacement anchor: {label}')
              return text.replace(old, new, 1)

          # 1) Current development progress — single current source of truth.
          path = 'docs/api/API_DEVELOPMENT_PROGRESS.md'
          t = load(path)
          t = rep(t, '- 문서 버전: 1.0-current', '- 문서 버전: 1.1-current', 'progress version')
          t = rep(t, '- 기준일: 2026-08-25', '- 기준일: 2026-08-26', 'progress date')
          t = rep(t, '- 기준 branch/HEAD: `dev@5a98162b5d48` + HOMEEX-06 current-progress 동기화', '- 기준 branch/HEAD: `dev@c14a3d3a4138` — HomeDS402Ex software-side integration 및 branch cleanup 완료 기준', 'progress head')
          t = rep(t,
          '현재 active development 기준은 `dev` branch다. `codex/*` 작업 branch는 구현·시험 과정의\n임시 branch이며 current source of truth로 사용하지 않는다. 개발이 끝날 때까지 unique diff와\n시험 흔적 보존을 위해 유지하고, `dev` 반영 또는 명시적 폐기와 증거 보존을 확인한 뒤 stale\nbranch를 일괄 정리한다.',
          '현재 active development 기준은 `dev` branch다. 2026-08-26 cleanup 이후 임시 `codex/*` branch는\nPR #14 `mode-10-c78-finalize`와 PR #18 `setopmode-mode11-bench-activation` 두 개만 의도적으로\n보존한다. #14는 C78 qualification history/review용이며 그대로 merge하는 branch가 아니고, #18은\nphysical bench qualification 전용 `DO NOT MERGE` branch다. 새 기능 개발은 current `dev`에서 새\nbranch를 만들어 진행한다.', 'progress branch policy')
          t = rep(t,
          '- HomeDS402Ex `0x7D1B/0x7D1C/0x7D1D`는 HOMEEX-06에서 LASAL diagnostics route, 전용 scaffold state와 strict Start/Outcome/Retire parser를 구현했고 67-check `SCAFFOLD_OFF` source/static qualification을 통과했다. runtime gate와 Admin bit 11은 OFF이며 OwnerKind 7/full 116-byte owner identity, SDO/RT/motion execution은 HOMEEX-07 이후로 닫혀 있다.',
          '- HomeDS402Ex `0x7D1B/0x7D1C/0x7D1D`는 HOMEEX-06 scaffold에 더해 HOMEEX-07 full-identity ownership admission, HOMEEX-01/02 fail-closed profile approval gate, HOMEEX-09 source/static identity qualification과 HOMEEX-08 approved-profile -> frozen DINT plan preparation gate까지 `dev`에 통합됐다. runtime gate와 Admin bit 11은 계속 OFF이며 실제 parameter SDO/homing runtime, hardware profile 승인, fresh C78/generated artifact와 실축 proof는 아직 없다.', 'progress homeex summary')
          t = rep(t,
          '| HomeDS402Ex | `0x7D1B/7D1C/7D1D` | Dormant | HOMEEX-06 diagnostics route + dedicated scaffold state + strict Start/Outcome/Retire parser; 67-check `SCAFFOLD_OFF` PASS; runtime gate/bit 11 OFF, owner/SDO/RT/motion 미구현 |',
          '| HomeDS402Ex | `0x7D1B/7D1C/7D1D` | Dormant | full 116-byte identity ownership admission + pending profile gate + HOMEEX-09 source/static + approved-profile frozen-plan preparation 통합; runtime gate/bit 11 OFF, actual SDO/RT/homing/hardware qualification 미개방 |', 'progress homeex table')
          anchor = '## 6. 최신 검증 현황\n'
          insert = '''### 5.6 HomeDS402Ex HOMEEX-07 / HOMEEX-01/02 / HOMEEX-09 / HOMEEX-08 통합\n\n2026-08-26 `dev`에는 다음 software-side tranche가 순서대로 통합됐다.\n\n- PR #26 / HOMEEX-07: OwnerKind 7, active state 13, shared ResourceKind 3와 116-byte Start identity를\n  64-byte prefix + 52-byte per-axis tail로 보존하는 ownership admission\n- PR #27 / HOMEEX-01/02: axis 1..4 `Pending`/`Approved` profile manifest와 verifier; 실제 wiring/scale\n  값은 issue #28 승인 전까지 `pending/null`\n- PR #29 / HOMEEX-09: stale per-axis `* 8` identity stride 제거, 52-byte tail geometry와 legacy\n  SourceOnly ownership ratchet 정합; dedicated static `37/37 PASS`\n- PR #30 / HOMEEX-08 preparation: approved profile + engineering parameters를 checked frozen DINT plan으로\n  변환하는 internal gate, method allowlist/MapRevision/range/vendor-specific zero policy 검증\n\n위 통합은 actual HomeDS402Ex parameter snapshot/program/restore, mode 6/controlword bit 4 execution,\nRT owner activation, physical homing 또는 capability bit 11 activation을 열지 않는다.\n\n'''
          if insert not in t:
              t = rep(t, anchor, insert + anchor, 'progress homeex section')
          t = rep(t,
          '| SetOperationMode no-replay/D5 deny | PASS | Source/static | recovery 0x6060 write 0, generic D5 0x6060 deny |\n| Full SourceOnly | **STOP** | Source/artifact | source gate 이후 `Classes.lcb` physical identity mismatch |',
          '| SetOperationMode no-replay/D5 deny | PASS | Source/static | recovery 0x6060 write 0, generic D5 0x6060 deny |\n| HomeDS402Ex HOMEEX-09 static | `37/37 PASS` | Source/static current | 52-byte identity tail, Reserved-state classifier, runtime/capability OFF invariant |\n| HomeDS402Ex approved-plan Debug/Release | PASS | PC current | workflow `32921714514` rerun; full tests + diff hygiene PASS |\n| HomeDS402Ex SDK wire Debug/Release | PASS | PC current | workflow `32921714525`; full tests + diff hygiene PASS |\n| HomeDS402Ex WPF recovery Debug/Release | PASS | PC current | workflow `32921714585`; full tests + diff hygiene PASS |\n| Full SourceOnly | **STOP** | Source/artifact | source gate 이후 `Classes.lcb` physical identity mismatch |', 'progress validation rows')
          t = rep(t,
          '- latest `dev` source의 fresh C78/ARM Rebuild/Link와 generated `Classes.lcb`',
          '- HomeDS402Ex issue #28 axis 1..4 wiring/method/scale/range/rounding/vendor mapping/MapRevision 실제 승인\n- HomeDS402Ex current source의 fresh method-size/C78/generated `Classes.lcb` qualification\n- HomeDS402Ex Axis1 -> Axis2~4 normal/fault/timeout/preempt/reconnect/retire hardware matrix\n- latest `dev` source의 fresh C78/ARM Rebuild/Link와 generated `Classes.lcb`', 'progress missing evidence')
          t = rep(t,
          '| 3 | [HomeDS402Ex](design/HOME_DS402_EX_DESIGN.md) | 0% | axis profile/scale 승인 후 `0x7D1B/1C/1D` dormant lifecycle |',
          '| 3 | [HomeDS402Ex](design/HOME_DS402_EX_DESIGN.md) | 40% | software-side ownership/profile/source-static/approved-plan 준비 통합; issue #28 + C78/generated artifact 후 actual SDO/homing runtime |', 'progress p0 percentage')
          p2 = '### P2 - SetPosition durable backend와 executor\n'
          p1a = '''### P1A - HomeDS402Ex software-side integration — source-safe / runtime OFF\n\n1. issue #28에서 axis 1..4 wiring, polarity, method allowlist, scale, range, rounding, vendor mapping과\n   paired MapRevision을 실제 evidence로 승인한다.\n2. current `dev`를 fresh C78/ARM Rebuild/Link해 method-size와 generated `Classes.lcb` identity를 닫는다.\n3. 위 두 gate가 닫히기 전에는 parameter SDO snapshot/program/restore와 homing runtime을 열지 않는다.\n4. 이후 Axis1 HOMEEX-10 matrix를 통과한 뒤 Axis2~4 HOMEEX-11로 확대한다.\n5. HOMEEX-13 전까지 Admin bit 11과 WPF Start UI는 OFF로 유지한다.\n\n'''
          if p1a not in t:
              t = rep(t, p2, p1a + p2, 'progress p1a')
          t = rep(t,
          '| SetOperationMode WPF recovery evidence | [MODE-13 evidence](design/evidence/SET_OPERATION_MODE_MODE13_WPF_RECOVERY_20260825.md) |\n| 설계 이유 | `docs/architecture/**` |',
          '| SetOperationMode WPF recovery evidence | [MODE-13 evidence](design/evidence/SET_OPERATION_MODE_MODE13_WPF_RECOVERY_20260825.md) |\n| HomeDS402Ex current design | [HomeDS402Ex 설계](design/HOME_DS402_EX_DESIGN.md) |\n| 2026-08-26 integrated checkpoint | [개발 상태 스냅샷](design/DEVELOPMENT_STATUS_20260826.md) |\n| 설계 이유 | `docs/architecture/**` |', 'progress system of record')
          t = rep(t,
          '이 문서만 current 진척도를 가진다. branch cleanup은 current 상태 기록과 분리한다. 개발 중에는\n`codex/*`의 unique diff를 보존하고, 개발 완료 시 각 branch가 `dev`에 포함됐는지 또는 폐기\n가능한지 확인한 뒤 일괄 정리한다.',
          '이 문서만 current 진척도를 가진다. 2026-08-26 merged/obsolete branch cleanup은 완료됐다.\n현재 보존 `codex/*`는 PR #14 history/review와 PR #18 physical bench qualification뿐이며 둘 다\ncurrent source of truth가 아니다. 새 개발 branch는 반드시 current `dev`에서 시작한다.', 'progress final branch note')
          save(path, t)

          # 2) Design index.
          path = 'docs/api/design/README.md'
          t = load(path)
          t = rep(t, '- 기준일: 2026-08-25', '- 기준일: 2026-08-26', 'readme date')
          t = rep(t,
          '| 3 | `HomeDS402Ex` | 0% | HOMEEX-06 `SCAFFOLD_OFF` source/static PASS; full-identity ownership/runtime 후속 | [HOME_DS402_EX_DESIGN.md](HOME_DS402_EX_DESIGN.md) |',
          '| 3 | `HomeDS402Ex` | 40% | HOMEEX-07 ownership + profile gate + HOMEEX-09 source/static + approved-plan preparation 통합; runtime/hardware 후속 | [HOME_DS402_EX_DESIGN.md](HOME_DS402_EX_DESIGN.md) |', 'readme homeex row')
          t = rep(t,
          'MODE-13 PC/WPF durable recovery도 PASS했으므로 `HomeDS402Ex`는 이 공유 규칙을 후속 설계\n입력으로 사용할 수 있다. 다만 SetOpMode activation은 latest source의 C78/PLC/hardware proof\n전까지 닫아 둔다. `SetPosition`은 별도 작업 흐름으로 내구 저장소와 RT task 증거를 준비한다.',
          'MODE-13 PC/WPF durable recovery도 PASS했고, `HomeDS402Ex`는 이 공유 규칙을 사용해 HOMEEX-07\nownership, HOMEEX-01/02 fail-closed profile gate, HOMEEX-09 source/static과 HOMEEX-08 approved-plan\npreparation까지 `dev`에 통합했다. 다만 SetOpMode와 HomeDS402Ex 모두 latest source의 C78/PLC/hardware\nproof 전에는 activation을 닫아 둔다. `SetPosition`은 별도 작업 흐름으로 내구 저장소와 RT task\n증거를 준비한다.', 'readme dependency')
          t = rep(t,
          '4. `codex/*` 임시 branch의 unique diff/evidence는 개발 완료 전까지 보존한다.',
          '4. current `codex/*`는 PR #14 C78 history/review와 PR #18 physical bench qualification만 보존하며, 새 개발은 `dev`에서 새 branch로 시작한다.', 'readme wave0 branch')
          t = rep(t,
          '- HomeDS402Ex: HOMEEX-06 dormant parser/state/outcome scaffold는 완료했다. HOMEEX-07에서 full 116-byte owner identity bank와 OwnerKind 7/ResourceKind 3 admission을 paired 구현한다.',
          '- HomeDS402Ex: HOMEEX-06/07과 HOMEEX-01/02 profile gate, HOMEEX-09 source/static, HOMEEX-08 approved-plan preparation까지 통합했다. 다음 gate는 issue #28 hardware profile 승인 + fresh C78/generated artifact이며, 그 전에는 actual SDO/homing runtime을 열지 않는다.', 'readme wave2 homeex')
          t = rep(t,
          '- `codex/*` 작업 branch는 구현·시험용 임시 branch로 보고 current 상태 판정이나 정본 링크에\n  사용하지 않는다.\n- 개발 중인 임시 branch는 unique diff와 시험 흔적을 보존하기 위해 유지한다. 개발 완료 후\n  해당 변경이 `dev`에 반영되었거나 폐기되었고 필요한 증거가 보존된 것을 확인한 뒤 stale\n  branch를 일괄 정리한다.',
          '- `codex/*` 작업 branch는 current 상태 판정이나 정본 링크에 사용하지 않는다.\n- 2026-08-26 cleanup 이후 PR #14/#18 두 branch만 의도적으로 보존한다. #18은 `DO NOT MERGE`\n  physical qualification branch이고 #14는 C78 history/review branch다. 새 기능은 current `dev`에서\n  새 branch를 생성해 진행한다.', 'readme branch rules')
          save(path, t)

          # 3) HomeDS402Ex detailed design.
          path = 'docs/api/design/HOME_DS402_EX_DESIGN.md'
          t = load(path)
          t = rep(t,
          '- 현재 진행 상태: SDK wire/lifecycle + WPF durable no-replay recovery + HOMEEX-06 LASAL gate-OFF parser/state/outcome scaffold qualification 완료, ownership/runtime 미구현',
          '- 현재 진행 상태: SDK/WPF + HOMEEX-06 scaffold + HOMEEX-07 full-identity ownership + HOMEEX-01/02 profile gate + HOMEEX-09 source/static + HOMEEX-08 approved-plan preparation을 `dev`에 통합; actual SDO/homing runtime과 hardware qualification은 미개방', 'homeex header status')
          t = rep(t,
          '- current C#: frozen wire contract, strict Start/Outcome/Retire parser, one-shot lifecycle facade, read-only recovery rehydrate 구현',
          '- current C#: frozen wire/lifecycle + read-only recovery + approved axis profile를 checked frozen DINT execution plan으로 만드는 internal preparation gate 구현', 'homeex header csharp')
          t = rep(t,
          'LASAL에는 `0x7D1B/1C/1D` diagnostics route, dedicated scaffold state와\nstrict fail-closed handlers가 HOMEEX-06으로 들어왔지만 ownership admission과 실제 homing runtime은\n아직 구현하지 않았다.',
          'LASAL에는 `0x7D1B/1C/1D` diagnostics route와 dedicated scaffold state뿐 아니라 OwnerKind 7,\nshared ResourceKind 3, full 116-byte identity admission/validation/rollback까지 HOMEEX-07로 통합됐다.\nHOMEEX-09 source/static identity qualification도 통합됐지만 actual parameter SDO와 homing runtime은\n아직 열지 않았다.', 'homeex intro lasal')
          t = rep(t,
          'current SDK frozen-plan constructor는 `Position == Int32.MinValue`를 Start intent 생성 전에\n거부한다. engineering-unit scale/rounding/range 자체는 HOMEEX-01/02 승인 전까지 public Prepare로\n노출하지 않는다.',
          'current SDK는 approved axis profile + engineering parameters를 checked frozen DINT plan으로\n변환하는 internal preparation gate를 가진다. `Position == Int32.MinValue`, MapRevision mismatch,\nnon-allowlisted method, converted range overflow와 disabled vendor-specific nonzero field를 Start intent\n생성 전에 거부한다. engineering-unit public Prepare는 HOMEEX-01/02 실제 승인 전까지 계속 닫는다.', 'homeex approved plan')
          t = rep(t,
          'HOMEEX-06에서는 ownership source를 일부만 열지 않았다. current non-group owner identity bank는\n64-byte prefix + 최대 8-byte tail만 보존하므로 116-byte HomeDS402Ex Start identity 전체를 담지 못한다.\n따라서 OwnerKind 7 / ResourceKind 3 admission과 owner identity 확장은 HOMEEX-07에서 한 번에 paired\n변경한다. HOMEEX-06 handler는 unexpected admission token/generation을 거부하고 owner reservation을\n만들지 않는다.',
          'HOMEEX-07에서 owner identity bank를 64-byte common prefix + 52-byte per-axis identity tail로\n확장해 116-byte HomeDS402Ex Start identity를 exact하게 보존한다. OwnerKind 7 / active state 13을\nResourceKind 3 DS402 Home engine에 admission하고 Diagnostics exact identity를 검증한다. runtime gate가\nOFF인 current build에서는 admission 이후 mutation을 시작하지 않고 reservation을 deterministic rollback\n한다. HOMEEX-09에서 남아 있던 literal 8-byte per-axis stride 두 곳과 legacy compact-identity ratchet도\n52-byte macro 계약으로 정합시켰다.', 'homeex ownership current')
          t = rep(t,
          'PLC/LASAL capability advertisement와 runtime execution은 physical qualification 전까지 OFF다.\nHOMEEX-06은 route/parser scaffold만 추가했고 feature mask `0x00000017`을 유지한다.',
          'PLC/LASAL capability advertisement와 runtime execution은 physical qualification 전까지 OFF다.\nHOMEEX-06/07/09와 approved-plan preparation이 통합된 current `dev`도 feature mask `0x00000017`과\n`LMC_DIAG_DS402_HOME_EX_ENABLED FALSE`를 유지한다.', 'homeex capability current')
          t = rep(t, '### LASAL HOMEEX-06 구현됨', '### LASAL HOMEEX-06/07/09 software-side 구현됨', 'homeex lasal heading')
          t = rep(t,
          '- `Verify-HomeDs402ExLasalScaffold.ps1`: `SCAFFOLD_OFF` source/static qualification\n- runtime gate `LMC_DIAG_DS402_HOME_EX_ENABLED FALSE`\n- Admin bit 11 OFF / feature mask `0x00000017`',
          '- `Verify-HomeDs402ExLasalScaffold.ps1`: `SCAFFOLD_OFF` source/static qualification\n- `LMCControlCommandService.st`: OwnerKind 7 / active state 13 / ResourceKind 3 admission, 64-byte prefix + 52-byte per-axis identity tail\n- HOMEEX-09: stale literal 8-byte tail stride 제거, persisted-read/Reserved-state legacy SourceOnly ratchet 정합\n- dedicated HOMEEX-09 static verifier: `37/37 PASS`\n- runtime gate `LMC_DIAG_DS402_HOME_EX_ENABLED FALSE`\n- Admin bit 11 OFF / feature mask `0x00000017`', 'homeex lasal bullets')
          t = rep(t,
          '### LASAL 후속 미구현\n\n- `TCPMotionInterface.st`: OwnerKind 7 two-phase owner admission과 full 116-byte identity preservation\n- `LMCEcatInputLatch.st`: Ex RT mailbox 또는 shared Home mailbox versioning\n- `LMCControlCommandService.st`: OwnerKind 7 / ResourceKind 3 shared Home conflict/preemption와 full identity bank\n- `LMCDiagnosticsService.st`: actual outcome record writes, SDO/runtime state machine, cleanup proof\n- `Verify-LasalContract.ps1`: later active atomic gate와 mutation fixtures',
          '### LASAL 후속 미구현\n\n- `LMCEcatInputLatch.st`: actual Ex RT mailbox 또는 shared Home mailbox versioning\n- `LMCDiagnosticsService.st`: parameter snapshot/program/restore, mode 6/controlword bit 4, actual outcome record writes와 cleanup proof\n- RT control owner acquisition/release와 physical homing observation\n- terminal 3-fresh-cycle / ActualPosition == -Position physical proof\n- active capability atomic gate와 hardware/fault mutation fixtures', 'homeex remaining lasal')
          t = rep(t,
          '- [ ] `HOMEEX-07` full 116-byte owner identity bank + OwnerKind 7/ResourceKind 3 shared Home/mode/SDO/axis ownership과 startup reconciliation 구현\n- [ ] `HOMEEX-08` parameter snapshot/program/restore와 CleanupProofFlags 구현\n- [ ] `HOMEEX-09` SourceOnly, method-size, C78와 generated artifact PASS',
          '- [x] `HOMEEX-07` full 116-byte identity preservation + OwnerKind 7/ResourceKind 3 ownership admission, exact Diagnostics validation과 gate-OFF rollback 구현\n- [ ] `HOMEEX-08` approved-profile -> frozen DINT preparation gate는 구현 완료; actual parameter snapshot/program/restore와 CleanupProofFlags runtime은 미구현\n- [ ] `HOMEEX-09` source/static identity qualification `37/37 PASS`; method-size/C78/generated artifact는 미완료', 'homeex checklist 7-9')
          latest_anchor = '## 10. current software qualification evidence\n\n'
          latest = '''## 10. current software qualification evidence\n\n### 10.1 2026-08-26 integrated `dev` checkpoint\n\n- PR #26 HOMEEX-07 merge `2fc9bb208762b8f8c8e8ffad8be3e48e13103a2f`\n- PR #27 HOMEEX-01/02 profile gate merge `003e82c5eadbca5256b1066785d7017e3e2fb9ce`\n- PR #29 HOMEEX-09 merge `2b32920ec563e793f3d59ba21d8df2707d91e654`\n  - final `dev`-based workflow `32921289354`: SUCCESS\n  - dedicated source/static verifier: `37/37 PASS`\n  - legacy SourceOnly은 source/static ratchet을 통과한 뒤 known `Classes.lcb` physical identity boundary에서 STOP\n- PR #30 approved-profile execution-plan gate merge `64bfe52ae5f28120dd61536db24a12f8f62ca28a`\n  - approved-plan workflow `32921714514` rerun: Debug/Release full tests + diff hygiene PASS\n  - SDK wire workflow `32921714525`: Debug/Release full tests + diff hygiene PASS\n  - WPF recovery workflow `32921714585`: Debug/Release full tests + diff hygiene PASS\n\n이 checkpoint는 software/source-safe preparation 통합 증거다. issue #28 hardware profile approval, fresh\nC78/generated artifact, PLC runtime, EtherCAT packet과 physical homing qualification을 대신하지 않는다.\n\n### 10.2 historical tranche evidence\n\n'''
          if '### 10.1 2026-08-26 integrated `dev` checkpoint' not in t:
              t = rep(t, latest_anchor, latest, 'homeex latest evidence')
          save(path, t)

          # 4) SetOperationMode design checkpoint only; technical activation boundary is unchanged.
          path = 'docs/api/design/SET_OPERATION_MODE_DESIGN.md'
          t = load(path)
          t = rep(t,
          '- 문서 checkpoint: 2026-08-25, `dev@95333356f78a` 이후 MODE-13 evidence 반영',
          '- 문서 checkpoint: 2026-08-26, `dev@c14a3d3a4138` integrated baseline; MODE-10 source/static와 MODE-13 PC/WPF 상태는 유지, PR #18 bench qualification branch와 PR #14 C78 history branch만 의도적으로 보존', 'setop checkpoint')
          save(path, t)

          # Final consistency link in the design index.
          path = 'docs/api/design/README.md'
          t = load(path)
          marker = '이 폴더는 아래 4개 API의 current 설계와 실행 순서를 한곳에서 관리한다.'
          replacement = '이 폴더는 아래 4개 API의 current 설계와 실행 순서를 한곳에서 관리한다. 2026-08-26 통합 상태 요약은 [DEVELOPMENT_STATUS_20260826.md](DEVELOPMENT_STATUS_20260826.md)를 따른다.'
          t = rep(t, marker, replacement, 'readme status link')
          save(path, t)
          PY

          git diff --check
          git status --short

      - name: Commit synchronized documents and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/docs-design-sync-once.yml
