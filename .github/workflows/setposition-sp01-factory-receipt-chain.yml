name: SetPosition SP-01 factory receipt chain

on:
  pull_request:
    branches:
      - dev
    paths:
      - 'tools/LmcSetPositionStoreDeploymentReceipt.ps1'
      - 'tools/Start-LmcSetPositionStoreDeployment.ps1'
      - 'tools/Verify-LmcSetPositionStoreDeployment.ps1'
      - 'docs/api/design/SET_POSITION_SP01_FACTORY_DEPLOYMENT.md'
      - 'docs/api/design/SET_POSITION_DESIGN.md'
      - '.github/workflows/setposition-sp01-factory-receipt-chain.yml'
  push:
    branches:
      - codex/setposition-sp01-factory-receipt-chain
    paths:
      - 'tools/LmcSetPositionStoreDeploymentReceipt.ps1'
      - 'tools/Start-LmcSetPositionStoreDeployment.ps1'
      - 'tools/Verify-LmcSetPositionStoreDeployment.ps1'
      - 'docs/api/design/SET_POSITION_SP01_FACTORY_DEPLOYMENT.md'
      - 'docs/api/design/SET_POSITION_DESIGN.md'
      - '.github/workflows/setposition-sp01-factory-receipt-chain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receipt-chain:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-test deployment start and receipt chain
        shell: powershell
        run: |
          & '.\tools\Start-LmcSetPositionStoreDeployment.ps1' -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Self-test readback verification and negative gates
        shell: powershell
        run: |
          & '.\tools\Verify-LmcSetPositionStoreDeployment.ps1' -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify production SetPosition activation remains off
        shell: powershell
        run: |
          $control = Get-Content '.\Lasal_PRG\Elmo_EtherCAT_Test_4Axis\Class\LMCControlCommandService\LMCControlCommandService.st' -Raw
          if ($control -notmatch '(?m)^#define\s+LMC_ADMIN_SET_POSITION_STORE_CONFIGURED\s+FALSE\s*$') {
            throw 'SetPosition Store configured gate is not FALSE.'
          }
          if ($control -match '(?m)^#define\s+LMC_ADMIN_SET_POSITION_STORE_CONFIGURED\s+TRUE\s*$') {
            throw 'SetPosition Store configured gate unexpectedly contains TRUE.'
          }
          if ($control -notmatch '(?m)^#define\s+LMC_AXIS_OWNERSHIP_ORDINARY_ENABLED\s+FALSE\s*$') {
            throw 'Ordinary ownership activation is not FALSE.'
          }
          Write-Host 'PASS SetPosition production Store/ordinary ownership gates remain OFF.'

      - name: Diff hygiene
        shell: powershell
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            git diff --check "origin/$env:GITHUB_BASE_REF...HEAD"
          }
          elseif ($env:GITHUB_EVENT_NAME -eq 'push') {
            git diff --check HEAD^ HEAD
          }
          else {
            git diff --check
          }
