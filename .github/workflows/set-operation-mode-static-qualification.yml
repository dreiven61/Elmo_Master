name: SetOperationMode static qualification

on:
  pull_request:
    branches:
      - dev
    paths:
      - 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCControlCommandService/LMCControlCommandService.st'
      - 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCDiagnosticsService/LMCDiagnosticsService.st'
      - 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/TCPMotionInterface/TCPMotionInterface.st'
      - 'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalContract.ps1'
      - 'tools/Verify-SetOperationModeStatic.ps1'
      - 'tools/Verify-SetOperationModeDefineOrder.ps1'
      - 'docs/api/design/SET_OPERATION_MODE_DESIGN.md'
      - 'docs/api/design/SET_OPERATION_MODE_MODE10_METHOD_SPLIT_DESIGN.md'
      - '.github/workflows/set-operation-mode-static-qualification.yml'
  push:
    branches:
      - dev
    paths:
      - 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCControlCommandService/LMCControlCommandService.st'
      - 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCDiagnosticsService/LMCDiagnosticsService.st'
      - 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/TCPMotionInterface/TCPMotionInterface.st'
      - 'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalContract.ps1'
      - 'tools/Verify-SetOperationModeStatic.ps1'
      - 'tools/Verify-SetOperationModeDefineOrder.ps1'
      - 'docs/api/design/SET_OPERATION_MODE_DESIGN.md'
      - 'docs/api/design/SET_OPERATION_MODE_MODE10_METHOD_SPLIT_DESIGN.md'
      - '.github/workflows/set-operation-mode-static-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-static:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize qualification PR to production-dormant source for MODE-10 checks
        shell: powershell
        run: |
          if ($env:GITHUB_EVENT_NAME -ne 'pull_request' -or
              $env:GITHUB_HEAD_REF -ne 'codex/setopmode-mode11-bench-activation') {
            Write-Host 'Production/dev path: no bench normalization required.'
            exit 0
          }
          $diag = '.\Lasal_PRG\Elmo_EtherCAT_Test_4Axis\Class\LMCDiagnosticsService\LMCDiagnosticsService.st'
          $control = '.\Lasal_PRG\Elmo_EtherCAT_Test_4Axis\Class\LMCControlCommandService\LMCControlCommandService.st'
          $diagText = [IO.File]::ReadAllText($diag)
          $controlText = [IO.File]::ReadAllText($control)
          $diagOn = '#define LMC_DIAG_SET_OPERATION_MODE_ENABLED TRUE'
          $diagOff = '#define LMC_DIAG_SET_OPERATION_MODE_ENABLED FALSE'
          $adminOn = '(pResponseFrame + 24)^$UDINT := 0x00000717;'
          $adminOff = '(pResponseFrame + 24)^$UDINT := 0x00000017;'
          if (-not $diagText.Contains($diagOn) -or -not $controlText.Contains($adminOn)) {
            Write-Error 'Qualification PR is not the exact paired BENCH_ACTIVE source.'
            exit 1
          }
          [IO.File]::WriteAllText($diag, $diagText.Replace($diagOn, $diagOff), (New-Object Text.ASCIIEncoding))
          [IO.File]::WriteAllText($control, $controlText.Replace($adminOn, $adminOff), (New-Object Text.ASCIIEncoding))
          Write-Host 'Qualification-only normalization: BENCH_ACTIVE -> production-dormant pair for MODE-10 verification.'

      - name: Run SetOperationMode invariants
        shell: powershell
        run: |
          & '.\tools\Verify-SetOperationModeStatic.ps1' -ExpectedSdoWriteAxis 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify SetOperationMode define order
        shell: powershell
        run: |
          & '.\tools\Verify-SetOperationModeDefineOrder.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run repository SourceOnly contract to exact known artifact boundary
        shell: powershell
        run: |
          $repoRoot = (Get-Location).Path
          $knownArtifactBoundary = 'LASAL.UdpCallbackContract blocker: SetPosition-augmented Classes.lcb physical identity drifted.'
          $captured = New-Object System.Collections.Generic.List[string]
          $code = 0
          try {
            $ErrorActionPreference = 'Continue'
            & '.\LMC_Library\LMC_API_Delivery\tests\LasalMotionControlLib.Tests\Verify-LasalContract.ps1' `
              -RepositoryRoot $repoRoot `
              -SourceOnly `
              -ExpectedSdoWriteAxis 1 2>&1 |
              ForEach-Object {
                $text = $_ | Out-String
                [void]$captured.Add($text)
                Write-Host $_
              }
            $code = $LASTEXITCODE
          }
          catch {
            $text = $_ | Out-String
            [void]$captured.Add($text)
            Write-Host $text
            $code = 1
          }
          if ($code -eq 0) {
            Write-Host 'PASS full repository SourceOnly contract completed.'
            exit 0
          }
          $joined = [string]::Join("`n", $captured)
          if ($joined.Contains($knownArtifactBoundary)) {
            Write-Host 'PASS SetOperationMode source/static qualification reached the exact known C78/generated-artifact boundary.'
            Write-Host 'NOTE this does not qualify or approve the tracked Classes.lcb artifact.'
            exit 0
          }
          exit $code

      - name: Restore tracked bench source and verify diff hygiene
        shell: powershell
        run: |
          $diag = 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCDiagnosticsService/LMCDiagnosticsService.st'
          $control = 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCControlCommandService/LMCControlCommandService.st'
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request' -and
              $env:GITHUB_HEAD_REF -eq 'codex/setopmode-mode11-bench-activation') {
            git checkout HEAD -- $diag $control
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'Static qualification left the checkout dirty.'
            exit $LASTEXITCODE
          }
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            git diff --check "origin/$env:GITHUB_BASE_REF...HEAD"
          }
          elseif ($env:GITHUB_EVENT_NAME -eq 'push') {
            git diff --check HEAD^ HEAD
          }
          else {
            git diff --check
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
