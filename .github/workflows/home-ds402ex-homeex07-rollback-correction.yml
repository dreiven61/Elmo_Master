name: HomeDS402Ex HOMEEX-07 owner release correction

on:
  push:
    branches:
      - codex/home-ds402ex-homeex07-ownership
    paths:
      - '.github/workflows/home-ds402ex-homeex07-rollback-correction.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correct-source:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout qualification branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/home-ds402ex-homeex07-ownership

      - name: Centralize HomeDS402Ex owner release in TCP
        shell: pwsh
        run: |
          $diagPath = 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCDiagnosticsService/LMCDiagnosticsService.st'
          $tcpPath = 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/TCPMotionInterface/TCPMotionInterface.st'
          $verifyPath = 'tools/Verify-HomeDs402ExHomeex07Ownership.ps1'

          $diag = [System.IO.File]::ReadAllText($diagPath).Replace("`r`n", "`n").Replace("`r", "`n")
          $startRegex = [regex]::new('FUNCTION LMCDiagnosticsService::HandleAxisDs402HomeExStart(?s).*?END_FUNCTION')
          $startMatches = $startRegex.Matches($diag)
          if ($startMatches.Count -ne 1) { throw "Expected one HomeDS402Ex Start function, found $($startMatches.Count)" }
          $startOriginal = $startMatches[0].Value
          $start = $startOriginal

          $localsOld = "`t`townerResult, rollbackResult : DINT;"
          if ([regex]::Matches($start, [regex]::Escape($localsOld)).Count -ne 1) { throw 'Expected one HomeEx rollback local declaration' }
          $start = $start.Replace($localsOld, "`t`townerResult : DINT;")

          $rollbackPattern = '(?ms)^\trollbackResult := 0;\n\tif \(detailCode <> 0\).*?^\tend_if;\n\n'
          $rollbackRegex = [regex]::new($rollbackPattern)
          $rollbackMatches = $rollbackRegex.Matches($start)
          if ($rollbackMatches.Count -ne 1) { throw "Expected one Diagnostics rollback block, found $($rollbackMatches.Count)" }
          $start = $rollbackRegex.Replace($start, '', 1)
          if ($start.Contains('RollbackAxisOwnership')) { throw 'Diagnostics HomeEx Start still owns rollback after correction' }
          if (-not $start.Contains('(pResponse + 20)^$UDINT := 0;')) { throw 'HomeEx Start native state zero contract was lost' }
          $diag = $diag.Replace($startOriginal, $start)

          $tcp = [System.IO.File]::ReadAllText($tcpPath).Replace("`r`n", "`n").Replace("`r", "`n")
          $fallbackOld = "`t`tif (diagnosticsExactAccepted = FALSE) &`n`t`t   (diagnosticsExactFailure = FALSE) then"
          $fallbackNew = "`t`tif (CommandID = 0x7D1B) |`n`t`t   ((diagnosticsExactAccepted = FALSE) &`n`t`t    (diagnosticsExactFailure = FALSE)) then"
          if ([regex]::Matches($tcp, [regex]::Escape($fallbackOld)).Count -ne 1) { throw 'Expected one diagnostics fallback rollback condition' }
          $tcp = $tcp.Replace($fallbackOld, $fallbackNew)
          if ($tcp -notmatch 'elsif CommandID\s*=\s*0x7D1B then[\s\S]{0,700}?diagnosticsExactFailure[\s\S]{0,420}?Sendbuf\[28\]\$UDINT\s*=\s*0') { throw 'HomeEx exact failure no longer requires zero native state' }
          if ($tcp -notmatch 'if \(CommandID\s*=\s*0x7D1B\)\s*\|[\s\S]{0,180}?diagnosticsExactFailure\s*=\s*FALSE[\s\S]{0,180}?RollbackAxisOwnership') { throw 'HomeEx gate-off response is not followed by TCP owner rollback' }

          $verify = [System.IO.File]::ReadAllText($verifyPath).Replace("`r`n", "`n").Replace("`r", "`n")
          $verifyOld = "Require-Regex `$startBody 'AxisOwnership\.RollbackAxisOwnership' 'deterministic gate-OFF Start rejection releases the exact reservation'"
          $verifyNew = @(
            "Require-AbsentRegex `$startBody 'RollbackAxisOwnership' 'Diagnostics HomeDS402Ex Start does not own reservation release'",
            "Require-Regex `$tcp 'if \(CommandID\s*=\s*0x7D1B\)\s*\|[\s\S]{0,180}?diagnosticsExactFailure\s*=\s*FALSE[\s\S]{0,180}?RollbackAxisOwnership' 'TCP releases every reserved HomeDS402Ex gate-OFF Start before response completion'"
          ) -join "`n"
          if ([regex]::Matches($verify, [regex]::Escape($verifyOld)).Count -ne 1) { throw 'Expected one legacy Diagnostics rollback verifier assertion' }
          $verify = $verify.Replace($verifyOld, $verifyNew)

          foreach ($pair in @(@($diagPath, $diag), @($tcpPath, $tcp))) {
            foreach ($ch in $pair[1].ToCharArray()) {
              if ([int]$ch -gt 0x7F) { throw "Corrected LASAL source is not 7-bit ASCII: $($pair[0])" }
            }
            [System.IO.File]::WriteAllText($pair[0], $pair[1], [System.Text.Encoding]::ASCII)
          }
          [System.IO.File]::WriteAllText($verifyPath, $verify, [System.Text.UTF8Encoding]::new($false))

          git diff --check -- $diagPath $tcpPath $verifyPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify HOMEEX-07 ownership contract
        shell: pwsh
        run: |
          & .\tools\Verify-HomeDs402ExHomeex07Ownership.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify SetOperationMode define order
        shell: powershell
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\tools\Verify-SetOperationModeDefineOrder.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit owner-release correction and remove temporary workflow
        shell: pwsh
        run: |
          $paths = @(
            'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCDiagnosticsService/LMCDiagnosticsService.st',
            'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/TCPMotionInterface/TCPMotionInterface.st',
            'tools/Verify-HomeDs402ExHomeex07Ownership.ps1')
          git rm -- '.github/workflows/home-ds402ex-homeex07-rollback-correction.yml'
          git add -- $paths
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $staged = @(git diff --cached --name-only)
          foreach ($path in $paths) {
            if (-not ($staged -contains $path)) { throw "Missing staged correction: $path" }
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(homeex): centralize gate-off owner release'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:codex/home-ds402ex-homeex07-ownership
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
