name: One-shot final design wording polish

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/docs-design-final-polish-once.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Polish remaining current-state wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              t = p.read_text(encoding='utf-8')
              if old not in t:
                  raise SystemExit(f'missing anchor in {path}: {old}')
              p.write_text(t.replace(old, new, 1), encoding='utf-8', newline='\n')

          replace(
              'docs/api/design/README.md',
              '| HomeDS402Ex | `0x7D1B` | `0x7D1C` | `0x7D1D` | LASAL diagnostics route/scaffold 존재, runtime gate/capability OFF |',
              '| HomeDS402Ex | `0x7D1B` | `0x7D1C` | `0x7D1D` | route + full-identity ownership + profile/approved-plan preparation 존재, actual homing runtime gate/capability OFF |')

          replace(
              'docs/api/design/HOME_DS402_EX_DESIGN.md',
              '- `LmcAdminDs402HomeEx.cs`\n- `LmcAxisDs402HomeEx.cs`',
              '- `LmcAdminDs402HomeEx.cs`\n- `LmcAdminDs402HomeExApprovedProfile.cs`: approved profile -> checked frozen DINT plan internal preparation gate\n- `LmcAxisDs402HomeEx.cs`')
          PY
          git diff --check
      - name: Commit and self-remove
        shell: bash
        run: |
          rm -f .github/workflows/docs-design-final-polish-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/api/design/README.md docs/api/design/HOME_DS402_EX_DESIGN.md .github/workflows/docs-design-final-polish-once.yml
          git diff --cached --check
          git commit -m "docs: polish integrated design status wording"
          git push origin HEAD:dev
