name: Promote SetOperationMode MODE-11E recovery

on:
  push:
    branches:
      - codex/setopmode-mode11e-recovery
    paths:
      - 'tools/Promote-SetOperationModeMode11ERecovery.py'
      - '.github/workflows/promote-setoperationmode-mode11e-recovery.yml'

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout qualification source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact MODE-11E source and verifier patch
        shell: powershell
        run: |
          python '.\tools\Promote-SetOperationModeMode11ERecovery.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify SetOperationMode source contract
        shell: powershell
        run: |
          & '.\tools\Verify-SetOperationModeStatic.ps1' -ExpectedSdoWriteAxis 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & '.\tools\Verify-SetOperationModeDefineOrder.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify exact promotion diff
        shell: powershell
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expected = @(
            'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCDiagnosticsService/LMCDiagnosticsService.st',
            'tools/Verify-SetOperationModeStatic.ps1'
          ) | Sort-Object
          $actual = @(git diff --name-only) | Sort-Object
          $delta = @(Compare-Object -ReferenceObject $expected -DifferenceObject $actual)
          if ($delta.Count -ne 0) {
            Write-Host 'Unexpected MODE-11E promotion diff:'
            $delta | Format-Table | Out-String | Write-Host
            exit 1
          }
          $source = Get-Content -Raw 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCDiagnosticsService/LMCDiagnosticsService.st'
          if ($source -notmatch '(?m)^#define\s+LMC_DIAG_SET_OPERATION_MODE_ENABLED\s+FALSE\s*$') {
            throw 'Production SetOperationMode activation gate must remain FALSE.'
          }

      - name: Commit promoted implementation
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCDiagnosticsService/LMCDiagnosticsService.st' 'tools/Verify-SetOperationModeStatic.ps1'
          git commit -m 'fix(mode): generalize warm-start recovery across supported modes'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:codex/setopmode-mode11e-recovery
