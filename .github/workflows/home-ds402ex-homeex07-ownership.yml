name: HomeDS402Ex HOMEEX-07 ownership qualification

on:
  push:
    branches:
      - codex/home-ds402ex-homeex07-ownership
    paths:
      - 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCControlCommandService/LMCControlCommandService.st'
      - 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/TCPMotionInterface/TCPMotionInterface.st'
      - 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCDiagnosticsService/LMCDiagnosticsService.st'
      - 'tools/Audit-HomeDs402ExHomeex07Ownership.ps1'
      - 'tools/Verify-HomeDs402ExHomeex07Ownership.ps1'
      - '.github/workflows/home-ds402ex-homeex07-ownership.yml'
  pull_request:
    branches:
      - dev
    paths:
      - 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCControlCommandService/LMCControlCommandService.st'
      - 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/TCPMotionInterface/TCPMotionInterface.st'
      - 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCDiagnosticsService/LMCDiagnosticsService.st'
      - 'tools/Verify-HomeDs402ExHomeex07Ownership.ps1'
      - '.github/workflows/home-ds402ex-homeex07-ownership.yml'
  workflow_dispatch:

jobs:
  ownership-static:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect ownership stage
        id: stage
        shell: pwsh
        run: |
          $control = Get-Content -LiteralPath '.\Lasal_PRG\Elmo_EtherCAT_Test_4Axis\Class\LMCControlCommandService\LMCControlCommandService.st' -Raw
          $candidate = $control.Contains('#define LMC_OWNER_KIND_DS402_HOME_EX 7')
          "candidate=$($candidate.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "HOMEEX07Candidate=$candidate"

      - name: Audit HOMEEX-07 baseline
        if: steps.stage.outputs.candidate != 'true'
        shell: pwsh
        run: |
          & .\tools\Audit-HomeDs402ExHomeex07Ownership.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify HOMEEX-07 ownership candidate
        if: steps.stage.outputs.candidate == 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path .\tools\Verify-HomeDs402ExHomeex07Ownership.ps1)) {
            throw 'HOMEEX-07 candidate source requires the candidate verifier.'
          }
          & .\tools\Verify-HomeDs402ExHomeex07Ownership.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify HOMEEX-06 scaffold baseline regression
        if: steps.stage.outputs.candidate != 'true'
        shell: powershell
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\tools\Verify-HomeDs402ExLasalScaffold.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify SetOperationMode define order
        shell: powershell
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\tools\Verify-SetOperationModeDefineOrder.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Diff hygiene
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            git diff --check "origin/$env:GITHUB_BASE_REF...HEAD"
          }
          elseif ($env:GITHUB_EVENT_NAME -eq 'push') {
            git diff --check HEAD^ HEAD
          }
          else {
            git diff --check
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
