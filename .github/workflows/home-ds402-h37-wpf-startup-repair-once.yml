name: HomeDS402 H37 WPF startup recovery repair once

on:
  push:
    branches:
      - codex/home-ds402-h37-source-qualification
    paths:
      - '.github/workflows/home-ds402-h37-wpf-startup-repair-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore DS402 Home recovery key at WPF startup
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'LMC_Library\LasalApiWpfTestApp\LasalApiWpfTestApp\MainWindow.MaintenanceActions.cs'
          $text = [System.IO.File]::ReadAllText($path)
          $newline = if ($text.Contains("`r`n")) { "`r`n" } else { "`n" }
          $lines = [System.Collections.Generic.List[string]]::new()
          foreach ($line in ($text -split "`r?`n")) { [void]$lines.Add($line) }

          $candidates = New-Object System.Collections.Generic.List[int]
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i].Trim() -ne 'if (active.Action == MaintenanceActionKind.LmcHome)') { continue }
            for ($j = $i + 1; $j -lt [Math]::Min($i + 12, $lines.Count); $j++) {
              if ($lines[$j].Trim() -eq 'else if (IsEncoderMaintenanceAction(active.Action))') {
                $candidates.Add($j)
                break
              }
            }
          }
          if ($candidates.Count -ne 1) {
            throw "Expected exactly one H37 WPF startup recovery insertion point, found $($candidates.Count)."
          }

          $insertAt = $candidates[0]
          $indent = ([regex]::Match($lines[$insertAt], '^\s*')).Value
          $insert = @(
            ($indent + 'else if (active.Action == MaintenanceActionKind.Ds402Home)'),
            ($indent + '{'),
            ($indent + '    latestDs402HomeRecoveryKey ='),
            ($indent + '        RecreateDs402RecoveryKey(active);'),
            ($indent + '}')
          )
          for ($k = $insert.Count - 1; $k -ge 0; $k--) {
            $lines.Insert($insertAt, $insert[$k])
          }

          $updated = [string]::Join($newline, $lines)
          [System.IO.File]::WriteAllText($path, $updated, (New-Object System.Text.UTF8Encoding($false)))

          $updatedText = [System.IO.File]::ReadAllText($path)
          $startupPattern = '(?ms)if\s*\(active\.Action\s*==\s*MaintenanceActionKind\.LmcHome\).*?else if\s*\(active\.Action\s*==\s*MaintenanceActionKind\.Ds402Home\)\s*\{\s*latestDs402HomeRecoveryKey\s*=\s*RecreateDs402RecoveryKey\(active\);\s*\}\s*else if\s*\(IsEncoderMaintenanceAction\(active\.Action\)\)'
          if (([regex]::Matches($updatedText, $startupPattern)).Count -ne 1) {
            throw 'DS402 Home startup recovery reconstruction is not in the exact expected branch sequence.'
          }

      - name: Remove one-shot workflow from resulting tree
        shell: powershell
        run: |
          Remove-Item -LiteralPath '.github\workflows\home-ds402-h37-wpf-startup-repair-once.yml' -Force

      - name: Diff hygiene
        shell: powershell
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff -- 'LMC_Library/LasalApiWpfTestApp/LasalApiWpfTestApp/MainWindow.MaintenanceActions.cs' '.github/workflows/home-ds402-h37-wpf-startup-repair-once.yml'

      - name: Commit WPF recovery source repair
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'LMC_Library/LasalApiWpfTestApp/LasalApiWpfTestApp/MainWindow.MaintenanceActions.cs' '.github/workflows/home-ds402-h37-wpf-startup-repair-once.yml'
          if (git diff --cached --quiet) {
            throw 'Expected H37 WPF recovery source diff is empty.'
          }
          git commit -m 'fix(h37): restore DS402 Home recovery key at startup'
          git push origin HEAD:codex/home-ds402-h37-source-qualification
