name: MODE-10 SourceOnly ratchet patch

on:
  pull_request:
    branches:
      - dev
    paths:
      - 'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalContract.ps1'
      - 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCControlCommandService/LMCControlCommandService.st'
      - '.github/workflows/mode10-ratchet-probe.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: codex/mode-10-sourceonly-cleanup
          fetch-depth: 0

      - name: Patch known MODE-08 ratchets and diagnostic messages
        shell: python
        run: |
          from pathlib import Path

          src = Path('LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalContract.ps1')
          text = src.read_text(encoding='utf-8')
          replacements = (
              ("$replacementBankHistogram['ownershipstate'] -ne 41", "$replacementBankHistogram['ownershipstate'] -ne 44"),
              ('expected 41/12.', 'expected 44/12.'),
              ('$replacementSemanticTokens.Length -ne 6434', '$replacementSemanticTokens.Length -ne 6714'),
              ("'9EAAB21F2262DB9C206B0581CC21AD3451727F0257CB85D3416D4CDDA2B03612'", "'3386CCD85F63DEE01ABD5C06B82E2F4591179998E07D05B62DF4D816CCFF6D2B'"),
              ('$($replacementSemanticTokens.Length)/6434, ', '$($replacementSemanticTokens.Length)/6714, '),
              ("@{ Name = 'helper'; Fragment = $helper; LF = 21760; CRLF = 22363; Sha = 'FC1CA1BBD8E56B13FFE55FA7158C8C8EA28038522AC9793A803B2B77EBD58A23' }",
               "@{ Name = 'helper'; Fragment = $helper; LF = 22214; CRLF = 22826; Sha = '9E0A37E0EC0A3AD7FDD194CF8691BF3B492D4E4C6FD10E8C118323571F980BDD' }"),
              ('$macroInventory.Count -ne 68', '$macroInventory.Count -ne 70'),
              ('$joinedMacros.Length -ne 2387', '$joinedMacros.Length -ne 2470'),
              ("'064544E3EC5498E4ECAFC0C4C1E77FEBF1C0E59BDA7440C9A73867A343D6C2AF'", "'367C87E07AF2C33D60F32F3E94AECF73BA052C6F3155DA909DB9EAD1BB9EAB85'"),
              ('$($macroInventory.Count)/68, ', '$($macroInventory.Count)/70, '),
              ('$($joinedMacros.Length)/2387, ', '$($joinedMacros.Length)/2470, '),
              ('throw "$blocker $($fragmentContract.Name) lexical token inventory drifted."',
               'throw "$blocker $($fragmentContract.Name) lexical token inventory drifted ($($metrics.LexicalCount)/$($metrics.LexicalLength)/$($metrics.LexicalSha256))."'),
              ('throw "$blocker $($fragmentContract.Name) local inventory drifted or is empty."',
               'throw "$blocker $($fragmentContract.Name) local inventory drifted or is empty ($($metrics.LocalCount)/$($metrics.LocalLength)/$($metrics.LocalSha256))."'),
              ('throw "$blocker $($fragmentContract.Name) call inventory drifted."',
               'throw "$blocker $($fragmentContract.Name) call inventory drifted ($($metrics.CallInventory))."'),
              ('throw "$blocker $($fragmentContract.Name) persistent mutation inventory drifted."',
               'throw "$blocker $($fragmentContract.Name) persistent mutation inventory drifted ($($metrics.MutationCount)/$($metrics.MutationLength)/$($metrics.MutationSha256))."'),
              ('throw "$blocker $($fragmentContract.Name) Result/RETURN inventory drifted."',
               'throw "$blocker $($fragmentContract.Name) Result/RETURN inventory drifted ($($metrics.ControlFlowCount)/$($metrics.ControlFlowLength)/$($metrics.ControlFlowSha256))."'),
          )
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'probe token count={count}, expected=1: {old}')
              text = text.replace(old, new, 1)
          src.write_text(text, encoding='utf-8', newline='')

      - name: Run repository SourceOnly contract
        shell: powershell
        run: |
          git diff --check
          & '.\LMC_Library\LMC_API_Delivery\tests\LasalMotionControlLib.Tests\Verify-LasalContract.ps1' `
            -RepositoryRoot (Get-Location).Path `
            -SourceOnly `
            -ExpectedSdoWriteAxis 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
