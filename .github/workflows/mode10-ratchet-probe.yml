name: MODE-10 SourceOnly ratchet patch

on:
  pull_request:
    branches:
      - dev
    paths:
      - 'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalContract.ps1'
      - 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCControlCommandService/LMCControlCommandService.st'
      - '.github/workflows/mode10-ratchet-probe.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout finalize branch
        uses: actions/checkout@v4
        with:
          ref: codex/mode-10-sourceonly-finalize
          fetch-depth: 0

      - name: Patch proven ownership ratchets and expose reserve lexical gate
        shell: python
        run: |
          from pathlib import Path

          src = Path('LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalContract.ps1')
          text = src.read_text(encoding='utf-8')
          replacements = (
              ("$replacementBankHistogram['ownershipstate'] -ne 41", "$replacementBankHistogram['ownershipstate'] -ne 44"),
              ('expected 41/12.', 'expected 44/12.'),
              ('$replacementSemanticTokens.Length -ne 6434', '$replacementSemanticTokens.Length -ne 6714'),
              ("'9EAAB21F2262DB9C206B0581CC21AD3451727F0257CB85D3416D4CDDA2B03612'", "'3386CCD85F63DEE01ABD5C06B82E2F4591179998E07D05B62DF4D816CCFF6D2B'"),
              ('$($replacementSemanticTokens.Length)/6434, ', '$($replacementSemanticTokens.Length)/6714, '),
              ("@{ Name = 'helper'; Fragment = $helper; LF = 21760; CRLF = 22363; Sha = 'FC1CA1BBD8E56B13FFE55FA7158C8C8EA28038522AC9793A803B2B77EBD58A23' }",
               "@{ Name = 'helper'; Fragment = $helper; LF = 22214; CRLF = 22826; Sha = '9E0A37E0EC0A3AD7FDD194CF8691BF3B492D4E4C6FD10E8C118323571F980BDD' }"),
              ('$macroInventory.Count -ne 68', '$macroInventory.Count -ne 70'),
              ('$joinedMacros.Length -ne 2387', '$joinedMacros.Length -ne 2470'),
              ("'064544E3EC5498E4ECAFC0C4C1E77FEBF1C0E59BDA7440C9A73867A343D6C2AF'", "'367C87E07AF2C33D60F32F3E94AECF73BA052C6F3155DA909DB9EAD1BB9EAB85'"),
              ('$($macroInventory.Count)/68, ', '$($macroInventory.Count)/70, '),
              ('$($joinedMacros.Length)/2387, ', '$($joinedMacros.Length)/2470, '),
              ('Lexical = @(4170, 25319,', 'Lexical = @(4181, 25399,'),
              ("'3C1049ED8E8B05BA66B4E356865B6580DAE5FA69FE413A11E60322F62FC17000'", "'19E0C93B5538A8E9C361401CFAE85E23CDFFE0831422EF8174B735C57471FD50'"),
              ('Lexical = @(3372, 22104,', 'Lexical = @(3451, 22781,'),
              ("'C1035138B3C7020306E8243C8F613D817680A06F83A8A578AA85CF487543FA10'", "'C047EEB0042EEC4CEB2D3840E5226C1FAD420560EC90A058DAFE361546CC51F2'"),
              ('$localInventory.Count -ne 81', '$localInventory.Count -ne 82'),
              ('$joinedLocals.Length -ne 1817', '$joinedLocals.Length -ne 1847'),
              ("'55ACBC2438AE68FAE362C479F4B9EB2ADD3F416180DBE863AD78729BE9F4DFF1'", "'91324B1D9039B8329C237A3107FE5402DC53D65E5685557A942CF71C91F22971'"),
              ('$($localInventory.Count)/81, ', '$($localInventory.Count)/82, '),
              ('$($joinedLocals.Length)/1817, ', '$($joinedLocals.Length)/1847, '),
              ('$semanticTokens.Length -ne 61265', '$semanticTokens.Length -ne 61704'),
              ("'960527D122DCB82BE9645415A3DA444E07C1FDFB0AAF28BE77723864450F084C'", "'44924A26D9B95E107DED81E8D65D18C8862176C833A2D08D596A8FD2F9A52BEF'"),
              ('$($semanticTokens.Length)/61265, ', '$($semanticTokens.Length)/61704, '),
          )
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'ratchet token count={count}, expected=1: {old}')
              text = text.replace(old, new, 1)

          lines = text.splitlines()
          hits = [i for i, line in enumerate(lines) if '11917' in line]
          if not hits:
              raise SystemExit('no 11917 lexical gate occurrence found')
          print(f'RESERVE_LEXICAL_GATE_HITS={len(hits)}')
          printed = set()
          for hit in hits:
              start = max(0, hit - 14)
              end = min(len(lines), hit + 18)
              print(f'--- RESERVE_LEXICAL_GATE_CONTEXT_{hit + 1}_BEGIN ---')
              for i in range(start, end):
                  if i not in printed:
                      print(f'{i + 1}: {lines[i]}')
                      printed.add(i)
              print(f'--- RESERVE_LEXICAL_GATE_CONTEXT_{hit + 1}_END ---')

          src.write_text(text, encoding='utf-8', newline='')

      - name: Run repository SourceOnly contract
        shell: powershell
        run: |
          git diff --check
          & '.\LMC_Library\LMC_API_Delivery\tests\LasalMotionControlLib.Tests\Verify-LasalContract.ps1' `
            -RepositoryRoot (Get-Location).Path `
            -SourceOnly `
            -ExpectedSdoWriteAxis 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
