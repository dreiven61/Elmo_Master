name: MODE-10 SourceOnly ratchet patch

on:
  pull_request:
    branches:
      - dev
    paths:
      - 'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalContract.ps1'
      - 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCControlCommandService/LMCControlCommandService.st'
      - '.github/workflows/mode10-ratchet-probe.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: codex/mode-10-sourceonly-cleanup
          fetch-depth: 0

      - name: Patch exact MODE-08 persistent-read ratchet
        shell: python
        run: |
          from pathlib import Path

          src = Path('LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalContract.ps1')
          text = src.read_text(encoding='utf-8')
          old_condition = "$replacementBankHistogram['ownershipstate'] -ne 41"
          new_condition = "$replacementBankHistogram['ownershipstate'] -ne 44"
          old_message = 'expected 41/12.'
          new_message = 'expected 44/12.'
          if text.count(old_condition) != 1:
              raise SystemExit(f'condition count={text.count(old_condition)}, expected=1')
          if text.count(old_message) != 1:
              raise SystemExit(f'message count={text.count(old_message)}, expected=1')
          text = text.replace(old_condition, new_condition, 1)
          text = text.replace(old_message, new_message, 1)
          src.write_text(text, encoding='utf-8', newline='')

      - name: Diff hygiene
        shell: powershell
        run: |
          git diff --check
          git diff -- 'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalContract.ps1'

      - name: Run repository SourceOnly contract
        shell: powershell
        run: |
          & '.\LMC_Library\LMC_API_Delivery\tests\LasalMotionControlLib.Tests\Verify-LasalContract.ps1' `
            -RepositoryRoot (Get-Location).Path `
            -SourceOnly `
            -ExpectedSdoWriteAxis 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run SetOperationMode invariants
        shell: powershell
        run: |
          & '.\tools\Verify-SetOperationModeStatic.ps1' -ExpectedSdoWriteAxis 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit verified ratchet
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalContract.ps1'
          git diff --cached --check
          git commit -m 'test(lasal): ratchet MODE-08 preemption read inventory'
          git push origin HEAD:codex/mode-10-sourceonly-cleanup
