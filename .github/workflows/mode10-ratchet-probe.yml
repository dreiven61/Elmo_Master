name: MODE-10 SourceOnly permanent finalize

on:
  pull_request:
    branches:
      - dev
    paths:
      - 'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalContract.ps1'
      - 'tools/Verify-SetOperationModeStatic.ps1'
      - '.github/workflows/mode10-ratchet-probe.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout permanent finalize branch
        uses: actions/checkout@v4
        with:
          ref: codex/mode-10-sourceonly-finalize-permanent
          fetch-depth: 0

      - name: Patch proven ownership ratchets and SetOperationMode self-test model
        shell: python
        run: |
          from pathlib import Path

          src = Path('LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalContract.ps1')
          text = src.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} token count={count}, expected=1')
              text = text.replace(old, new, 1)

          replacements = (
              ("$replacementBankHistogram['ownershipstate'] -ne 41", "$replacementBankHistogram['ownershipstate'] -ne 44"),
              ('expected 41/12.', 'expected 44/12.'),
              ('$replacementSemanticTokens.Length -ne 6434', '$replacementSemanticTokens.Length -ne 6714'),
              ("'9EAAB21F2262DB9C206B0581CC21AD3451727F0257CB85D3416D4CDDA2B03612'", "'3386CCD85F63DEE01ABD5C06B82E2F4591179998E07D05B62DF4D816CCFF6D2B'"),
              ('$($replacementSemanticTokens.Length)/6434, ', '$($replacementSemanticTokens.Length)/6714, '),
              ("@{ Name = 'helper'; Fragment = $helper; LF = 21760; CRLF = 22363; Sha = 'FC1CA1BBD8E56B13FFE55FA7158C8C8EA28038522AC9793A803B2B77EBD58A23' }",
               "@{ Name = 'helper'; Fragment = $helper; LF = 22214; CRLF = 22826; Sha = '9E0A37E0EC0A3AD7FDD194CF8691BF3B492D4E4C6FD10E8C118323571F980BDD' }"),
              ('$macroInventory.Count -ne 68', '$macroInventory.Count -ne 70'),
              ('$joinedMacros.Length -ne 2387', '$joinedMacros.Length -ne 2470'),
              ("'064544E3EC5498E4ECAFC0C4C1E77FEBF1C0E59BDA7440C9A73867A343D6C2AF'", "'367C87E07AF2C33D60F32F3E94AECF73BA052C6F3155DA909DB9EAD1BB9EAB85'"),
              ('$($macroInventory.Count)/68, ', '$($macroInventory.Count)/70, '),
              ('$($joinedMacros.Length)/2387, ', '$($joinedMacros.Length)/2470, '),
              ('Lexical = @(4170, 25319,', 'Lexical = @(4181, 25399,'),
              ("'3C1049ED8E8B05BA66B4E356865B6580DAE5FA69FE413A11E60322F62FC17000'", "'19E0C93B5538A8E9C361401CFAE85E23CDFFE0831422EF8174B735C57471FD50'"),
              ('Lexical = @(3372, 22104,', 'Lexical = @(3451, 22781,'),
              ("'C1035138B3C7020306E8243C8F613D817680A06F83A8A578AA85CF487543FA10'", "'C047EEB0042EEC4CEB2D3840E5226C1FAD420560EC90A058DAFE361546CC51F2'"),
              ('$localInventory.Count -ne 81', '$localInventory.Count -ne 82'),
              ('$joinedLocals.Length -ne 1817', '$joinedLocals.Length -ne 1847'),
              ("'55ACBC2438AE68FAE362C479F4B9EB2ADD3F416180DBE863AD78729BE9F4DFF1'", "'91324B1D9039B8329C237A3107FE5402DC53D65E5685557A942CF71C91F22971'"),
              ('$($localInventory.Count)/81, ', '$($localInventory.Count)/82, '),
              ('$($joinedLocals.Length)/1817, ', '$($joinedLocals.Length)/1847, '),
              ('$semanticTokens.Length -ne 61265', '$semanticTokens.Length -ne 61704'),
              ("'960527D122DCB82BE9645415A3DA444E07C1FDFB0AAF28BE77723864450F084C'", "'44924A26D9B95E107DED81E8D65D18C8862176C833A2D08D596A8FD2F9A52BEF'"),
              ('$($semanticTokens.Length)/61265, ', '$($semanticTokens.Length)/61704, '),
              ('$lexicalTokens.Count -ne 11917', '$lexicalTokens.Count -ne 11986'),
              ('$lexicalInventory.Length -ne 73181', '$lexicalInventory.Length -ne 73689'),
              ("'506B018E60715707471DD69571B6B4BCD35C6C887C6D43A7F829E0EED86B7587'", "'962B62140CB69C12743CBA8F27DF14609819A246C2E917D5804BA4077123B899'"),
              ('$($lexicalTokens.Count)/11917, ', '$($lexicalTokens.Count)/11986, '),
              ('$($lexicalInventory.Length)/73181, ', '$($lexicalInventory.Length)/73689, '),
          )
          for old, new in replacements:
              replace_once(old, new, old)

          old_state_guard = '\n'.join((
              "    if ($disjointBlock -match '(?i)LMC_OWNER_STATE_RESERVED|LMC_OWNER_STATE_QUARANTINED') {",
              '        throw "$blocker disjoint proof accepts a non-active Reserved/Quarantined state."',
              '    }',
              ''))
          new_state_guard = '\n'.join((
              "    if ($disjointBlock -match '(?i)LMC_OWNER_STATE_QUARANTINED') {",
              '        throw "$blocker disjoint proof accepts a Quarantined state."',
              '    }',
              '    $reservedDisjointStates = @(',
              "        [regex]::Matches($disjointBlock, '(?i)LMC_OWNER_STATE_RESERVED'))",
              '    if ($reservedDisjointStates.Count -ne 1) {',
              '        throw "$blocker disjoint proof Reserved state must appear exactly once for SetOperationMode."',
              '    }',
              ''))
          replace_once(old_state_guard, new_state_guard, 'disjoint state guard')

          old_classifier_tail = '\n'.join((
              "        'LMC_OWNER_KIND_ENCODER\\s*:\\s*currentStateValid\\s*:=.*?' +",
              "        'LMC_OWNER_STATE_TW20_QUEUED.*?LMC_OWNER_STATE_TW20_RUNNING.*?' +",
              "        'LMC_OWNER_STATE_TW20_DRAINING') (",
              '        "$blocker disjoint proof active-state classifier drifted.")',
              ''))
          new_classifier_tail = '\n'.join((
              "        'LMC_OWNER_KIND_ENCODER\\s*:\\s*currentStateValid\\s*:=.*?' +",
              "        'LMC_OWNER_STATE_TW20_QUEUED.*?LMC_OWNER_STATE_TW20_RUNNING.*?' +",
              "        'LMC_OWNER_STATE_TW20_DRAINING.*?' +",
              "        'LMC_OWNER_KIND_AXIS_OPERATION_MODE\\s*:\\s*currentStateValid\\s*:=.*?' +",
              "        'LMC_OWNER_STATE_RESERVED.*?' +",
              "        'LMC_OWNER_STATE_AXIS_OPERATION_MODE_ACTIVE') (",
              '        "$blocker disjoint proof active-state classifier drifted.")',
              ''))
          replace_once(old_classifier_tail, new_classifier_tail, 'disjoint classifier tail')

          old_shape = '\n'.join((
              "        @{ Label = '0x7D15'; Pattern = '0x7D15\\s*:\\s*identityExpectedSize\\s*:=\\s*72\\s*;' },",
              "        @{ Label = '0x7E53'; Pattern = '0x7E53\\s*:\\s*identityExpectedSize\\s*:=\\s*72\\s*;' })",
              ''))
          new_shape = '\n'.join((
              "        @{ Label = '0x7D15'; Pattern = '0x7D15\\s*:\\s*identityExpectedSize\\s*:=\\s*72\\s*;' },",
              "        @{ Label = '0x7D23'; Pattern = '0x7D23\\s*:\\s*identityExpectedSize\\s*:=\\s*56\\s*;' },",
              "        @{ Label = '0x7E53'; Pattern = '0x7E53\\s*:\\s*identityExpectedSize\\s*:=\\s*72\\s*;' })",
              ''))
          replace_once(old_shape, new_shape, '0x7D23 identity shape')

          src.write_text(text, encoding='utf-8', newline='')

      - name: Run SetOperationMode invariants
        shell: powershell
        run: |
          git diff --check
          & '.\tools\Verify-SetOperationModeStatic.ps1' -ExpectedSdoWriteAxis 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate repository SourceOnly artifact boundary
        shell: powershell
        run: |
          $repoRoot = (Get-Location).Path
          $sourceOutput = ''
          $sourceExit = 0
          try {
            $sourceOutput = (& '.\LMC_Library\LMC_API_Delivery\tests\LasalMotionControlLib.Tests\Verify-LasalContract.ps1' `
              -RepositoryRoot $repoRoot `
              -SourceOnly `
              -ExpectedSdoWriteAxis 1 2>&1 | Out-String)
            $sourceExit = $LASTEXITCODE
          }
          catch {
            $sourceOutput = ($sourceOutput + "`n" + ($_ | Out-String))
            $sourceExit = 1
          }
          Write-Host $sourceOutput
          if ($sourceExit -eq 0) {
            Write-Host 'SourceOnly contract fully passed; no artifact exception required.'
            exit 0
          }
          $expectedArtifactStop = 'LASAL\.UdpCallbackContract blocker: SetPosition-augmented Classes\.lcb physical identity drifted\.'
          if ($sourceOutput -notmatch $expectedArtifactStop) {
            throw "Unexpected SourceOnly failure; permanent ratchet commit is blocked. Exit=$sourceExit"
          }
          Write-Host 'Expected Classes.lcb physical-identity STOP observed after source/static qualification.'

      - name: Commit permanent verifier and remove probe
        shell: powershell
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalContract.ps1'
          git rm '.github/workflows/mode10-ratchet-probe.yml'
          git diff --cached --check
          git diff --cached --name-status
          if (git diff --cached --quiet) {
            throw 'No permanent verifier/probe cleanup diff was produced.'
          }
          git commit -m 'test(api): ratchet SetOperationMode ownership source contract'
          git push origin 'HEAD:codex/mode-10-sourceonly-finalize-permanent'
