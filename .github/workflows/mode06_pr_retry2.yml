name: MODE-06 PR patch retry 2

on:
  pull_request:
    branches:
      - dev
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Extract corrected exact patch script
        run: |
          ruby -e 'require "yaml"; y=YAML.load_file(".github/workflows/mode06_owner_tcp_patch.yml"); puts y["jobs"]["patch"]["steps"][1]["run"]' > /tmp/mode06_patch.py
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('/tmp/mode06_patch.py')
          s = p.read_text()
          start = s.find("('validate tuple',")
          end = s.find("('validate active state',", start)
          if start < 0 or end < 0:
              raise SystemExit('validate tuple patch block not found')
          block = s[start:end]
          block2, count = re.subn(r', 1\),(\s*)$', r', 2),\1', block, count=1)
          if count != 1:
              raise SystemExit(f'validate tuple expected-count tail mismatch: {count}')
          p.write_text(s[:start] + block2 + s[end:])
          PY
          python /tmp/mode06_patch.py
      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "openai-codex[bot]"
          git config user.email "openai-codex[bot]@users.noreply.github.com"
          git add Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCControlCommandService/LMCControlCommandService.st
          git add Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/TCPMotionInterface/TCPMotionInterface.st
          git rm .github/workflows/mode06_owner_tcp_patch.yml
          git rm .github/workflows/mode06_pr_patch.yml
          git rm .github/workflows/mode06_pr_retry.yml
          git rm .github/workflows/mode06_pr_retry2.yml
          git rm .mode06-trigger
          git commit -m "feat(mode): wire SetOperationMode ownership admission"
          git push origin HEAD:${{ github.head_ref }}
