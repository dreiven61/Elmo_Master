name: SetOperationMode Start execution refactor promotion

on:
  push:
    branches:
      - dev
    paths:
      - 'tools/Apply-SetOperationModeStartExecutionRefactor.py'
      - '.github/workflows/set-operation-mode-start-execution-refactor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-qualify-promote:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply designed Start execution refactor
        shell: powershell
        run: |
          $helper = '.\tools\Apply-SetOperationModeStartExecutionRefactor.py'
          $helperText = Get-Content -LiteralPath $helper -Raw
          $helperText = $helperText.Replace('if count != 1:', 'if count < 1:')
          [IO.File]::WriteAllText((Resolve-Path $helper), $helperText, (New-Object Text.UTF8Encoding($false)))
          python $helper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Start execution source contract
        shell: powershell
        run: |
          & '.\tools\Verify-SetOperationModeStartExecution.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Locate MSBuild
        id: msbuild
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw "vswhere.exe was not found on the Windows runner."
          }
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($msbuild)) {
            throw "MSBuild.exe was not found on the Windows runner."
          }
          "path=$msbuild" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: API Debug full regression
        shell: powershell
        run: |
          $project = '.\LMC_Library\LMC_API_Delivery\tests\LasalMotionControlLib.Tests\LasalMotionControlLib.Tests.csproj'
          & '${{ steps.msbuild.outputs.path }}' $project /t:RunPcTests /p:Configuration=Debug /p:Platform=AnyCPU /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build WPF smoke tests Debug
        shell: powershell
        run: |
          $project = '.\LMC_Library\LasalApiWpfTestApp\LasalApiWpfTestApp.SmokeTests\LasalApiWpfTestApp.SmokeTests.csproj'
          & '${{ steps.msbuild.outputs.path }}' $project /t:Build /p:Configuration=Debug /p:Platform=AnyCPU /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run SetOperationMode WPF smoke Debug
        shell: powershell
        run: |
          $exe = '.\LMC_Library\LasalApiWpfTestApp\LasalApiWpfTestApp.SmokeTests\bin\Debug\LasalApiWpfTestApp.SmokeTests.exe'
          & $exe --filter SetOperationMode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Generic SDO WPF focused smoke Debug
        shell: powershell
        run: |
          $exe = '.\LMC_Library\LasalApiWpfTestApp\LasalApiWpfTestApp.SmokeTests\bin\Debug\LasalApiWpfTestApp.SmokeTests.exe'
          & $exe --filter 'Wpf.Sdo.'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: API Release build
        shell: powershell
        run: |
          $project = '.\LMC_Library\LMC_API_Delivery\tests\LasalMotionControlLib.Tests\LasalMotionControlLib.Tests.csproj'
          & '${{ steps.msbuild.outputs.path }}' $project /t:Build /p:Configuration=Release /p:Platform=AnyCPU /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build WPF smoke tests Release
        shell: powershell
        run: |
          $project = '.\LMC_Library\LasalApiWpfTestApp\LasalApiWpfTestApp.SmokeTests\LasalApiWpfTestApp.SmokeTests.csproj'
          & '${{ steps.msbuild.outputs.path }}' $project /t:Build /p:Configuration=Release /p:Platform=AnyCPU /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run SetOperationMode WPF smoke Release
        shell: powershell
        run: |
          $exe = '.\LMC_Library\LasalApiWpfTestApp\LasalApiWpfTestApp.SmokeTests\bin\Release\LasalApiWpfTestApp.SmokeTests.exe'
          & $exe --filter SetOperationMode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Diff hygiene
        shell: powershell
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit qualified functional implementation
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- `
            'LMC_Library/LasalApiWpfTestApp/LasalApiWpfTestApp/MainWindow.AxisSetOperationModeRecovery.cs' `
            'LMC_Library/LasalApiWpfTestApp/LasalApiWpfTestApp/MainWindow.ReadOnlyApi.cs' `
            'LMC_Library/LasalApiWpfTestApp/LasalApiWpfTestApp.SmokeTests/WpfAxisSetOperationModeRecoveryIntegrationTests.cs' `
            'tools/Verify-SetOperationModeStartExecution.ps1' `
            '.github/workflows/set-operation-mode-wpf-recovery.yml'
          if (-not (git diff --cached --quiet)) {
            git commit -m 'fix(setopmode): canonicalize Start execution path'
            git push origin HEAD:dev
          }
