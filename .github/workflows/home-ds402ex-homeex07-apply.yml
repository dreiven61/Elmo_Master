name: HomeDS402Ex HOMEEX-07 ownership source application

on:
  push:
    branches:
      - codex/home-ds402ex-homeex07-ownership
    paths:
      - 'tools/Apply-HomeDs402ExHomeex07Ownership.ps1'
      - 'tools/Invoke-HomeDs402ExHomeex07OwnershipTransform.ps1'
      - 'tools/Verify-HomeDs402ExHomeex07Ownership.ps1'
      - '.github/workflows/home-ds402ex-homeex07-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-source:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout qualification branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/home-ds402ex-homeex07-ownership

      - name: Verify exact dev ancestry
        shell: pwsh
        run: |
          git merge-base --is-ancestor b7ddb6cc843004c74d6c4a05421b09a866bf1cec HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply exact HOMEEX-07 source transform
        shell: pwsh
        run: |
          & .\tools\Invoke-HomeDs402ExHomeex07OwnershipTransform.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify HOMEEX-07 ownership candidate
        shell: pwsh
        run: |
          & .\tools\Verify-HomeDs402ExHomeex07Ownership.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify SetOperationMode define order
        shell: powershell
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\tools\Verify-SetOperationModeDefineOrder.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit exactly three tracked LASAL sources
        shell: pwsh
        run: |
          $paths = @(
            'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCControlCommandService/LMCControlCommandService.st',
            'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/TCPMotionInterface/TCPMotionInterface.st',
            'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCDiagnosticsService/LMCDiagnosticsService.st')
          git add -- $paths
          $staged = @(git diff --cached --name-only)
          if ($staged.Count -ne 3) { throw "Expected exactly three staged LASAL sources, found $($staged.Count): $($staged -join ', ')" }
          foreach ($path in $paths) {
            if (-not ($staged -contains $path)) { throw "Missing staged source: $path" }
          }
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(homeex): add full-identity ownership admission'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:codex/home-ds402ex-homeex07-ownership
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
