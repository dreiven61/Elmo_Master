name: Fix SDO submit policy build

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/fix-sdo-submit-policy-build.yml

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: microsoft/setup-msbuild@v2

      - name: Restore ValidateSdoSubmitPolicy
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          path = Path('LMC_Library/LMC_API_Delivery/src/LmcDiagnosticsD5.cs')
          text = path.read_text(encoding='utf-8-sig')
          start_marker = '        private static void ValidateSdoWritePolicy(LMCSdoRequest request)\n'
          end_marker = '        private void ValidatePIWriteCapabilities(\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = ''.join([
              '        private static void ValidateSdoWritePolicy(LMCSdoRequest request)\n',
              '        {\n',
              '            if (!request.IsWrite)\n',
              '            {\n',
              '                return;\n',
              '            }\n',
              '\n',
              '            // Generic SDO Write no longer denies valid object addresses by ObjectIndex.\n',
              '        }\n',
              '\n',
              '        private static void ValidateSdoSubmitPolicy(LMCSdoRequest request)\n',
              '        {\n',
              '            if (request == null)\n',
              '            {\n',
              '                throw new ArgumentNullException("request");\n',
              '            }\n',
              '\n',
              '            ValidateSdoWritePolicy(request);\n',
              '            if (request.IsWrite)\n',
              '            {\n',
              '                LMCDiagnosticsWritePolicy.RequireSdoWriteAllowed(request);\n',
              '                return;\n',
              '            }\n',
              '\n',
              '            LMCDiagnosticsSdoPolicy.RequireReadAllowed(request);\n',
              '        }\n',
              '\n',
          ])
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          '@ | python -
          git diff --check

      - name: Build API Debug
        shell: pwsh
        run: |
          msbuild 'LMC_Library/LMC_API_Delivery/src/LasalMotionControlLib.csproj' /t:Build /p:Configuration=Debug /m /nologo

      - name: Commit fix to dev
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/fix-sdo-submit-policy-build.yml'
          git add 'LMC_Library/LMC_API_Delivery/src/LmcDiagnosticsD5.cs'
          git commit -m 'fix: restore SDO submit policy validator'
          git push origin HEAD:dev
