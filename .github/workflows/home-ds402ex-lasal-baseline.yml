name: HomeDS402Ex LASAL stage qualification

on:
  pull_request:
    branches:
      - dev
    paths:
      - 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/TCPMotionInterface/TCPMotionInterface.st'
      - 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCDiagnosticsService/LMCDiagnosticsService.st'
      - 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCControlCommandService/LMCControlCommandService.st'
      - 'tools/Verify-HomeDs402ExLasalScaffold.ps1'
      - 'tools/Verify-HomeDs402ExHomeex07Ownership.ps1'
      - 'tools/Verify-SetOperationModeDefineOrder.ps1'
      - '.github/workflows/home-ds402ex-lasal-baseline.yml'
      - 'docs/api/design/HOME_DS402_EX_LASAL_SCAFFOLD_READINESS.md'
      - 'docs/api/design/HOME_DS402_EX_DESIGN.md'
  push:
    branches:
      - codex/home-ds402ex-lasal-scaffold
      - codex/home-ds402ex-homeex07-ownership
    paths:
      - 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/TCPMotionInterface/TCPMotionInterface.st'
      - 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCDiagnosticsService/LMCDiagnosticsService.st'
      - 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCControlCommandService/LMCControlCommandService.st'
      - 'tools/Verify-HomeDs402ExLasalScaffold.ps1'
      - 'tools/Verify-HomeDs402ExHomeex07Ownership.ps1'
      - 'tools/Verify-SetOperationModeDefineOrder.ps1'
      - '.github/workflows/home-ds402ex-lasal-baseline.yml'
      - 'docs/api/design/HOME_DS402_EX_LASAL_SCAFFOLD_READINESS.md'
      - 'docs/api/design/HOME_DS402_EX_DESIGN.md'
  workflow_dispatch:

jobs:
  lasal-stage:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect HomeDS402Ex LASAL stage
        id: stage
        shell: pwsh
        run: |
          $control = Get-Content -LiteralPath '.\Lasal_PRG\Elmo_EtherCAT_Test_4Axis\Class\LMCControlCommandService\LMCControlCommandService.st' -Raw
          $homeex07 = $control.Contains('#define LMC_OWNER_KIND_DS402_HOME_EX 7')
          "homeex07=$($homeex07.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "HOMEEX07=$homeex07"

      - name: Verify HomeDS402Ex HOMEEX-06 SCAFFOLD_OFF
        if: steps.stage.outputs.homeex07 != 'true'
        shell: powershell
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\tools\Verify-HomeDs402ExLasalScaffold.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify HomeDS402Ex HOMEEX-07 ownership
        if: steps.stage.outputs.homeex07 == 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath '.\tools\Verify-HomeDs402ExHomeex07Ownership.ps1')) {
            throw 'HOMEEX-07 source requires Verify-HomeDs402ExHomeex07Ownership.ps1.'
          }
          & .\tools\Verify-HomeDs402ExHomeex07Ownership.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify SetOperationMode define order regression
        shell: powershell
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\tools\Verify-SetOperationModeDefineOrder.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Diff hygiene
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            git diff --check "origin/$env:GITHUB_BASE_REF...HEAD"
          }
          elseif ($env:GITHUB_EVENT_NAME -eq 'push') {
            git diff --check HEAD^ HEAD
          }
          else {
            git diff --check
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
