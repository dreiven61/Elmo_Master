name: Current docs sync

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/docs-current-sync.yml'
      - 'tools/Apply-CurrentDocsSync.py'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply current documentation sync
        run: python3 tools/Apply-CurrentDocsSync.py

      - name: Regenerate HTML mirrors
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pandoc >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq pandoc
          fi
          pandoc -s --toc -o docs/api/API_MANUAL.html docs/api/API_MANUAL.md
          pandoc -s --toc -o docs/api/API_DEVELOPMENT_PROGRESS.html docs/api/API_DEVELOPMENT_PROGRESS.md

      - name: Validate current markers
        shell: bash
        run: |
          set -euo pipefail
          grep -F '문서 버전: 2.5-development' docs/api/API_MANUAL.md
          grep -F '17:28 실기 blocker' docs/api/API_MANUAL.md
          grep -F '문서 버전: 1.3-current' docs/api/API_DEVELOPMENT_PROGRESS.md
          grep -F 'capability freshness ordering' docs/api/API_DEVELOPMENT_PROGRESS.md
          grep -F 'remote branch는 현재 `main`, `dev` 두 개만 유지한다.' docs/api/API_DEVELOPMENT_PROGRESS.md
          git diff --check

      - name: Commit synchronized docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'dreiven61'
          git config user.email '148423840+dreiven61@users.noreply.github.com'
          git add docs/api/API_MANUAL.md docs/api/API_MANUAL.html docs/api/API_DEVELOPMENT_PROGRESS.md docs/api/API_DEVELOPMENT_PROGRESS.html
          if git diff --cached --quiet; then
            echo 'No documentation changes to commit.'
            exit 0
          fi
          git commit -m 'docs(api): sync manual and development progress'
          git push origin HEAD:dev
