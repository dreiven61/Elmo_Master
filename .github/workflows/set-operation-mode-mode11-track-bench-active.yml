name: SetOperationMode MODE-11 tracked bench promotion

on:
  push:
    branches:
      - codex/setopmode-mode11-bench-activation
    paths:
      - '.github/workflows/set-operation-mode-mode11-track-bench-active.yml'

permissions:
  contents: write

jobs:
  promote-once:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact qualification branch
        uses: actions/checkout@v4
        with:
          ref: codex/setopmode-mode11-bench-activation
          fetch-depth: 0

      - name: Require exact baseline before promotion
        shell: powershell
        run: |
          $diag = '.\Lasal_PRG\Elmo_EtherCAT_Test_4Axis\Class\LMCDiagnosticsService\LMCDiagnosticsService.st'
          $control = '.\Lasal_PRG\Elmo_EtherCAT_Test_4Axis\Class\LMCControlCommandService\LMCControlCommandService.st'
          & '.\tools\Prepare-SetOperationModeMode11Bench.ps1' -Verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $diagText = [IO.File]::ReadAllText($diag)
          $controlText = [IO.File]::ReadAllText($control)
          if (-not $diagText.Contains('#define LMC_DIAG_SET_OPERATION_MODE_ENABLED FALSE') -or
              -not $controlText.Contains('(pResponseFrame + 24)^$UDINT := 0x00000017;')) {
            Write-Error 'One-shot promoter expected the exact BASELINE_OFF pair.'
            exit 1
          }

      - name: Promote paired SetOperationMode gates and verify safety contract
        shell: powershell
        run: |
          $diag = '.\Lasal_PRG\Elmo_EtherCAT_Test_4Axis\Class\LMCDiagnosticsService\LMCDiagnosticsService.st'
          $control = '.\Lasal_PRG\Elmo_EtherCAT_Test_4Axis\Class\LMCControlCommandService\LMCControlCommandService.st'
          & '.\tools\Prepare-SetOperationModeMode11Bench.ps1' -Enable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & '.\tools\Prepare-SetOperationModeMode11Bench.ps1' -Verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $diagText = [IO.File]::ReadAllText($diag)
          $controlText = [IO.File]::ReadAllText($control)
          if (-not $diagText.Contains('#define LMC_DIAG_SET_OPERATION_MODE_ENABLED TRUE') -or
              -not $controlText.Contains('(pResponseFrame + 24)^$UDINT := 0x00000717;')) {
            Write-Error 'Paired BENCH_ACTIVE promotion did not complete.'
            exit 1
          }
          & '.\tools\Verify-SetOperationModeMode11Candidate.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & '.\tools\Verify-SetOperationModeDefineOrder.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit only the paired qualification activation
        shell: powershell
        run: |
          $diag = 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCDiagnosticsService/LMCDiagnosticsService.st'
          $control = 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCControlCommandService/LMCControlCommandService.st'
          $changed = @(git diff --name-only)
          if ($changed.Count -ne 2 -or $changed -notcontains $diag -or $changed -notcontains $control) {
            Write-Error ('Promotion changed unexpected paths: ' + ($changed -join ', '))
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $diag $control
          git commit -m 'test(mode): track MODE-11 BENCH_ACTIVE'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:codex/setopmode-mode11-bench-activation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
