name: Apply dynamic connected-axis group structure

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/dynamic-group-connected-axis.yml'
      - 'tools/apply_dynamic_group_connected_axis.py'
      - 'tools/run_dynamic_group_connected_axis.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-commit:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply dynamic group patch
        shell: powershell
        run: |
          python '.\tools\run_dynamic_group_connected_axis.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build API tests
        shell: powershell
        run: |
          $project = '.\LMC_Library\LMC_API_Delivery\tests\LasalMotionControlLib.Tests\LasalMotionControlLib.Tests.csproj'
          msbuild $project /t:Build /p:Configuration=Debug /p:Platform=AnyCPU /m /nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & '.\LMC_Library\LMC_API_Delivery\tests\LasalMotionControlLib.Tests\bin\Debug\LasalMotionControlLib.Tests.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit dynamic group runtime
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCControlCommandService/LMCControlCommandService.st'
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'No source changes to commit.'
            exit 0
          }
          git commit -m 'feat(group): resolve members from connected axes dynamically'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:dev
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
