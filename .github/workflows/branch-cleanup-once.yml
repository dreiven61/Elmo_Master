name: One-shot merged branch cleanup

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/branch-cleanup-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Delete only confirmed merged or obsolete branches
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $deleteBranches = @(
            'codex/home-ds402ex-homeex01-02-profile-gate',
            'codex/home-ds402ex-homeex06-progress-sync',
            'codex/home-ds402ex-homeex07-ownership',
            'codex/home-ds402ex-homeex08-approved-plan-gate',
            'codex/home-ds402ex-homeex09-static-qualification',
            'codex/home-ds402ex-lasal-scaffold',
            'codex/home-ds402ex-lasal-scaffold-readiness',
            'codex/home-ds402ex-owner-abi',
            'codex/home-ds402ex-sdk-wire',
            'codex/home-ds402ex-wpf-recovery',
            'codex/mode-02-owner-abi',
            'codex/mode-06-axis-operation-mode',
            'codex/mode-06-diagnostics-executor',
            'codex/mode-06-gate-cleanup',
            'codex/mode-07-no-replay-recovery',
            'codex/mode-08-owner-conflicts',
            'codex/mode-09-block-generic-6060',
            'codex/mode-10-c78-artifact-qualification',
            'codex/mode-10-c78-define-order-fix',
            'codex/mode-10-method-split',
            'codex/mode-10-sourceonly-cleanup',
            'codex/mode-10-sourceonly-finalize',
            'codex/mode-10-sourceonly-finalize-permanent',
            'codex/mode-10-static-qualification',
            'codex/mode-10-static-qualification-v2',
            'codex/reorganize-functional-folders-20260708',
            'codex/setopmode-c78-evidence-capture',
            'codex/setopmode-mode10-artifact-review',
            'codex/setopmode-mode11-software-evidence-sync',
            'codex/setopmode-mode11-wpf-evidence-export',
            'codex/setopmode-mode13-reject-resolution'
          )
          $preserveBranches = @(
            'codex/mode-10-c78-finalize',
            'codex/setopmode-mode11-bench-activation'
          )

          foreach ($branch in $deleteBranches) {
            git ls-remote --exit-code --heads origin "refs/heads/$branch" *> $null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "DELETE $branch"
              git push origin --delete $branch
              if ($LASTEXITCODE -ne 0) { throw "Failed deleting $branch" }
            }
            else {
              Write-Host "SKIP missing $branch"
            }
          }

          foreach ($branch in $deleteBranches) {
            git ls-remote --exit-code --heads origin "refs/heads/$branch" *> $null
            if ($LASTEXITCODE -eq 0) { throw "Deleted branch still exists: $branch" }
          }
          foreach ($branch in $preserveBranches) {
            git ls-remote --exit-code --heads origin "refs/heads/$branch" *> $null
            if ($LASTEXITCODE -ne 0) { throw "Required preserved branch is missing: $branch" }
            Write-Host "PRESERVE $branch"
          }
          Write-Host "PASS deleted $($deleteBranches.Count) confirmed branches and preserved $($preserveBranches.Count) active branches."

      - name: Remove one-shot workflow from dev
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/branch-cleanup-once.yml'
          git commit -m 'ci: remove one-shot branch cleanup'
          git push origin HEAD:dev
