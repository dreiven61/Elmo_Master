# one-shot repair trigger: 2026-08-26 publish-macro-closure-ratchet
name: HomeDS402Ex HOMEEX-09 one-shot repair

on:
  push:
    branches:
      - codex/home-ds402ex-homeex09-static-qualification
    paths:
      - '.github/workflows/home-ds402ex-homeex09-repair-once.yml'
  pull_request:
    branches:
      - codex/home-ds402ex-homeex01-02-profile-gate
    paths:
      - '.github/workflows/home-ds402ex-homeex09-repair-once.yml'

permissions:
  contents: write

jobs:
  repair-and-prove:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/home-ds402ex-homeex09-static-qualification
          fetch-depth: 0

      - name: Apply byte-preserving HOMEEX-09 repairs
        shell: powershell
        run: |
          @'
          from pathlib import Path
          import re

          control = Path(r'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCControlCommandService/LMCControlCommandService.st')
          contract = Path(r'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalContract.ps1')

          control_bytes = control.read_bytes()
          tail_pattern = re.compile(
              br'(replacementTailOffset\s*:=\s*(?:\r?\n[ \t]*)?TO_UDINT\(probeAxisIndex\s*-\s*1\)\s*\*\s*)8(\s*;)',
              re.IGNORECASE,
          )
          tail_matches = list(tail_pattern.finditer(control_bytes))
          if len(tail_matches) != 2:
              raise SystemExit(f'Expected exactly two stale replacementTailOffset * 8 matches, found {len(tail_matches)}')
          control_bytes = tail_pattern.sub(
              br'\1LMC_OWNER_IDENTITY_AXIS_TAIL_BYTES\2',
              control_bytes,
              count=2,
          )
          control.write_bytes(control_bytes)

          contract_bytes = contract.read_bytes()
          state_old = b"$replacementBankHistogram['ownershipstate'] -ne 44"
          state_new = b"$replacementBankHistogram['ownershipstate'] -ne 47"
          message_old = b'expected 44/12.'
          message_new = b'expected 47/12.'
          if contract_bytes.count(state_old) != 1 or contract_bytes.count(message_old) != 1:
              raise SystemExit('Expected exact legacy 44/12 SourceOnly fence before repair')
          if contract_bytes.count(state_new) != 0 or contract_bytes.count(message_new) != 0:
              raise SystemExit('47/12 fence already exists before one-shot repair; refusing ambiguous rewrite')
          contract_bytes = contract_bytes.replace(state_old, state_new, 1)
          contract_bytes = contract_bytes.replace(message_old, message_new, 1)

          semantic_count_old = b'6714'
          semantic_count_new = b'7015'
          count_positions = [match.start() for match in re.finditer(semantic_count_old, contract_bytes)]
          if len(count_positions) != 2:
              raise SystemExit(f'Expected exactly two verifier 6714 tokens, found {len(count_positions)}')
          for position in count_positions:
              context = contract_bytes[max(0, position - 512):min(len(contract_bytes), position + 512)].lower()
              if b'replacement' not in context or b'semantic' not in context:
                  raise SystemExit('A 6714 token is not bounded by replacement semantic-inventory context')
          if contract_bytes.count(semantic_count_new) != 0:
              raise SystemExit('7015 already exists before repair')
          contract_bytes = contract_bytes.replace(semantic_count_old, semantic_count_new, 2)

          old_semantic_hash = b'3386CCD85F63DEE01ABD5C06B82E2F4591179998E07D05B62DF4D816CCFF6D2B'
          new_semantic_hash = b'2270D6D53A5ACDE045AA830AEE7720DBA4C74BBEADCE19ED281DC8A1A7ABF664'
          if contract_bytes.count(old_semantic_hash) != 1 or contract_bytes.count(new_semantic_hash) != 0:
              raise SystemExit('Replacement semantic SHA precondition failed')
          hash_position = contract_bytes.index(old_semantic_hash)
          if b'replacementsemantic' not in contract_bytes[max(0, hash_position - 1024):min(len(contract_bytes), hash_position + 1024)].lower():
              raise SystemExit('Old semantic SHA is outside replacement semantic context')
          contract_bytes = contract_bytes.replace(old_semantic_hash, new_semantic_hash, 1)

          adapter_old = b"@{ Name = 'adapter'; Fragment = $adapter; LF = 29124; CRLF = 29922; Sha = '8855AEEAE9B617CEAC1D10C7CC4ADB7F4D0536D108592560CE0D39ACF344AFAC' }"
          adapter_new = b"@{ Name = 'adapter'; Fragment = $adapter; LF = 29184; CRLF = 29981; Sha = '855FA45D910DAFA0EA236807A004E08EFDA080BC57A80FD433BF38F0B3B6BA01' }"
          helper_old = b"@{ Name = 'helper'; Fragment = $helper; LF = 22214; CRLF = 22826; Sha = '9E0A37E0EC0A3AD7FDD194CF8691BF3B492D4E4C6FD10E8C118323571F980BDD' }"
          helper_new = b"@{ Name = 'helper'; Fragment = $helper; LF = 22712; CRLF = 23332; Sha = 'EB2E6D61A638DE06B890613D015C0904901318C4EB6B76E63F6D0F7E7A45E527' }"
          if contract_bytes.count(adapter_old) != 1 or contract_bytes.count(adapter_new) != 0:
              raise SystemExit('Rollback-split adapter tuple precondition failed')
          if contract_bytes.count(helper_old) != 1 or contract_bytes.count(helper_new) != 0:
              raise SystemExit('Rollback-split helper tuple precondition failed')
          adapter_position = contract_bytes.index(adapter_old)
          adapter_context = contract_bytes[max(0, adapter_position - 1024):min(len(contract_bytes), adapter_position + 2048)].lower()
          if b'methodcontract' not in adapter_context or b'byte/hash ratchet' not in adapter_context:
              raise SystemExit('Adapter tuple is outside rollback-split ratchet context')
          helper_position = contract_bytes.index(helper_old)
          helper_context = contract_bytes[max(0, helper_position - 1024):min(len(contract_bytes), helper_position + 2048)].lower()
          if b'methodcontract' not in helper_context or b'byte/hash ratchet' not in helper_context:
              raise SystemExit('Helper tuple is outside rollback-split ratchet context')
          contract_bytes = contract_bytes.replace(adapter_old, adapter_new, 1)
          contract_bytes = contract_bytes.replace(helper_old, helper_new, 1)

          macro_hash_old = b'367C87E07AF2C33D60F32F3E94AECF73BA052C6F3155DA909DB9EAD1BB9EAB85'
          macro_hash_new = b'EE120B0DDC3757546616C32B5C3C4592D4EFACFBF4B6DA2DE24354596EB513DE'
          if contract_bytes.count(macro_hash_old) != 1 or contract_bytes.count(macro_hash_new) != 0:
              raise SystemExit('Publish referenced-macro closure SHA precondition failed')
          macro_hash_position = contract_bytes.index(macro_hash_old)
          macro_lo = max(0, macro_hash_position - 1800)
          macro_hi = min(len(contract_bytes), macro_hash_position + 1800)
          macro_context = contract_bytes[macro_lo:macro_hi]
          macro_replacements = (
              (b'$macroInventory.Count -ne 70', b'$macroInventory.Count -ne 73'),
              (b'$joinedMacros.Length -ne 2470', b'$joinedMacros.Length -ne 2579'),
              (macro_hash_old, macro_hash_new),
              (b'$($macroInventory.Count)/70', b'$($macroInventory.Count)/73'),
              (b'$($joinedMacros.Length)/2470', b'$($joinedMacros.Length)/2579'),
          )
          if b'referenced macro closure drifted' not in macro_context:
              raise SystemExit('Publish referenced-macro closure hash is outside expected blocker context')
          for old, new in macro_replacements:
              if macro_context.count(old) != 1 or macro_context.count(new) != 0:
                  raise SystemExit(f'Publish referenced-macro closure token precondition failed: {old!r}')
              macro_context = macro_context.replace(old, new, 1)
          contract_bytes = contract_bytes[:macro_lo] + macro_context + contract_bytes[macro_hi:]

          contract.write_bytes(contract_bytes)

          print('PASS repaired exactly two stale identity-tail strides')
          print('PASS re-baselined only OwnershipState persisted-read fence 44 -> 47')
          print('PASS preserved OwnershipIdentityState fence at 12')
          print('PASS re-baselined replacement semantic token inventory 6714 -> 7015')
          print('PASS re-baselined paired replacement semantic SHA-256')
          print('PASS re-baselined rollback-split adapter and helper LF/CRLF/SHA ratchets')
          print('PASS re-baselined publish referenced-macro closure 70/2470 -> 73/2579')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify HOMEEX-09 static invariants after repair
        shell: powershell
        run: |
          & '.\tools\Verify-HomeDs402ExHomeex09Static.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run legacy LASAL SourceOnly contract after repair
        shell: powershell
        run: |
          & '.\LMC_Library\LMC_API_Delivery\tests\LasalMotionControlLib.Tests\Verify-LasalContract.ps1' -RepositoryRoot $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check focused diff
        shell: powershell
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --stat

      - name: Commit repair and remove one-shot workflow
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/home-ds402ex-homeex09-repair-once.yml'
          git add 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCControlCommandService/LMCControlCommandService.st'
          git add 'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalContract.ps1'
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m 'fix(homeex): close HOMEEX-09 identity ratchets'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:codex/home-ds402ex-homeex09-static-qualification
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
