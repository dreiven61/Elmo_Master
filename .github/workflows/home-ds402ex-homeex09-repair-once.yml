name: HomeDS402Ex HOMEEX-09 one-shot repair

on:
  push:
    branches:
      - codex/home-ds402ex-homeex09-static-qualification
    paths:
      - '.github/workflows/home-ds402ex-homeex09-repair-once.yml'

permissions:
  contents: write

jobs:
  repair-and-prove:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/home-ds402ex-homeex09-static-qualification
          fetch-depth: 0

      - name: Discover exact HOMEEX-09 ratchet location
        shell: powershell
        run: |
          @'
          from pathlib import Path
          import re

          control = Path(r'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCControlCommandService/LMCControlCommandService.st')
          contract = Path(r'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalContract.ps1')

          control_bytes = control.read_bytes()
          tail_pattern = re.compile(
              br'(replacementTailOffset\s*:=\s*(?:\r?\n[ \t]*)?TO_UDINT\(probeAxisIndex\s*-\s*1\)\s*\*\s*)8(\s*;)',
              re.IGNORECASE,
          )
          tail_matches = list(tail_pattern.finditer(control_bytes))
          if len(tail_matches) != 2:
              raise SystemExit(f'Expected exactly two stale replacementTailOffset * 8 matches, found {len(tail_matches)}')
          print('PASS found exactly two stale replacementTailOffset * 8 sites')

          text = contract.read_text(encoding='utf-8-sig')
          lines = text.splitlines()
          candidates = []
          for index, line in enumerate(lines):
              if re.search(r'(?<!\d)44(?!\d)', line):
                  start = max(0, index - 4)
                  end = min(len(lines), index + 5)
                  context = '\n'.join(f'{i + 1}: {lines[i]}' for i in range(start, end))
                  candidates.append((index + 1, context))

          print(f'Found {len(candidates)} standalone 44 candidate line(s) in Verify-LasalContract.ps1')
          for line_number, context in candidates:
              print(f'--- candidate line {line_number} ---')
              print(context)
          raise SystemExit('Diagnostic stop after printing standalone 44 candidates; no files committed.')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
