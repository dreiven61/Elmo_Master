# one-shot repair trigger: 2026-08-26 semantic-actual-pair
name: HomeDS402Ex HOMEEX-09 one-shot repair

on:
  push:
    branches:
      - codex/home-ds402ex-homeex09-static-qualification
    paths:
      - '.github/workflows/home-ds402ex-homeex09-repair-once.yml'

permissions:
  contents: write

jobs:
  repair-and-prove:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/home-ds402ex-homeex09-static-qualification
          fetch-depth: 0

      - name: Apply byte-preserving HOMEEX-09 repairs
        shell: powershell
        run: |
          @'
          from pathlib import Path
          import re

          control = Path(r'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCControlCommandService/LMCControlCommandService.st')
          contract = Path(r'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalContract.ps1')

          control_bytes = control.read_bytes()
          tail_pattern = re.compile(
              br'(replacementTailOffset\s*:=\s*(?:\r?\n[ \t]*)?TO_UDINT\(probeAxisIndex\s*-\s*1\)\s*\*\s*)8(\s*;)',
              re.IGNORECASE,
          )
          tail_matches = list(tail_pattern.finditer(control_bytes))
          if len(tail_matches) != 2:
              raise SystemExit(f'Expected exactly two stale replacementTailOffset * 8 matches, found {len(tail_matches)}')
          control_bytes = tail_pattern.sub(
              br'\1LMC_OWNER_IDENTITY_AXIS_TAIL_BYTES\2',
              control_bytes,
              count=2,
          )
          control.write_bytes(control_bytes)

          contract_bytes = contract.read_bytes()
          state_old = b"$replacementBankHistogram['ownershipstate'] -ne 44"
          state_new = b"$replacementBankHistogram['ownershipstate'] -ne 47"
          message_old = b'expected 44/12.'
          message_new = b'expected 47/12.'

          if contract_bytes.count(state_old) != 1:
              raise SystemExit(f'Expected exactly one OwnershipState 44 fence, found {contract_bytes.count(state_old)}')
          if contract_bytes.count(message_old) != 1:
              raise SystemExit(f'Expected exactly one 44/12 diagnostic, found {contract_bytes.count(message_old)}')
          if contract_bytes.count(state_new) != 0 or contract_bytes.count(message_new) != 0:
              raise SystemExit('47/12 fence already exists before one-shot repair; refusing ambiguous rewrite')

          contract_bytes = contract_bytes.replace(state_old, state_new, 1)
          contract_bytes = contract_bytes.replace(message_old, message_new, 1)

          semantic_count_old = b'6714'
          semantic_count_new = b'7015'
          count_positions = [match.start() for match in re.finditer(semantic_count_old, contract_bytes)]
          if len(count_positions) != 2:
              raise SystemExit(f'Expected exactly two verifier 6714 tokens for the replacement semantic inventory, found {len(count_positions)}')
          for position in count_positions:
              context = contract_bytes[max(0, position - 512):min(len(contract_bytes), position + 512)].lower()
              if b'replacement' not in context or b'semantic' not in context:
                  raise SystemExit('A 6714 token is not bounded by replacement semantic-inventory context; refusing rewrite')
          contract_bytes = contract_bytes.replace(semantic_count_old, semantic_count_new, 2)

          old_semantic_hash = b'3386CCD85F63DEE01ABD5C06B82E2F4591179998E07D05B62DF4D816CCFF6D2B'
          new_semantic_hash = b'2270D6D53A5ACDE045AA830AEE7720DBA4C74BBEADCE19ED281DC8A1A7ABF664'
          if contract_bytes.count(old_semantic_hash) != 1:
              raise SystemExit(f'Expected exactly one old replacement semantic SHA-256, found {contract_bytes.count(old_semantic_hash)}')
          hash_position = contract_bytes.index(old_semantic_hash)
          hash_context = contract_bytes[max(0, hash_position - 1024):min(len(contract_bytes), hash_position + 1024)].lower()
          if b'replacementsemantic' not in hash_context:
              raise SystemExit('Old semantic SHA-256 is not bounded by replacement semantic-inventory context; refusing rewrite')
          if contract_bytes.count(new_semantic_hash) != 0:
              raise SystemExit('New replacement semantic SHA-256 already exists before repair; refusing ambiguous rewrite')
          contract_bytes = contract_bytes.replace(old_semantic_hash, new_semantic_hash, 1)
          contract.write_bytes(contract_bytes)

          print('PASS repaired exactly two stale identity-tail strides')
          print('PASS re-baselined only OwnershipState persisted-read fence 44 -> 47')
          print('PASS preserved OwnershipIdentityState fence at 12')
          print('PASS re-baselined replacement semantic token inventory 6714 -> 7015')
          print('PASS re-baselined paired replacement semantic SHA-256')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify HOMEEX-09 static invariants after repair
        shell: powershell
        run: |
          & '.\tools\Verify-HomeDs402ExHomeex09Static.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run legacy LASAL SourceOnly contract after repair
        shell: powershell
        run: |
          & '.\LMC_Library\LMC_API_Delivery\tests\LasalMotionControlLib.Tests\Verify-LasalContract.ps1' -RepositoryRoot $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check focused diff
        shell: powershell
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --stat
          git diff -- 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCControlCommandService/LMCControlCommandService.st'
          git diff -- 'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalContract.ps1'

      - name: Commit repair and remove one-shot workflow
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/home-ds402ex-homeex09-repair-once.yml'
          git add 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCControlCommandService/LMCControlCommandService.st'
          git add 'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalContract.ps1'
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m 'fix(homeex): close HOMEEX-09 identity ratchets'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:codex/home-ds402ex-homeex09-static-qualification
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
