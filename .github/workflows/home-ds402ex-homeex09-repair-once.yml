# one-shot repair trigger: 2026-08-26 source-first repair
name: HomeDS402Ex HOMEEX-09 one-shot repair

on:
  push:
    branches:
      - codex/home-ds402ex-homeex09-static-qualification
    paths:
      - '.github/workflows/home-ds402ex-homeex09-repair-once.yml'
  pull_request:
    branches:
      - codex/home-ds402ex-homeex01-02-profile-gate
    paths:
      - '.github/workflows/home-ds402ex-homeex09-repair-once.yml'

permissions:
  contents: write

jobs:
  repair-and-prove:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/home-ds402ex-homeex09-static-qualification
          fetch-depth: 0

      - name: Apply byte-preserving HOMEEX-09 repairs
        shell: powershell
        run: |
          @'
          from pathlib import Path
          import re

          control = Path(r'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCControlCommandService/LMCControlCommandService.st')
          contract = Path(r'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalContract.ps1')

          control_bytes = control.read_bytes()
          tail_pattern = re.compile(
              br'(replacementTailOffset\s*:=\s*(?:\r?\n[ \t]*)?TO_UDINT\(probeAxisIndex\s*-\s*1\)\s*\*\s*)8(\s*;)',
              re.IGNORECASE,
          )
          repaired_pattern = re.compile(
              br'replacementTailOffset\s*:=\s*(?:\r?\n[ \t]*)?TO_UDINT\(probeAxisIndex\s*-\s*1\)\s*\*\s*LMC_OWNER_IDENTITY_AXIS_TAIL_BYTES\s*;',
              re.IGNORECASE,
          )
          tail_matches = list(tail_pattern.finditer(control_bytes))
          repaired_matches = list(repaired_pattern.finditer(control_bytes))
          if len(tail_matches) == 2 and len(repaired_matches) == 0:
              control_bytes = tail_pattern.sub(
                  br'\1LMC_OWNER_IDENTITY_AXIS_TAIL_BYTES\2',
                  control_bytes,
                  count=2,
              )
              control.write_bytes(control_bytes)
              print('PASS repaired exactly two stale identity-tail strides')
          elif len(tail_matches) == 0 and len(repaired_matches) == 2:
              print('PASS identity-tail stride source repair already committed')
          else:
              raise SystemExit(
                  f'Unexpected identity-tail source state: stale={len(tail_matches)}, repaired={len(repaired_matches)}'
              )

          contract_bytes = contract.read_bytes()
          replacements = [
              (b"$replacementBankHistogram['ownershipstate'] -ne 44", b"$replacementBankHistogram['ownershipstate'] -ne 47", 1),
              (b'expected 44/12.', b'expected 47/12.', 1),
              (b'6714', b'7015', 2),
              (b'3386CCD85F63DEE01ABD5C06B82E2F4591179998E07D05B62DF4D816CCFF6D2B', b'2270D6D53A5ACDE045AA830AEE7720DBA4C74BBEADCE19ED281DC8A1A7ABF664', 1),
              (b"@{ Name = 'adapter'; Fragment = $adapter; LF = 29124; CRLF = 29922; Sha = '8855AEEAE9B617CEAC1D10C7CC4ADB7F4D0536D108592560CE0D39ACF344AFAC' }", b"@{ Name = 'adapter'; Fragment = $adapter; LF = 29184; CRLF = 29981; Sha = '855FA45D910DAFA0EA236807A004E08EFDA080BC57A80FD433BF38F0B3B6BA01' }", 1),
              (b"@{ Name = 'helper'; Fragment = $helper; LF = 22214; CRLF = 22826; Sha = '9E0A37E0EC0A3AD7FDD194CF8691BF3B492D4E4C6FD10E8C118323571F980BDD' }", b"@{ Name = 'helper'; Fragment = $helper; LF = 22712; CRLF = 23332; Sha = 'EB2E6D61A638DE06B890613D015C0904901318C4EB6B76E63F6D0F7E7A45E527' }", 1),
              (b'$macroInventory.Count -ne 70', b'$macroInventory.Count -ne 73', 1),
              (b'$joinedMacros.Length -ne 2470', b'$joinedMacros.Length -ne 2579', 1),
              (b'367C87E07AF2C33D60F32F3E94AECF73BA052C6F3155DA909DB9EAD1BB9EAB85', b'EE120E84ED15E12CDF127EB5CC2D6438985BC4649A640686F02EA7832E16B742', 1),
              (b'$($macroInventory.Count)/70', b'$($macroInventory.Count)/73', 1),
              (b'$($joinedMacros.Length)/2470', b'$($joinedMacros.Length)/2579', 1),
              (b'$semanticTokens.Length -ne 61704', b'$semanticTokens.Length -ne 62026', 1),
              (b'44924A26D9B95E107DED81E8D65D18C8862176C833A2D08D596A8FD2F9A52BEF', b'047F9C6F409867DEC796147EEFC028E2B1C1482AD7F25D5362683A9327354E8A', 1),
              (b'$($semanticTokens.Length)/61704', b'$($semanticTokens.Length)/62026', 1),
              (b'$lexicalTokens.Count -ne 11986', b'$lexicalTokens.Count -ne 12015', 1),
              (b'$lexicalInventory.Length -ne 73689', b'$lexicalInventory.Length -ne 74040', 1),
              (b'962B62140CB69C12743CBA8F27DF14609819A246C2E917D5804BA4077123B899', b'F1F1C9AA83A139E00B19408461594F190E4AA67956E08DC413B9DC7B943B9563', 1),
              (b'$($lexicalTokens.Count)/11986', b'$($lexicalTokens.Count)/12015', 1),
              (b'$($lexicalInventory.Length)/73689', b'$($lexicalInventory.Length)/74040', 1),
          ]
          for old, new, expected_count in replacements:
              observed = contract_bytes.count(old)
              if observed != expected_count:
                  raise SystemExit(f'HOMEEX-09 ratchet precondition failed: {old[:80]!r}, found {observed}, expected {expected_count}')
              if contract_bytes.count(new) != 0:
                  raise SystemExit(f'HOMEEX-09 target ratchet already exists before one-shot repair: {new[:80]!r}')
              contract_bytes = contract_bytes.replace(old, new, expected_count)

          lexical_specs = [
              (4181, 25399, b'19E0C93B5538A8E9C361401CFAE85E23CDFFE0831422EF8174B735C57471FD50', 4181, 25498, b'9E575F9EB8826780E7BBA7592D02566D342460A2DB90CB7551EFD17E8B9CC92D'),
              (2491, 14812, b'E0A83B3502A850E0DA66DDDDFE10BBCE0F158D851292369B92A7096F3DF597E8', 2491, 14845, b'2ACCA85E9D1DB42390D0BFF3A5199DAF9C522F4E4C6F1B3439F3AEBD7D88701D'),
              (3451, 22781, b'C047EEB0042EEC4CEB2D3840E5226C1FAD420560EC90A058DAFE361546CC51F2', 3530, 23463, b'5C96D4E69C712AEFF2B02F285C2A4C135B6BA236B45E8BF124576C52203060A3'),
          ]
          for old_count, old_len, old_sha, new_count, new_len, new_sha in lexical_specs:
              pattern = re.compile(
                  rb'(Lexical\s*=\s*@\(\s*)' + str(old_count).encode() + rb'(\s*,\s*)' + str(old_len).encode() + rb'(\s*,\s*[\r\n\t ]*[\'\"])' + old_sha + rb'([\'\"]\s*\))',
                  re.IGNORECASE,
              )
              matches = list(pattern.finditer(contract_bytes))
              if len(matches) != 1:
                  raise SystemExit(f'Publish-split lexical baseline precondition failed for {old_count}/{old_len}: found {len(matches)}')
              contract_bytes = pattern.sub(
                  lambda match: match.group(1) + str(new_count).encode() + match.group(2) + str(new_len).encode() + match.group(3) + new_sha + match.group(4),
                  contract_bytes,
                  count=1,
              )

          contract.write_bytes(contract_bytes)

          print('PASS re-baselined OwnershipState persisted-read fence 44 -> 47; identity fence remains 12')
          print('PASS re-baselined replacement semantic inventory and rollback-split byte/hash ratchets')
          print('PASS re-baselined publish referenced-macro closure 70/2470 -> 73/2579')
          print('PASS re-baselined three publish-split lexical inventories')
          print('PASS re-baselined reserve semantic and lexical inventories')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify HOMEEX-09 static invariants after repair
        shell: powershell
        run: |
          & '.\tools\Verify-HomeDs402ExHomeex09Static.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit confirmed LASAL source repair first
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCControlCommandService/LMCControlCommandService.st'
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'PASS LASAL source repair already committed; no source-only commit needed.'
            exit 0
          }
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m 'fix(homeex): repair per-axis identity tail stride'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:codex/home-ds402ex-homeex09-static-qualification
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run legacy LASAL SourceOnly contract after repair
        shell: powershell
        run: |
          & '.\LMC_Library\LMC_API_Delivery\tests\LasalMotionControlLib.Tests\Verify-LasalContract.ps1' -RepositoryRoot $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check focused diff
        shell: powershell
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --stat

      - name: Commit verifier repair and remove one-shot diagnostics
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/home-ds402ex-homeex09-repair-once.yml'
          git rm '.github/workflows/homeex09-ratchet-inspect.yml'
          git add 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCControlCommandService/LMCControlCommandService.st'
          git add 'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/Verify-LasalContract.ps1'
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m 'test(homeex): close HOMEEX-09 identity ratchets'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:codex/home-ds402ex-homeex09-static-qualification
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
