name: HomeDS402 H37 recovery key assertion repair once

on:
  push:
    branches:
      - codex/home-ds402-h37-source-qualification
    paths:
      - '.github/workflows/home-ds402-h37-recovery-key-assert-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace reference equality with exact field assertions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'LMC_Library/LasalApiWpfTestApp/LasalApiWpfTestApp.SmokeTests/WpfMaintenanceActionIntegrationTests.cs'
          $text = [IO.File]::ReadAllText($path).Replace("`r`n", "`n")
          $lf = "`n"
          $old = [string]::Join($lf, @(
            '                    AssertEx.True(',
            '                        expected.Equals(restored),',
            '                        "DS402 Home relaunch did not restore the exact recovery key before the first outcome query.");'
          ))
          $new = [string]::Join($lf, @(
            '                    AssertEx.Equal(expected.SchemaVersion, restored.SchemaVersion);',
            '                    AssertEx.Equal(expected.RequestId, restored.RequestId);',
            '                    AssertEx.Equal(',
            '                        expected.DiagnosticsBuild,',
            '                        restored.DiagnosticsBuild);',
            '                    AssertEx.Equal(',
            '                        expected.DiagnosticsBootId,',
            '                        restored.DiagnosticsBootId);',
            '                    AssertEx.Equal(expected.MapRevision, restored.MapRevision);',
            '                    AssertEx.Equal(',
            '                        expected.ClientIntentId.Word0,',
            '                        restored.ClientIntentId.Word0);',
            '                    AssertEx.Equal(',
            '                        expected.ClientIntentId.Word1,',
            '                        restored.ClientIntentId.Word1);',
            '                    AssertEx.Equal(',
            '                        expected.ClientIntentId.Word2,',
            '                        restored.ClientIntentId.Word2);',
            '                    AssertEx.Equal(',
            '                        expected.ClientIntentId.Word3,',
            '                        restored.ClientIntentId.Word3);',
            '                    AssertEx.Equal(',
            '                        expected.AxisReference,',
            '                        restored.AxisReference);',
            '                    AssertEx.Equal(',
            '                        expected.Parameters.HomingMethod,',
            '                        restored.Parameters.HomingMethod);',
            '                    AssertEx.Equal(',
            '                        expected.Parameters.Position,',
            '                        restored.Parameters.Position);',
            '                    AssertEx.Equal(',
            '                        expected.Parameters.Velocity,',
            '                        restored.Parameters.Velocity);',
            '                    AssertEx.Equal(',
            '                        expected.Parameters.Acceleration,',
            '                        restored.Parameters.Acceleration);',
            '                    AssertEx.Equal(',
            '                        expected.Parameters.DistanceLimit,',
            '                        restored.Parameters.DistanceLimit);',
            '                    AssertEx.Equal(',
            '                        expected.Parameters.TorqueLimit,',
            '                        restored.Parameters.TorqueLimit);',
            '                    AssertEx.Equal(',
            '                        expected.Parameters.BufferMode,',
            '                        restored.Parameters.BufferMode);',
            '                    AssertEx.Equal(',
            '                        expected.Parameters.TimeoutMilliseconds,',
            '                        restored.Parameters.TimeoutMilliseconds);'
          ))

          $count = ([regex]::Matches($text, [regex]::Escape($old))).Count
          if ($count -ne 1) { throw "Expected one recovery-key reference equality assertion, found $count." }
          $text = $text.Replace($old, $new)
          if ($text.Contains('expected.Equals(restored)')) {
            throw 'Reference equality assertion still remains.'
          }
          [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($false))

      - name: Remove one-shot workflow
        shell: pwsh
        run: |
          Remove-Item -LiteralPath '.github/workflows/home-ds402-h37-recovery-key-assert-once.yml' -Force

      - name: Diff hygiene
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff -- LMC_Library/LasalApiWpfTestApp/LasalApiWpfTestApp.SmokeTests/WpfMaintenanceActionIntegrationTests.cs .github/workflows/home-ds402-h37-recovery-key-assert-once.yml

      - name: Commit assertion repair
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- LMC_Library/LasalApiWpfTestApp/LasalApiWpfTestApp.SmokeTests/WpfMaintenanceActionIntegrationTests.cs .github/workflows/home-ds402-h37-recovery-key-assert-once.yml
          if (git diff --cached --quiet) { throw 'Expected H37 assertion repair diff is empty.' }
          git commit -m 'test(h37): compare restored DS402 key by value'
          git push origin HEAD:codex/home-ds402-h37-source-qualification
