name: MODE-06 PR patch retry 3

on:
  pull_request:
    branches:
      - dev
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Extract corrected exact patch script
        run: |
          ruby -e 'require "yaml"; y=YAML.load_file(".github/workflows/mode06_owner_tcp_patch.yml"); puts y["jobs"]["patch"]["steps"][1]["run"]' > /tmp/mode06_patch.py
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('/tmp/mode06_patch.py')
          s = p.read_text()
          def set_expected(text, label, next_label, value):
              start = text.find(f"('{label}',")
              end = text.find(f"('{next_label}',", start)
              if start < 0 or end < 0:
                  raise SystemExit(f'patch block not found: {label}')
              block = text[start:end]
              block2, count = re.subn(r', 1\),(\s*)$', f', {value}),\\1', block, count=1)
              if count != 1:
                  raise SystemExit(f'expected-count tail mismatch for {label}: {count}')
              return text[:start] + block2 + text[end:]
          s = set_expected(s, 'validate tuple', 'validate active state', 2)
          s = set_expected(s, 'validate active state', 'commit active state', 2)
          p.write_text(s)
          PY
          python /tmp/mode06_patch.py
      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "openai-codex[bot]"
          git config user.email "openai-codex[bot]@users.noreply.github.com"
          git add Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCControlCommandService/LMCControlCommandService.st
          git add Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/TCPMotionInterface/TCPMotionInterface.st
          git rm .github/workflows/mode06_owner_tcp_patch.yml
          git rm .github/workflows/mode06_pr_patch.yml
          git rm .github/workflows/mode06_pr_retry.yml
          git rm .github/workflows/mode06_pr_retry2.yml
          git rm .github/workflows/mode06_pr_retry3.yml
          git rm .mode06-trigger
          git commit -m "feat(mode): wire SetOperationMode ownership admission"
          git push origin HEAD:${{ github.head_ref }}
