name: SDO-R05 full identity promotion

on:
  push:
    branches:
      - codex/sdo-r05-generic-durable-current-dev
    paths:
      - 'tools/Apply-SdoR05FullIdentity.py'
      - 'tools/Apply-SdoR05FullIdentityWpfFixture.py'
      - '.github/workflows/sdo-r05-full-identity-promotion.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: microsoft/setup-msbuild@v2

      - name: Apply R05-B full identity patch
        shell: powershell
        run: python .\tools\Apply-SdoR05FullIdentity.py

      - name: Apply R05-B WPF v3 recovery fixture
        shell: powershell
        run: python .\tools\Apply-SdoR05FullIdentityWpfFixture.py

      - name: Verify focused source contract
        shell: powershell
        run: .\tools\Verify-SdoR05FullIdentity.ps1

      - name: Build API tests Debug
        shell: powershell
        run: msbuild .\LMC_Library\LMC_API_Delivery\tests\LasalMotionControlLib.Tests\LasalMotionControlLib.Tests.csproj /t:Build /p:Configuration=Debug /m

      - name: Run API tests
        shell: powershell
        run: .\LMC_Library\LMC_API_Delivery\tests\LasalMotionControlLib.Tests\bin\Debug\LasalMotionControlLib.Tests.exe

      - name: Build WPF smoke Debug
        shell: powershell
        run: msbuild .\LMC_Library\LasalApiWpfTestApp\LasalApiWpfTestApp.SmokeTests\LasalApiWpfTestApp.SmokeTests.csproj /t:Build /p:Configuration=Debug /m

      - name: Run Generic SDO WPF smoke
        shell: powershell
        run: .\LMC_Library\LasalApiWpfTestApp\LasalApiWpfTestApp.SmokeTests\bin\Debug\LasalApiWpfTestApp.SmokeTests.exe --filter 'Wpf.Sdo.'

      - name: Build API tests Release
        shell: powershell
        run: msbuild .\LMC_Library\LMC_API_Delivery\tests\LasalMotionControlLib.Tests\LasalMotionControlLib.Tests.csproj /t:Build /p:Configuration=Release /m

      - name: Build WPF smoke Release
        shell: powershell
        run: msbuild .\LMC_Library\LasalApiWpfTestApp\LasalApiWpfTestApp.SmokeTests\LasalApiWpfTestApp.SmokeTests.csproj /t:Build /p:Configuration=Release /m

      - name: Diff hygiene
        shell: powershell
        run: git diff --check

      - name: Commit R05-B implementation
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- `
            'LMC_Library/LasalApiWpfTestApp/LasalApiWpfTestApp/DiagnosticsMutationJournal.cs' `
            'LMC_Library/LasalApiWpfTestApp/LasalApiWpfTestApp/MainWindow.MutationJournal.cs' `
            'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/DiagnosticsMutationJournalTests.cs' `
            'LMC_Library/LasalApiWpfTestApp/LasalApiWpfTestApp.SmokeTests/WpfMainWindowIntegrationTests.cs' `
            'docs/api/design/SDO_OPERATION_MODE_REIMPLEMENTATION_PLAN_20260827.md' `
            'tools/Verify-SdoR05FullIdentity.ps1'
          if (-not (git diff --cached --quiet)) {
            git commit -m 'feat(sdo): bind durable recovery to full connection identity'
            git push origin HEAD:codex/sdo-r05-generic-durable-current-dev
          }
