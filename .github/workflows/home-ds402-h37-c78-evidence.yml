name: HomeDS402 H37 C78 evidence tool

on:
  push:
    branches:
      - dev
      - codex/home-ds402-h37-source-qualification
    paths:
      - 'tools/Capture-HomeDs402H37C78Evidence.ps1'
      - 'tools/Verify-HomeDs402H37Activation.ps1'
      - 'tools/Verify-HomeDs402H37Ownership.ps1'
      - 'tools/Verify-HomeDs402H37MethodSize.ps1'
      - 'docs/api/design/HOME_DS402_DESIGN.md'
      - 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/Classes.lcb'
      - 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Elmo_EtherCAT_Test_4Axis.lcb'
      - 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Network/Networks.lcb'
      - '.github/workflows/home-ds402-h37-c78-evidence.yml'
  pull_request:
    branches:
      - dev
    paths:
      - 'tools/Capture-HomeDs402H37C78Evidence.ps1'
      - 'tools/Verify-HomeDs402H37Activation.ps1'
      - 'tools/Verify-HomeDs402H37Ownership.ps1'
      - 'tools/Verify-HomeDs402H37MethodSize.ps1'
      - 'docs/api/design/HOME_DS402_DESIGN.md'
      - 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/Classes.lcb'
      - 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Elmo_EtherCAT_Test_4Axis.lcb'
      - 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Network/Networks.lcb'
      - '.github/workflows/home-ds402-h37-c78-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collector-self-test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Report tracked artifact physical identity
        shell: powershell
        run: |
          $artifacts = @(
            '.\Lasal_PRG\Elmo_EtherCAT_Test_4Axis\Class\Classes.lcb',
            '.\Lasal_PRG\Elmo_EtherCAT_Test_4Axis\Elmo_EtherCAT_Test_4Axis.lcb',
            '.\Lasal_PRG\Elmo_EtherCAT_Test_4Axis\Network\Networks.lcb'
          )
          foreach ($path in $artifacts) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required H37 artifact is missing: $path"
            }
            $item = Get-Item -LiteralPath $path
            $sha = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToUpperInvariant()
            $blob = (& git hash-object -- $path).Trim()
            Write-Host ("H37_ARTIFACT {0} bytes={1} sha256={2} git_blob={3}" -f $path, $item.Length, $sha, $blob)
          }

      - name: Self-test fresh C78 evidence collector
        shell: powershell
        run: |
          & '.\tools\Capture-HomeDs402H37C78Evidence.ps1' -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify production activation remains OFF
        shell: powershell
        run: |
          & '.\tools\Verify-HomeDs402H37Activation.ps1' -RepositoryRoot (Get-Location).Path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Diff hygiene
        shell: powershell
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            git diff --check "origin/$env:GITHUB_BASE_REF...HEAD"
          }
          elseif ($env:GITHUB_EVENT_NAME -eq 'push') {
            git diff --check HEAD^ HEAD
          }
          else {
            git diff --check
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
