name: Hardware finding corrective promotion

on:
  push:
    branches:
      - codex/fix-opmode-sdo-hw-findings
    paths:
      - 'tools/Apply-HardwareFindingFix.py'
      - 'tools/Verify-HardwareFindingFix.ps1'
      - '.github/workflows/hardware-finding-corrective-promotion.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: microsoft/setup-msbuild@v2

      - name: Apply hardware finding corrective patch
        shell: powershell
        run: python .\tools\Apply-HardwareFindingFix.py

      - name: Verify corrective source contract
        shell: powershell
        run: .\tools\Verify-HardwareFindingFix.ps1

      - name: Verify generic SDO policy contract
        shell: powershell
        run: .\LMC_Library\LMC_API_Delivery\tests\LasalMotionControlLib.Tests\Verify-LasalGenericSdoWrite.ps1

      - name: Build API tests Debug
        shell: powershell
        run: msbuild .\LMC_Library\LMC_API_Delivery\tests\LasalMotionControlLib.Tests\LasalMotionControlLib.Tests.csproj /t:Build /p:Configuration=Debug /m

      - name: Run API tests
        shell: powershell
        run: .\LMC_Library\LMC_API_Delivery\tests\LasalMotionControlLib.Tests\bin\Debug\LasalMotionControlLib.Tests.exe

      - name: Build WPF smoke Debug
        shell: powershell
        run: msbuild .\LMC_Library\LasalApiWpfTestApp\LasalApiWpfTestApp.SmokeTests\LasalApiWpfTestApp.SmokeTests.csproj /t:Build /p:Configuration=Debug /m

      - name: Run Generic SDO WPF smoke
        shell: powershell
        run: .\LMC_Library\LasalApiWpfTestApp\LasalApiWpfTestApp.SmokeTests\bin\Debug\LasalApiWpfTestApp.SmokeTests.exe --filter 'Wpf.Sdo.'

      - name: Build API tests Release
        shell: powershell
        run: msbuild .\LMC_Library\LMC_API_Delivery\tests\LasalMotionControlLib.Tests\LasalMotionControlLib.Tests.csproj /t:Build /p:Configuration=Release /m

      - name: Build WPF smoke Release
        shell: powershell
        run: msbuild .\LMC_Library\LasalApiWpfTestApp\LasalApiWpfTestApp.SmokeTests\LasalApiWpfTestApp.SmokeTests.csproj /t:Build /p:Configuration=Release /m

      - name: Diff hygiene
        shell: powershell
        run: git diff --check

      - name: Commit corrective implementation
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- `
            'LMC_Library/LasalApiWpfTestApp/LasalApiWpfTestApp/MainWindow.Diagnostics.cs' `
            'LMC_Library/LasalApiWpfTestApp/LasalApiWpfTestApp/MainWindow.Qualification.Sdo.cs' `
            'LMC_Library/LasalApiWpfTestApp/LasalApiWpfTestApp/MainWindow.AxisSetOperationModeRecovery.cs' `
            'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCDiagnosticsService/LMCDiagnosticsService.st' `
            'docs/api/design/SDO_OPERATION_MODE_REIMPLEMENTATION_PLAN_20260827.md' `
            'tools/Verify-HardwareFindingFix.ps1'
          if (-not (git diff --cached --quiet)) {
            git commit -m 'fix(hw): correct Operation Mode and generic SDO preflight'
            git push origin HEAD:codex/fix-opmode-sdo-hw-findings
          }
