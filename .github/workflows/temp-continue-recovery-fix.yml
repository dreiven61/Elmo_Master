name: Temporary ownership baseline comparison

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/temp-continue-recovery-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-sourceonly:
    runs-on: windows-latest
    steps:
      - name: Checkout history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev

      - name: Compare repository SourceOnly first blocker
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $repoRoot = (Get-Location).Path
          $refs = @(
            @{ Name = 'pre-recovery-fix'; Sha = '5c405881381c51aca09b7bf00393ea383c371e29' },
            @{ Name = 'current'; Sha = '${{ github.event.after }}' }
          )

          foreach ($item in $refs) {
            Write-Host "===== BEGIN $($item.Name) $($item.Sha) ====="
            git checkout --force $item.Sha
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $output = New-Object System.Collections.Generic.List[string]
            $code = 0
            try {
              & '.\LMC_Library\LMC_API_Delivery\tests\LasalMotionControlLib.Tests\Verify-LasalContract.ps1' `
                -RepositoryRoot $repoRoot `
                -SourceOnly `
                -ExpectedSdoWriteAxis 1 2>&1 |
                ForEach-Object {
                  $text = $_ | Out-String
                  [void]$output.Add($text.TrimEnd())
                  Write-Host $_
                }
              $code = $LASTEXITCODE
            }
            catch {
              $text = $_ | Out-String
              [void]$output.Add($text.TrimEnd())
              Write-Host $text
              $code = 1
            }

            $joined = [string]::Join("`n", $output)
            $d2 = $joined.Contains('ordinary safety-repeat self-test did not accept the exact same retained identity tuple after ACTIVE')
            $c78 = $joined.Contains('SetPosition-augmented Classes.lcb physical identity drifted')
            Write-Host "RESULT name=$($item.Name) exit=$code D2=$d2 C78=$c78"
            Write-Host "===== END $($item.Name) ====="
          }

          exit 0
