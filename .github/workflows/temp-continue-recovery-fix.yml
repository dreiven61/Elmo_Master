name: Temporary recovery fix continuation

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/temp-continue-recovery-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-verify-commit:
    runs-on: windows-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev

      - name: Apply focused fixes
        shell: powershell
        run: |
          @'
          from pathlib import Path
          import re

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {actual}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          def replace_regex(path, pattern, replacement, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              updated, actual = re.subn(pattern, replacement, text, count=count, flags=re.MULTILINE)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} regex replacement(s), found {actual}')
              p.write_text(updated, encoding='utf-8')

          ledger = r'LMC_Library/LasalApiWpfTestApp/LasalApiWpfTestApp/RecoveryRecordRetirementLedger.cs'
          replace_regex(
              ledger,
              r'(?m)^\s*var temporaryPath = finalPath\s*\n\s*\+ "\."\s*\n\s*\+ Guid\.NewGuid\(\)\.ToString\("N"\)\s*\n\s*\+ "\.tmp";',
              '            var temporaryPath = Path.Combine(\n                directoryPath,\n                ".retirement-"\n                    + Guid.NewGuid().ToString("N")\n                    + ".tmp");')

          localization = r'LMC_Library/LasalApiWpfTestApp/LasalApiWpfTestApp/UiLocalization.cs'
          replace_exact(localization, '"Mode Capability 새로고침"', '"Mode capability 새로고침"')
          replace_exact(localization, '"HomeEx Capability 새로고침"', '"HomeEx capability 새로고침"')

          diagnostics = r'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCDiagnosticsService/LMCDiagnosticsService.st'
          replace_regex(
              diagnostics,
              r'(?m)^(\s*)<Client Name="AxisOwnership" Required="true" Internal="false"/>\s*\n\s*<Client Name="InputLatch" Required="true" Internal="false"/>',
              r'\1<Client Name="InputLatch" Required="true" Internal="false"/>\n\1<Client Name="AxisOwnership" Required="true" Internal="false"/>')

          workflow = r'.github/workflows/set-operation-mode-static-qualification.yml'
          replace_exact(
              workflow,
              "& '.\\tools\\Verify-SetOperationModeStatic.ps1' -ExpectedSdoWriteAxis 1",
              "& '.\\tools\\Verify-SetOperationModeStatic.ps1' -ExpectedSdoWriteAxis 1 -QualificationActivation")
          '@ | python -

      - name: Locate MSBuild
        id: msbuild
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($msbuild)) { throw 'MSBuild.exe not found.' }
          "path=$msbuild" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build and run focused WPF Debug
        shell: powershell
        run: |
          $project = '.\LMC_Library\LasalApiWpfTestApp\LasalApiWpfTestApp.SmokeTests\LasalApiWpfTestApp.SmokeTests.csproj'
          & '${{ steps.msbuild.outputs.path }}' $project /t:Build /p:Configuration=Debug /p:Platform=AnyCPU /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = '.\LMC_Library\LasalApiWpfTestApp\LasalApiWpfTestApp.SmokeTests\bin\Debug\LasalApiWpfTestApp.SmokeTests.exe'
          & $exe --filter RecoveryRetirement
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe --filter SetOperationMode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and run focused WPF Release
        shell: powershell
        run: |
          $project = '.\LMC_Library\LasalApiWpfTestApp\LasalApiWpfTestApp.SmokeTests\LasalApiWpfTestApp.SmokeTests.csproj'
          & '${{ steps.msbuild.outputs.path }}' $project /t:Build /p:Configuration=Release /p:Platform=AnyCPU /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = '.\LMC_Library\LasalApiWpfTestApp\LasalApiWpfTestApp.SmokeTests\bin\Release\LasalApiWpfTestApp.SmokeTests.exe'
          & $exe --filter RecoveryRetirement
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe --filter SetOperationMode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify SetOperationMode qualification-active source
        shell: powershell
        run: |
          & '.\tools\Verify-SetOperationModeStatic.ps1' -ExpectedSdoWriteAxis 1 -QualificationActivation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & '.\tools\Verify-SetOperationModeDefineOrder.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Diff hygiene
        shell: powershell
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git status --short

      - name: Commit verified fixes to dev
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'LMC_Library/LasalApiWpfTestApp/LasalApiWpfTestApp/RecoveryRecordRetirementLedger.cs' 'LMC_Library/LasalApiWpfTestApp/LasalApiWpfTestApp/UiLocalization.cs' 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCDiagnosticsService/LMCDiagnosticsService.st' '.github/workflows/set-operation-mode-static-qualification.yml'
          git commit -m 'fix(wpf): complete stale recovery retirement flow'
          git push origin HEAD:dev
