name: Temporary post-SetOperationMode docs sync

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/temp-continue-recovery-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev

      - name: Apply documentation sync
        shell: powershell
        run: |
          python .\tools\Sync-PostSetOpModeDocs.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Ensure pandoc
        shell: powershell
        run: |
          $pandoc = Get-Command pandoc -ErrorAction SilentlyContinue
          if (-not $pandoc) {
            choco install pandoc --version=3.1.3 -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:Path = "C:\Program Files\Pandoc;${env:Path}"
          }
          pandoc --version | Select-Object -First 1

      - name: Regenerate HTML manuals
        shell: powershell
        run: |
          pandoc .\docs\api\API_MANUAL.md -o .\docs\api\API_MANUAL.html
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pandoc .\docs\api\API_DEVELOPMENT_PROGRESS.md -o .\docs\api\API_DEVELOPMENT_PROGRESS.html
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate current markers and diff
        shell: powershell
        run: |
          $manual = Get-Content -LiteralPath '.\docs\api\API_MANUAL.md' -Raw -Encoding UTF8
          $progress = Get-Content -LiteralPath '.\docs\api\API_DEVELOPMENT_PROGRESS.md' -Raw -Encoding UTF8
          $snapshot = Get-Content -LiteralPath '.\docs\api\design\DEVELOPMENT_STATUS_20260901.md' -Raw -Encoding UTF8
          if (-not $manual.Contains('2.6-development')) { throw 'Manual version marker missing.' }
          if (-not $progress.Contains('SetOperationMode 완료 checkpoint')) { throw 'Progress completion marker missing.' }
          if (-not $snapshot.Contains('SetOperationMode COMPLETE')) { throw 'Current snapshot marker missing.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git status --short

      - name: Commit synchronized documentation
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- `
            'docs/api/API_MANUAL.md' `
            'docs/api/API_MANUAL.html' `
            'docs/api/API_DEVELOPMENT_PROGRESS.md' `
            'docs/api/API_DEVELOPMENT_PROGRESS.html' `
            'docs/api/design/README.md' `
            'docs/api/design/SET_OPERATION_MODE_DESIGN.md' `
            'docs/api/design/SET_OPERATION_MODE_READBACK_SETTLING_FIX_20260831.md' `
            'docs/api/design/DEVELOPMENT_STATUS_20260901.md'
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Documentation already synchronized.'
            exit 0
          }
          git commit -m 'docs(api): close SetOperationMode and reprioritize roadmap'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:dev
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
