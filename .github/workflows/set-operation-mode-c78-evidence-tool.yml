name: SetOperationMode C78 evidence tool

on:
  pull_request:
    branches:
      - dev
    paths:
      - 'tools/Capture-SetOperationModeC78Evidence.ps1'
      - '.github/workflows/set-operation-mode-c78-evidence-tool.yml'
  push:
    branches:
      - dev
    paths:
      - 'tools/Capture-SetOperationModeC78Evidence.ps1'
      - '.github/workflows/set-operation-mode-c78-evidence-tool.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collector-self-test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-test fresh C78 evidence collector
        shell: powershell
        run: |
          & '.\tools\Capture-SetOperationModeC78Evidence.ps1' -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Diff hygiene
        shell: powershell
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            git diff --check "origin/$env:GITHUB_BASE_REF...HEAD"
          }
          elseif ($env:GITHUB_EVENT_NAME -eq 'push') {
            git diff --check HEAD^ HEAD
          }
          else {
            git diff --check
          }
