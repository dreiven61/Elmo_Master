name: MODE-06 diagnostics executor patch

on:
  pull_request:
    branches:
      - dev
    types:
      - opened

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'codex/mode-06-diagnostics-executor'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/mode-06-diagnostics-executor
          fetch-depth: 0

      - name: Apply exact LASAL implementation patch
        run: python .github/mode06/apply.py

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCDiagnosticsService/LMCDiagnosticsService.st"
          grep -q 'ProcessAxisSetOperationMode();' Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCDiagnosticsService/LMCDiagnosticsService.st
          test "$(grep -c 'ObjectIndex:=0x6060' Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCDiagnosticsService/LMCDiagnosticsService.st)" -eq 4

      - name: Commit source and remove patch scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-codex[bot]"
          git config user.email "openai-codex[bot]@users.noreply.github.com"
          git add Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCDiagnosticsService/LMCDiagnosticsService.st
          git rm -r .github/mode06
          git rm .github/workflows/mode06-diagnostics-executor-patch.yml
          git diff --cached --check
          git commit -m "feat(mode): implement SetOperationMode diagnostics executor"
          git push origin HEAD:codex/mode-06-diagnostics-executor
