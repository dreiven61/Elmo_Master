name: Apply all-object SDO Write policy patch

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/sdo-write-all-objects-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply policy changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re
          import subprocess

          root = Path('.')
          changed = set()

          def write_if_changed(path, text):
              path = Path(path)
              old = path.read_text(encoding='utf-8')
              if old != text:
                  path.write_text(text, encoding='utf-8', newline='')
                  changed.add(path.as_posix())
                  return True
              return False

          def replace_exact(path, old, new, expected=1):
              path = Path(path)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise RuntimeError(f'{path}: expected {expected} exact match(es), found {count}')
              write_if_changed(path, text.replace(old, new))

          # SDK: keep the compatibility helper but remove the ObjectIndex denylist.
          model = Path('LMC_Library/LMC_API_Delivery/src/LmcDiagnosticsD5Models.cs')
          old_unsafe = '''        internal static bool IsPermanentlyUnsafeObject(ushort objectIndex)\n        {\n            switch (objectIndex)\n            {\n                case 0x6040:\n                case 0x6060:\n                case 0x607A:\n                case 0x60FF:\n                case 0x6071:\n                case 0x3204:\n                case 0x20FC:\n                    return true;\n                default:\n                    return false;\n            }\n        }\n'''
          new_unsafe = '''        internal static bool IsPermanentlyUnsafeObject(ushort objectIndex)\n        {\n            // Generic SDO Write no longer denies valid object addresses by\n            // ObjectIndex. ObjectIndex 0 remains invalid in request validation.\n            return false;\n        }\n'''
          replace_exact(model, old_unsafe, new_unsafe)

          text = model.read_text(encoding='utf-8')
          text = text.replace(
              '"Direct motion/control objects cannot be approved for SDO Write."',
              '"ObjectIndex 0 is invalid for SDO Write."')
          text = text.replace(
              '"Direct motion/control objects cannot be written through generic SDO Write."',
              '"ObjectIndex 0 is invalid for SDO Write."')
          # Remove now-dead central deny branch so policy intent is explicit.
          text = re.sub(
              r'(?ms)^            if \(LMCSdoRequest\.IsPermanentlyUnsafeObject\(request\.ObjectIndex\)\)\r?\n'
              r'            \{\r?\n'
              r'.*?^            \}\r?\n\r?\n',
              '',
              text,
              count=1)
          write_if_changed(model, text)

          # SDK submit boundary: remove the duplicate address-deny branch. Other
          # request shape, session, capability and identity-pinned checks remain.
          d5 = Path('LMC_Library/LMC_API_Delivery/src/LmcDiagnosticsD5.cs')
          d5_text = d5.read_text(encoding='utf-8')
          d5_new, n = re.subn(
              r'(?ms)^            if \(LMCSdoRequest\.IsPermanentlyUnsafeObject\(request\.ObjectIndex\)\)\r?\n'
              r'            \{\r?\n'
              r'.*?^            \}\r?\n\r?\n',
              '',
              d5_text,
              count=1)
          if n != 1:
              raise RuntimeError(f'{d5}: duplicate SDO address deny branch not found exactly once')
          write_if_changed(d5, d5_new)

          # WPF durable journal: address choice itself must not reject the former
          # DS402/dedicated-owner objects. Journal/no-replay semantics stay intact.
          journal_paths = [
              Path('LMC_Library/LasalApiWpfTestApp/LasalApiWpfTestApp/DiagnosticsMutationJournal.cs'),
              Path('LMC_Library/LMC_API_Distribution/02_Example_Program/LasalApiWpfTestApp/DiagnosticsMutationJournal.cs'),
          ]
          for journal in journal_paths:
              text = journal.read_text(encoding='utf-8')
              pattern = re.compile(
                  r'(?ms)^        private static bool IsPermanentlyUnsafeObject\(ushort objectIndex\)\r?\n'
                  r'        \{\r?\n'
                  r'.*?^        \}\r?\n')
              replacement = (
                  '        private static bool IsPermanentlyUnsafeObject(ushort objectIndex)\n'
                  '        {\n'
                  '            // Address selection is not denylisted for generic SDO Write.\n'
                  '            return false;\n'
                  '        }\n')
              new_text, n = pattern.subn(replacement, text, count=1)
              if n != 1:
                  raise RuntimeError(f'{journal}: durable journal unsafe-object helper not found')
              write_if_changed(journal, new_text)

          # LASAL PLC: remove the identical DetailCode=8 object-address deny block
          # from every real LMCDiagnosticsService source copy. Shape, global gate,
          # slave range, safe-axis snapshot and execution-time revalidation remain.
          st_patched = 0
          for st in root.rglob('LMCDiagnosticsService.st'):
              p = st.as_posix()
              if '/docs/' in p or '/history/' in p or '/tests/' in p:
                  continue
              text = st.read_text(encoding='utf-8')
              if 'FUNCTION LMCDiagnosticsService::GetSdoWritePolicyDetail' not in text:
                  continue
              marker = '// 0x6060 is owned exclusively by the SetOperationMode lifecycle.'
              generic = '// Generic scalar D5 Write is admitted by request shape and semantic'
              start_marker = text.find(marker)
              if start_marker < 0:
                  continue
              generic_marker = text.find(generic, start_marker)
              if generic_marker < 0:
                  raise RuntimeError(f'{st}: generic SDO policy marker missing after deny block')
              start = text.rfind('\n', 0, start_marker) + 1
              end = text.rfind('\n', 0, generic_marker) + 1
              indent = text[start:start_marker]
              replacement = (
                  indent + '// Generic D5 SDO Write has no ObjectIndex denylist. Valid nonzero\n' +
                  indent + '// CoE object indices are admitted by request shape and the remaining\n' +
                  indent + '// session/capability/safe-axis execution guards.\n')
              text = text[:start] + replacement + text[end:]
              write_if_changed(st, text)
              st_patched += 1
          if st_patched < 1:
              raise RuntimeError('No real LMCDiagnosticsService.st source was patched')

          # SDK regression: the seven formerly blocked addresses are now valid
          # generic Write addresses (subject to the normal scalar policy).
          contract = Path('LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/DiagnosticsD5ContractTests.cs')
          ctext = contract.read_text(encoding='utf-8')
          old_loop = '''            foreach (var blockedObject in new ushort[]\n            {\n                0x6040, 0x6060, 0x607A, 0x60FF, 0x6071, 0x3204, 0x20FC\n            })\n            {\n                var blocked = LMCSdoRequest.CreateWrite(\n                    1, blockedObject, 0, LMCSignalValueType.UInt16,\n                    TestFrame.Hex("00 00"), 100);\n                AssertEx.Throws<NotSupportedException>(\n                    () => LMCDiagnosticsWritePolicy.RequireSdoWriteAllowed(blocked));\n            }\n'''
          new_loop = '''            foreach (var formerlyBlockedObject in new ushort[]\n            {\n                0x6040, 0x6060, 0x607A, 0x60FF, 0x6071, 0x3204, 0x20FC\n            })\n            {\n                var generic = LMCSdoRequest.CreateWrite(\n                    1, formerlyBlockedObject, 0, LMCSignalValueType.UInt16,\n                    TestFrame.Hex("00 00"), 100);\n                AssertEx.False(\n                    LMCSdoRequest.IsPermanentlyUnsafeObject(formerlyBlockedObject),\n                    "Generic SDO Write must not deny a valid ObjectIndex by address.");\n                LMCDiagnosticsWritePolicy.RequireSdoWriteAllowed(generic);\n            }\n'''
          if old_loop not in ctext:
              raise RuntimeError(f'{contract}: former blocked-object policy loop not found')
          write_if_changed(contract, ctext.replace(old_loop, new_loop))

          # Replace the two legacy zero-wire deny tests with positive policy tests.
          policy_test = Path('LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/DiagnosticsSdoWritePolicyEvaluationTests.cs')
          ptext = policy_test.read_text(encoding='utf-8')
          ptext = ptext.replace(
              '"Rpc.DiagnosticsD5.SdoWriteSemanticOwnerSubmitIsZeroWire"',
              '"Policy.DiagnosticsD5.SdoWriteSemanticOwnerObjectIsAllowed"')
          ptext = ptext.replace(
              '"Rpc.DiagnosticsD5.EncoderMaintenanceObjectsAreZeroWire"',
              '"Policy.DiagnosticsD5.SdoWriteEncoderMaintenanceObjectsAreAllowed"')

          first_sig = '        private static void SemanticOwnerSubmitSyncAndAsyncIsZeroWire()\n'
          second_sig = '        private static void EncoderMaintenanceObjectsSyncAndAsyncAreZeroWire()\n'
          helper_sig = '        private static LMCSdoRequest CreateEncoderMaintenanceWrite(\n'
          a = ptext.find(first_sig)
          b = ptext.find(second_sig, a)
          c = ptext.find(helper_sig, b)
          if min(a, b, c) < 0:
              raise RuntimeError(f'{policy_test}: legacy address-deny test methods not found')
          first_body = '''        private static void SemanticOwnerSubmitSyncAndAsyncIsZeroWire()\n        {\n            var request = LMCSdoRequest.CreateWrite(\n                2,\n                0x6060,\n                0,\n                LMCSignalValueType.Int8,\n                new byte[] { 8 },\n                1000);\n            AssertEx.False(LMCSdoRequest.IsPermanentlyUnsafeObject(0x6060));\n            LMCDiagnosticsWritePolicy.RequireSdoWriteAllowed(request);\n        }\n\n'''
          second_body = '''        private static void EncoderMaintenanceObjectsSyncAndAsyncAreZeroWire()\n        {\n            var requests = new[]\n            {\n                CreateEncoderMaintenanceWrite(0x3204, 0x13),\n                CreateEncoderMaintenanceWrite(0x3204, 0x14),\n                CreateEncoderMaintenanceWrite(0x20FC, 0x01),\n                CreateEncoderMaintenanceWrite(0x20FC, 0x02)\n            };\n\n            foreach (var request in requests)\n            {\n                AssertEx.False(\n                    LMCSdoRequest.IsPermanentlyUnsafeObject(request.ObjectIndex));\n                LMCDiagnosticsWritePolicy.RequireSdoWriteAllowed(request);\n            }\n        }\n\n'''
          ptext = ptext[:a] + first_body + second_body + ptext[c:]
          write_if_changed(policy_test, ptext)

          # Durable recovery metadata must accept 0x6060 as an address too.
          mutation_test = Path('LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/DiagnosticsMutationJournalTests.cs')
          mtext = mutation_test.read_text(encoding='utf-8')
          mtext = mtext.replace(
              '"Qualification.MutationJournal.SemanticModeObjectIsRejectedForDurableRecovery",\n                SemanticModeObjectIsRejectedForDurableRecovery',
              '"Qualification.MutationJournal.SemanticModeObjectIsAcceptedForDurableRecovery",\n                SemanticModeObjectIsAcceptedForDurableRecovery')
          old_method = '''        private static void SemanticModeObjectIsRejectedForDurableRecovery()\n        {\n            AssertEx.Throws<ArgumentOutOfRangeException>(\n                () => new DiagnosticsSdoWriteMutationMetadata(\n                    1,\n                    0x6060,\n                    0,\n                    LMCSignalValueType.Int8,\n                    1,\n                    1000,\n                    new byte[] { 8 }),\n                "Generic durable recovery must never make 0x6060 replayable/recoverable as raw SDO Write.");\n        }\n'''
          new_method = '''        private static void SemanticModeObjectIsAcceptedForDurableRecovery()\n        {\n            var metadata = new DiagnosticsSdoWriteMutationMetadata(\n                1,\n                0x6060,\n                0,\n                LMCSignalValueType.Int8,\n                1,\n                1000,\n                new byte[] { 8 });\n            AssertEx.Equal((ushort)0x6060, metadata.ObjectIndex);\n        }\n'''
          if old_method not in mtext:
              raise RuntimeError(f'{mutation_test}: semantic-mode durable recovery test not found')
          write_if_changed(mutation_test, mtext.replace(old_method, new_method))

          # Keep the committed distribution manifest accurate for changed files.
          manifest = Path('LMC_Library/LMC_API_Distribution/RELEASE_MANIFEST.md')
          if manifest.exists():
              manifest_text = manifest.read_text(encoding='utf-8')
              dist_root = Path('LMC_Library/LMC_API_Distribution')
              for changed_path in list(changed):
                  cp = Path(changed_path)
                  try:
                      rel = cp.relative_to(dist_root).as_posix()
                  except ValueError:
                      continue
                  data = cp.read_bytes()
                  size = len(data)
                  sha = hashlib.sha256(data).hexdigest().upper()
                  line_pattern = re.compile(
                      r'^\| `' + re.escape(rel) + r'` \| \d+ \| `[0-9A-Fa-f]+` \|$',
                      re.MULTILINE)
                  replacement = f'| `{rel}` | {size} | `{sha}` |'
                  manifest_text, n = line_pattern.subn(replacement, manifest_text, count=1)
                  if n != 1:
                      raise RuntimeError(f'{manifest}: entry not found for changed distribution file {rel}')
              write_if_changed(manifest, manifest_text)

          # Remove this one-shot workflow in the same resulting commit.
          workflow = Path('.github/workflows/sdo-write-all-objects-patch.yml')
          if workflow.exists():
              workflow.unlink()
              changed.add(workflow.as_posix())

          print('Patched files:')
          for path in sorted(changed):
              print(' -', path)
          print('LASAL service copies patched:', st_patched)
          PY

          git diff --check
          echo "Remaining active address-deny references (informational):"
          git grep -n -E 'permanently blocked for DS402|permanently UnsafeWriteBlocked|DetailCode := 8' -- \
            ':(exclude)docs/history/**' ':(exclude).github/workflows/**' || true

      - name: Commit patch to dev
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No patch changes found."
            exit 1
          fi
          git commit -m "dev: allow SDO Write for all object indices"
          git push origin HEAD:dev
