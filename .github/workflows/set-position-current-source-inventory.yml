name: SetPosition SP-C0 current source inventory

on:
  push:
    branches:
      - dev
    paths:
      - 'tools/Verify-SetPositionCurrentSourceInventory.ps1'
      - 'LMC_Library/LasalApiWpfTestApp/LasalApiWpfTestApp/AxisSetPositionRecoveryJournal.cs'
      - 'LMC_Library/LasalApiWpfTestApp/LasalApiWpfTestApp/MainWindow*.cs'
      - 'LMC_Library/LasalApiWpfTestApp/LasalApiWpfTestApp.SmokeTests/AxisSetPositionRecoveryJournalTests.cs'
      - 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCSetPositionStore/LMCSetPositionStore.st'
      - 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCControlCommandService/LMCControlCommandService.st'
      - 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/TCPMotionInterface/TCPMotionInterface.st'
      - 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCEcatInputLatch/LMCEcatInputLatch.st'
      - 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCDiagnosticsService/LMCDiagnosticsService.st'
      - 'tools/LmcSetPositionStoreDeploymentReceipt.ps1'
      - 'tools/Start-LmcSetPositionStoreDeployment.ps1'
      - 'tools/Verify-LmcSetPositionStoreDeployment.ps1'
      - '.github/workflows/set-position-current-source-inventory.yml'
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sp-c0:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify current SetPosition source inventory
        shell: powershell
        run: |
          & '.\tools\Verify-SetPositionCurrentSourceInventory.ps1' -RepositoryRoot (Get-Location).Path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build WPF smoke runner and run SetPosition journal regression
        shell: powershell
        run: |
          $project = '.\LMC_Library\LasalApiWpfTestApp\LasalApiWpfTestApp.SmokeTests\LasalApiWpfTestApp.SmokeTests.csproj'
          $exe = '.\LMC_Library\LasalApiWpfTestApp\LasalApiWpfTestApp.SmokeTests\bin\Debug\LasalApiWpfTestApp.SmokeTests.exe'
          msbuild $project /t:Build /p:Configuration=Debug /p:Platform=AnyCPU /m /nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe --filter AxisSetPositionRecoveryJournal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Diff hygiene
        if: always()
        shell: powershell
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            git diff --check "origin/$env:GITHUB_BASE_REF...HEAD"
          }
          elseif ($env:GITHUB_EVENT_NAME -eq 'push') {
            git diff --check HEAD^ HEAD
          }
          else {
            git diff --check
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
