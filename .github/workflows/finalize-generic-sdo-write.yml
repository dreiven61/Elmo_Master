name: Finalize generic SDO Write session proof

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/finalize-generic-sdo-write.yml
      - .github/scripts/finalize_generic_sdo_write.py
      - .github/scripts/fix_stale_sdo_contract_tests.py

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: microsoft/setup-msbuild@v2

      - name: Apply generic Write patch
        shell: pwsh
        run: python .github/scripts/finalize_generic_sdo_write.py

      - name: Align stale SDO contract tests
        shell: pwsh
        run: python .github/scripts/fix_stale_sdo_contract_tests.py

      - name: Validate diff
        shell: pwsh
        run: git diff --check

      - name: Run API C# tests
        shell: pwsh
        run: msbuild 'LMC_Library\LMC_API_Delivery\tests\LasalMotionControlLib.Tests\LasalMotionControlLib.Tests.csproj' /t:RunPcTests /p:Configuration=Debug /p:Platform=AnyCPU /nologo /verbosity:minimal

      - name: Build development WPF app
        shell: pwsh
        run: msbuild 'LMC_Library\LasalApiWpfTestApp\LasalApiWpfTestApp\LasalApiWpfTestApp.csproj' /t:Build /p:Configuration=Debug /p:Platform=AnyCPU /nologo /verbosity:minimal

      - name: Run WPF smoke tests
        shell: pwsh
        run: |
          $project = 'LMC_Library\LasalApiWpfTestApp\LasalApiWpfTestApp.SmokeTests\LasalApiWpfTestApp.SmokeTests.csproj'
          msbuild $project /t:RunWpfSmokeTests /p:Configuration=Debug /p:Platform=AnyCPU /nologo /verbosity:minimal
          if ($LASTEXITCODE -ne 0) {
            Write-Warning 'WPF smoke suite failed once; retrying once to separate transient process/RPC timing failures.'
            msbuild $project /t:RunWpfSmokeTests /p:Configuration=Debug /p:Platform=AnyCPU /nologo /verbosity:minimal
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Commit validated patch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/finalize-generic-sdo-write.yml'
          git rm '.github/scripts/finalize_generic_sdo_write.py'
          git rm '.github/scripts/fix_stale_sdo_contract_tests.py'
          git add 'LMC_Library/LasalApiWpfTestApp/LasalApiWpfTestApp/SdoWriteActivationQualificationProof.cs'
          git add 'LMC_Library/LasalApiWpfTestApp/LasalApiWpfTestApp.SmokeTests/SdoWriteActivationQualificationProofTests.cs'
          git add 'LMC_Library/LasalApiWpfTestApp/LasalApiWpfTestApp/MainWindow.Diagnostics.cs'
          git add 'LMC_Library/LasalApiWpfTestApp/LasalApiWpfTestApp.SmokeTests/UiLocalizationTests.cs'
          git add 'LMC_Library/LasalApiWpfTestApp/LasalApiWpfTestApp.SmokeTests/RecoveryRecordRetirementTests.cs'
          git add 'LMC_Library/LasalApiWpfTestApp/LasalApiWpfTestApp.SmokeTests/WpfMainWindowIntegrationTests.cs'
          git add 'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/DiagnosticsD5ContractTests.cs'
          git add 'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/DiagnosticsMutationJournalTests.cs'
          git add 'LMC_Library/LMC_API_Delivery/tests/LasalMotionControlLib.Tests/DiagnosticsD45CompletionContractTests.cs'
          git commit -m 'dev: finalize generic SDO Write session qualification'
          git push origin HEAD:dev
