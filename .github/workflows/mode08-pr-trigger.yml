name: MODE-08 PR patch trigger

on:
  pull_request:
    branches:
      - dev
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'codex/mode-08-owner-conflicts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mode-08-owner-conflicts
          fetch-depth: 0

      - name: Execute staged MODE-08 patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/mode08-owner-conflicts.yml').read_text(encoding='utf-8')
          lines = workflow.splitlines()
          start = lines.index("          python3 - <<'PY'") + 1
          end = lines.index('          PY', start)
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines[start:end]
          ) + '\n'
          script = script.replace(
              "if same_indent and (s == 'else' or (s.startswith('LMC_OWNER_KIND_') and s.endswith(':'))):",
              "if (s == 'end_case;') or (same_indent and (s == 'else' or (s.startswith('LMC_OWNER_KIND_') and s.endswith(':')))):")
          script = script.replace(
              "if same_indent and (s == 'else' or (re.match(r'^(0x[0-9A-Fa-f]+|[0-9]+.*):$', s) is not None)):",
              "if (s == 'end_case;') or (same_indent and (s == 'else' or (re.match(r'^(0x[0-9A-Fa-f]+|[0-9]+.*):$', s) is not None))):")
          exec(compile(script, 'mode08-owner-conflicts-embedded.py', 'exec'), {})
          PY

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q '#define LMC_DIAG_SET_OPERATION_MODE_ENABLED FALSE' \
            Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCDiagnosticsService/LMCDiagnosticsService.st
          git diff -- Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCControlCommandService/LMCControlCommandService.st \
                     Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCDiagnosticsService/LMCDiagnosticsService.st \
            > /tmp/mode08.diff
          grep -q 'LMC_OWNER_KIND_AXIS_OPERATION_MODE\|AxisOperationModeState' /tmp/mode08.diff
          if grep -E '^[-+].*LSL_DECLARATION' /tmp/mode08.diff; then
            echo 'LASAL declaration marker changed' >&2
            exit 1
          fi

      - name: Commit implementation and remove one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/mode08-owner-conflicts.yml .github/workflows/mode08-pr-trigger.yml
          git add Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCControlCommandService/LMCControlCommandService.st
          git add Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCDiagnosticsService/LMCDiagnosticsService.st
          git commit -m 'feat(mode): enforce MODE-08 owner conflicts'
          git push origin HEAD:codex/mode-08-owner-conflicts
