name: MODE-06 owner/TCP patch

on:
  push:
    branches:
      - codex/mode-06-axis-operation-mode

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mode-06-axis-operation-mode
          fetch-depth: 0
      - name: Apply exact LASAL source patch
        shell: python
        run: |
          from pathlib import Path

          def patch_file(path, replacements):
              p = Path(path)
              raw = p.read_bytes()
              text = raw.decode('utf-8')
              nl = '\r\n' if '\r\n' in text else '\n'
              def n(s):
                  return s.replace('\n', nl)
              for label, old, new, expected in replacements:
                  old_n = n(old)
                  new_n = n(new)
                  count = text.count(old_n)
                  if count != expected:
                      raise SystemExit(f'{path}: {label}: expected {expected} match(es), got {count}')
                  text = text.replace(old_n, new_n)
              p.write_bytes(text.encode('utf-8'))

          control = 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCControlCommandService/LMCControlCommandService.st'
          tcp = 'Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/TCPMotionInterface/TCPMotionInterface.st'

          patch_file(control, [
              ('state ABI',
               '#define LMC_OWNER_STATE_QUARANTINED 11\n#define LMC_OWNER_KIND_DIRECT 1',
               '#define LMC_OWNER_STATE_QUARANTINED 11\n#define LMC_OWNER_STATE_AXIS_OPERATION_MODE_ACTIVE 12\n#define LMC_OWNER_KIND_DIRECT 1', 1),
              ('owner kind upper bound',
               '(OwnerKind > LMC_OWNER_KIND_ENCODER) |',
               '(OwnerKind > LMC_OWNER_KIND_AXIS_OPERATION_MODE) |', 1),
              ('reserve identity size',
               'elsif (CommandId = 0x7D15) | (CommandId = 0x7E53) then\n\t\tidentityShapeValid := IdentitySize = 72;',
               'elsif CommandId = 0x7D23 then\n\t\tidentityShapeValid := IdentitySize = 56;\n\telsif (CommandId = 0x7D15) | (CommandId = 0x7E53) then\n\t\tidentityShapeValid := IdentitySize = 72;', 1),
              ('shared SDO resource tuple',
               'elsif ResourceKind = LMC_OWNER_RESOURCE_DIAGNOSTICS_SDO_ENGINE then\n\t\tif (OwnerKind <> LMC_OWNER_KIND_ENCODER) |\n\t\t   (AdmissionMode <> LMC_OWNER_ADMISSION_LIFECYCLE) |\n\t\t   (CommandId <> 0x7E53) | (referenceAxisMask = 0) |\n\t\t   (referenceAxisMask > 0x00000008) |\n\t\t   (RequestedAxisMask <> referenceAxisMask) then\n\t\t\tRETURN;\n\t\tend_if;',
               'elsif ResourceKind = LMC_OWNER_RESOURCE_DIAGNOSTICS_SDO_ENGINE then\n\t\tif (((OwnerKind = LMC_OWNER_KIND_ENCODER) & (CommandId = 0x7E53)) |\n\t\t    ((OwnerKind = LMC_OWNER_KIND_AXIS_OPERATION_MODE) &\n\t\t     (CommandId = 0x7D23))) = FALSE |\n\t\t   (AdmissionMode <> LMC_OWNER_ADMISSION_LIFECYCLE) |\n\t\t   (referenceAxisMask = 0) |\n\t\t   (referenceAxisMask > 0x00000008) |\n\t\t   (RequestedAxisMask <> referenceAxisMask) then\n\t\t\tRETURN;\n\t\tend_if;', 1),
              ('rebase exception',
               '\t\t\t((CommandId = 0x7E53) &\n\t\t\t (OwnerKind = LMC_OWNER_KIND_ENCODER) &\n\t\t\t (ResourceKind = LMC_OWNER_RESOURCE_DIAGNOSTICS_SDO_ENGINE)) |\n\t\t\t(CommandId = 0x2024) | (CommandId = 0x2049);',
               '\t\t\t((CommandId = 0x7E53) &\n\t\t\t (OwnerKind = LMC_OWNER_KIND_ENCODER) &\n\t\t\t (ResourceKind = LMC_OWNER_RESOURCE_DIAGNOSTICS_SDO_ENGINE)) |\n\t\t\t((CommandId = 0x7D23) &\n\t\t\t (OwnerKind = LMC_OWNER_KIND_AXIS_OPERATION_MODE) &\n\t\t\t (ResourceKind = LMC_OWNER_RESOURCE_DIAGNOSTICS_SDO_ENGINE)) |\n\t\t\t(CommandId = 0x2024) | (CommandId = 0x2049);', 1),
              ('validate tuple',
               '\t\t0x7E53:\n\t\t\ttupleValid :=\n\t\t\t\t(OwnerKind = LMC_OWNER_KIND_ENCODER) &',
               '\t\t0x7D23:\n\t\t\ttupleValid :=\n\t\t\t\t(OwnerKind = LMC_OWNER_KIND_AXIS_OPERATION_MODE) &\n\t\t\t\t(ResourceKind = LMC_OWNER_RESOURCE_DIAGNOSTICS_SDO_ENGINE) &\n\t\t\t\t(AdmissionMode = LMC_OWNER_ADMISSION_LIFECYCLE) &\n\t\t\t\t(referenceAxisMask <> 0) &\n\t\t\t\t(referenceAxisMask <= 0x00000008) &\n\t\t\t\t(ExpectedAxisMask = referenceAxisMask);\n\t\t0x7E53:\n\t\t\ttupleValid :=\n\t\t\t\t(OwnerKind = LMC_OWNER_KIND_ENCODER) &', 1),
              ('validate active state',
               '\t\t\t\tLMC_OWNER_KIND_ENCODER:\n\t\t\t\t\texpectedState := LMC_OWNER_STATE_TW20_QUEUED;\n\t\t\telse',
               '\t\t\t\tLMC_OWNER_KIND_ENCODER:\n\t\t\t\t\texpectedState := LMC_OWNER_STATE_TW20_QUEUED;\n\t\t\t\tLMC_OWNER_KIND_AXIS_OPERATION_MODE:\n\t\t\t\t\texpectedState := LMC_OWNER_STATE_AXIS_OPERATION_MODE_ACTIVE;\n\t\t\telse', 1),
              ('commit active state',
               '\t\t\tLMC_OWNER_KIND_ENCODER:\n\t\t\t\tactiveState := LMC_OWNER_STATE_TW20_QUEUED;\n\t\telse',
               '\t\t\tLMC_OWNER_KIND_ENCODER:\n\t\t\t\tactiveState := LMC_OWNER_STATE_TW20_QUEUED;\n\t\t\tLMC_OWNER_KIND_AXIS_OPERATION_MODE:\n\t\t\t\tactiveState := LMC_OWNER_STATE_AXIS_OPERATION_MODE_ACTIVE;\n\t\telse', 1),
              ('publish identity size',
               '\telsif (expectedCommandId = 0x7D15) |\n\t      (expectedCommandId = 0x7E53) then\n\t\tidentityShapeValid := identitySize = 72;',
               '\telsif expectedCommandId = 0x7D23 then\n\t\tidentityShapeValid := identitySize = 56;\n\telsif (expectedCommandId = 0x7D15) |\n\t      (expectedCommandId = 0x7E53) then\n\t\tidentityShapeValid := identitySize = 72;', 1),
          ])

          patch_file(tcp, [
              ('operation mode flag declaration',
               '\t\tdiagnosticsDs402StartValid : BOOL;\n\t\tdiagnosticsDs402PreflightAttempted : BOOL;',
               '\t\tdiagnosticsDs402StartValid : BOOL;\n\t\tdiagnosticsOperationModeStartValid : BOOL;\n\t\tdiagnosticsDs402PreflightAttempted : BOOL;', 1),
              ('operation mode flag init',
               '\t  diagnosticsDs402StartValid := FALSE;\n\t  diagnosticsDs402PreflightAttempted := FALSE;',
               '\t  diagnosticsDs402StartValid := FALSE;\n\t  diagnosticsOperationModeStartValid := FALSE;\n\t  diagnosticsDs402PreflightAttempted := FALSE;', 1),
              ('operation mode owner tuple',
               '\t  if (CommandID = 0x7E53) & (Payload = 72) then\n\t\tdiagnosticsOwnerReference := RequestBuf[48]$UINT;\n\t\tdiagnosticsOwnerKind := 5;\n\t\tdiagnosticsResourceKind := 4;\n\t  elsif (CommandID = 0x7D15) & (Payload = 72) then',
               '\t  if (CommandID = 0x7E53) & (Payload = 72) then\n\t\tdiagnosticsOwnerReference := RequestBuf[48]$UINT;\n\t\tdiagnosticsOwnerKind := 5;\n\t\tdiagnosticsResourceKind := 4;\n\t  elsif (CommandID = 0x7D23) & (Payload = 56) then\n\t\tdiagnosticsOwnerReference := AxisRef$UINT;\n\t\tdiagnosticsOwnerKind := 6;\n\t\tdiagnosticsResourceKind := 4;\n\t  elsif (CommandID = 0x7D15) & (Payload = 72) then', 1),
              ('operation mode exact shape',
               '\t  if diagnosticsDs402StartValid &\n\t\t IsClientConnected(#Diagnostics) &',
               '\t  if (CommandID = 0x7D23) & (Payload = 56) &\n\t\t (diagnosticsAxisMask <> 0) then\n\t\tdiagnosticsOperationModeStartValid :=\n\t\t  (RequestBuf[8]$UINT = 1) &\n\t\t  (RequestBuf[10]$UINT = 0) &\n\t\t  (RequestBuf[12]$UDINT <> 0) &\n\t\t  (RequestBuf[16]$UINT = 1) &\n\t\t  (RequestBuf[18]$UINT = 0) &\n\t\t  (RequestBuf[20]$UDINT <> 0) &\n\t\t  (RequestBuf[24]$UDINT <> 0) &\n\t\t  (RequestBuf[28]$UDINT <> 0) &\n\t\t  (RequestBuf[32]$UDINT = RequestBuf[12]$UDINT) &\n\t\t  ((RequestBuf[36]$UDINT <> 0) |\n\t\t   (RequestBuf[40]$UDINT <> 0) |\n\t\t   (RequestBuf[44]$UDINT <> 0) |\n\t\t   (RequestBuf[48]$UDINT <> 0)) &\n\t\t  (RequestBuf[52]$UINT = AxisRef$UINT) &\n\t\t  (RequestBuf[54]$SINT = 8) &\n\t\t  (RequestBuf[55]$USINT = 0) &\n\t\t  (RequestBuf[56]$UDINT <> 0) &\n\t\t  (RequestBuf[60]$UDINT = 0);\n\t  end_if;\n\t  if diagnosticsDs402StartValid &\n\t\t IsClientConnected(#Diagnostics) &', 1),
              ('reservation predicate',
               '\t  if (diagnosticsAxisMask <> 0) &\n\t\t ((CommandID = 0x7E53) |\n\t\t  (diagnosticsDs402StartValid &\n\t\t   diagnosticsDs402PreflightAccepted)) &',
               '\t  if (diagnosticsAxisMask <> 0) &\n\t\t ((CommandID = 0x7E53) |\n\t\t  diagnosticsOperationModeStartValid |\n\t\t  (diagnosticsDs402StartValid &\n\t\t   diagnosticsDs402PreflightAccepted)) &', 1),
              ('reservation unavailable',
               '\t  elsif diagnosticsDs402StartValid then\n\t\tdiagnosticsAdmissionResult := -3;\n\t  end_if;\n\n    if diagnosticsDs402StartValid &',
               '\t  elsif diagnosticsDs402StartValid | diagnosticsOperationModeStartValid then\n\t\tdiagnosticsAdmissionResult := -3;\n\t  end_if;\n\n    if (diagnosticsDs402StartValid | diagnosticsOperationModeStartValid) &', 1),
              ('admission error payload',
               '      Sendbuf[24]$DINT := RequestBuf[44]$DINT;\n      Sendbuf[28]$UDINT := 0;',
               '      if diagnosticsOperationModeStartValid then\n        Sendbuf[24]$DINT := 8;\n      else\n        Sendbuf[24]$DINT := RequestBuf[44]$DINT;\n      end_if;\n      Sendbuf[28]$UDINT := 0;', 1),
              ('diagnostics invoke gate',
               '    if ((diagnosticsDs402StartValid = FALSE) |\n\t\t  (diagnosticsDs402PreflightAccepted &\n\t\t   (diagnosticsAdmissionResult = 0))) &',
               '    if (((diagnosticsDs402StartValid = FALSE) &\n\t\t  (diagnosticsOperationModeStartValid = FALSE)) |\n\t\t  (diagnosticsDs402StartValid & diagnosticsDs402PreflightAccepted &\n\t\t   (diagnosticsAdmissionResult = 0)) |\n\t\t  (diagnosticsOperationModeStartValid &\n\t\t   (diagnosticsAdmissionResult = 0))) &', 1),
              ('exact reserved response',
               '\t\telsif CommandID = 0x7D15 then\n\t\t  diagnosticsExactAccepted :=',
               '\t\telsif CommandID = 0x7D23 then\n\t\t  diagnosticsExactAccepted :=\n\t\t\t(diagnosticsResponseSize = 24) &\n\t\t\t(Sendbuf[8]$UINT = 1) &\n\t\t\t(Sendbuf[12]$UINT = 0) &\n\t\t\t(Sendbuf[14]$INT = 0) &\n\t\t\t(Sendbuf[16]$UDINT = RequestBuf[12]$UDINT) &\n\t\t\t(Sendbuf[20]$UDINT = 0) &\n\t\t\t(Sendbuf[24]$DINT = 8) &\n\t\t\t(Sendbuf[28]$UDINT = 0);\n\t\t  diagnosticsExactFailure :=\n\t\t\t(diagnosticsResponseSize = 24) &\n\t\t\t(Sendbuf[8]$UINT = 1) &\n\t\t\t(Sendbuf[12]$UINT = 1) &\n\t\t\t(Sendbuf[14]$INT = -31000) &\n\t\t\t(Sendbuf[16]$UDINT = RequestBuf[12]$UDINT) &\n\t\t\t(Sendbuf[20]$UDINT <> 0) &\n\t\t\t(Sendbuf[24]$DINT = 8) &\n\t\t\t(Sendbuf[28]$UDINT = 0);\n\t\telsif CommandID = 0x7D15 then\n\t\t  diagnosticsExactAccepted :=', 1),
          ])

          # Static postconditions: no capability activation and no duplicate resource alias.
          c = Path(control).read_text(encoding='utf-8')
          t = Path(tcp).read_text(encoding='utf-8')
          required = [
              'LMC_OWNER_STATE_AXIS_OPERATION_MODE_ACTIVE 12',
              'CommandId = 0x7D23',
              'LMC_OWNER_KIND_AXIS_OPERATION_MODE',
          ]
          for token in required:
              if token not in c:
                  raise SystemExit(f'missing control postcondition: {token}')
          for token in ['diagnosticsOperationModeStartValid', 'diagnosticsOwnerKind := 6;', 'CommandID = 0x7D23']:
              if token not in t:
                  raise SystemExit(f'missing TCP postcondition: {token}')
          if 'LMC_OWNER_RESOURCE_AXIS_OPERATION_MODE_ENGINE' in c:
              raise SystemExit('duplicate resource alias must not be introduced')
      - name: Validate patch
        run: |
          git diff --check
          git diff -- Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCControlCommandService/LMCControlCommandService.st Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/TCPMotionInterface/TCPMotionInterface.st
      - name: Commit source patch and remove patch workflow
        run: |
          git config user.name "openai-codex[bot]"
          git config user.email "openai-codex[bot]@users.noreply.github.com"
          git add Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/LMCControlCommandService/LMCControlCommandService.st
          git add Lasal_PRG/Elmo_EtherCAT_Test_4Axis/Class/TCPMotionInterface/TCPMotionInterface.st
          git rm .github/workflows/mode06_owner_tcp_patch.yml
          git commit -m "feat(mode): wire SetOperationMode ownership admission"
          git push origin HEAD:codex/mode-06-axis-operation-mode
